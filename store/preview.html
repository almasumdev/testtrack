<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TestTrack store artwork</title>
<style>
body{margin:0;background:#edf3f7;color:#18242e;font:16px/1.5 system-ui,sans-serif}
main{max-width:1200px;margin:auto;padding:32px 24px}h1{margin:0}p{color:#4a5b68}
.wide{display:grid;gap:24px;margin:24px 0}.portraits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
figure{margin:0}img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 4px 20px #18242e18}
figcaption{padding:8px 0}a{color:inherit}@media(max-width:700px){.portraits{grid-template-columns:1fr}}
</style>
<main>
<h1>TestTrack store artwork</h1>
<p>English artwork from signed-out release captures. Screen content is illustrative.
Rebuild with <code>mkit art build</code>. Select any image to inspect its full size.</p>
<div class="wide">
<figure><a href="screenshots/en/01_hero.png"><img src="screenshots/en/01_hero.png" alt="TestTrack testing crew overview"></a><figcaption>Landscape overview · 1920 × 1080</figcaption></figure>
<figure><a href="feature/en.png"><img src="feature/en.png" alt="TestTrack feature graphic"></a><figcaption>Feature graphic · 1024 × 500</figcaption></figure>
</div>
<div class="portraits">
<figure><a href="screenshots/en/02_circle.png"><img src="screenshots/en/02_circle.png" alt="Circle feedback requests in light theme"></a><figcaption>Circle · 1080 × 1920</figcaption></figure>
<figure><a href="screenshots/en/03_ranks.png"><img src="screenshots/en/03_ranks.png" alt="Ranks testing record"></a><figcaption>Ranks · 1080 × 1920</figcaption></figure>
<figure><a href="screenshots/en/04_circle_dark.png"><img src="screenshots/en/04_circle_dark.png" alt="Circle feedback requests in dark theme"></a><figcaption>Dark theme · 1080 × 1920</figcaption></figure>
</div>
</main>
</html>
