# Photo slides for TestTrack (read by mkit scripts/photo_slides/build_app.py).
# Direction: store/art/photos/direction.md. Build: python H:\tools\mkit\scripts\photo_slides\build_app.py .
# Owner's structure: slide 1 landscape hero, the rest portrait, the last slide dark.
# The people photos hold small phones beside the face. phone_w = 200 keeps every photo at its
# native cover scale (no zoom), squeeze = false keeps the photo's own shape (the capture is padded
# instead), and photo_x moves the crop window so the face beside the phone stays whole.
# A lift carries the app detail.
[app]
name = "TestTrack"
shots = "store/art/shots"
photos = "store/art/photos"
icon = "store/art/icon_mono.svg"
font = "Barlow"
erase = []                    # the captures already have a clean 9:41 status bar
status_inset = [0, 0]         # and it sits clear of the phone corners as it is

[palette]
fade = "29,92,130"            # accent #1D5C82
fade_deep = "23,76,110"       # deep #174C6E
fade_dark = "10,22,32"        # the app's dark ground
shadow = "20,47,67"           # ink #142F43
yellow = "#FFC94A"            # tix gold
ink = "#142F43"
sub = "#4F6B80"
go = "#FFC94A"
go_ink = "#142F43"
chip_ink = "#142F43"
ok = "#1D5C82"
avatar = "#5BA9D6"

[hero]
photo = "land_hero.png"
shot = "tonight.png"
title = "12 testers, 14 days|Free and proven"
chips = ["Opens proven", "Tix come back", "Real feedback"]
chip_icons = ["check", "ticket", "chat"]
chip_size = 28
[[hero.card]]
kind = "notify"
tile = "tick"
title = "9 of 12 opened tonight"
sub = "Crew 17, night 6 of 14"
left = 100
top = 770
width = 640

[feature]
photo = "land_feature.png"
shot = "tonight.png"
title = "Get your 12 testers|free, in 14 days"
chips = ["Opens proven", "Tix come back"]
chip_icons = ["check", "ticket"]
chip_size = 22

