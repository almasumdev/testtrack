id = "proof"
photo = "photo_proof.png"
shot = "members.png"
phone_w = 200
photo_x = 0.375
squeeze = false
title = "Every open|is proven"
lift = [{ box = [40, 555, 1040, 1066], width = 1000, radius = 40, dy = 349 }]
