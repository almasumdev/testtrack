# TestTrack store art, built by `mkit art build`.
# Paths are relative to the app folder (where mkit.toml is).
#
# mkit's "pop" layout in TestTrack's own look: the Ocean blue of the app, short bold white
# titles with one word in gold (the tix ticket's gold), big phones, pills naming what is on
# each capture, the testers' app icons popping out around them, and the app's own glass shapes on the ground
# (the same scatter the app draws behind its screens). The robot is the mascot.
#
# Captures: the real app on an emulator at 1080x2340 with gesture navigation, signed in to a
# demo account on a seeded server (demo developers, a crew on day 6, feedback posts), with the
# demo apps installed so every row shows a real icon. Pill and picture positions are page
# pixels (left, top), laid out for English.

layout = "pop"
ornament = "scatter"          # the app's own glass shapes over the ground, no dots
underline_style = "colour"    # the [word] itself in gold, no line under it
reference = "en"

font_dir = "store/art/fonts"
font = "Barlow"
mascot = "docs/design/logo/test-exchange.svg"

# The capture keeps its own status bar: painted over in the colour at `sample`, with a neat
# 9:41, signal and battery drawn in ink to suit it. Capture pixels.
[status_bar]
mode = "clean"
height = 96
sample = [540, 60]

[theme.light]
bg1 = "#5BA9D6"           # a glow from the top...
bg2 = "#2F7FA8"
bg3 = "#174C6E"           # ...to the deep ocean at the bottom
accent = "#1D5C82"        # the app's blue: ticks, the go pill
underline = "#FFC94A"     # the tix gold, under the [word]

[theme.dark]
bg1 = "#1F3A4D"
bg2 = "#122634"
bg3 = "#0A1620"

# ---- The slides, in Play order. Literal pill `text` names something on the capture and is
