<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TestTrack · Five review page designs</title><style>
@font-face{font-family:Barlow;src:url('../../../../app/src/main/res/font/barlow_regular.ttf')}@font-face{font-family:Barlow;src:url('../../../../app/src/main/res/font/barlow_semibold.ttf');font-weight:600}*{box-sizing:border-box}body{margin:0;background:#111e29;color:#eef7fc;font-family:Barlow,system-ui}button,textarea,select{font:inherit}button{cursor:pointer}header{padding:28px 30px 18px;display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;align-items:center}h1{font-size:28px;margin:6px 0}header p,footer{color:#b6cad8;font-size:14px;margin:0}.eyebrow{font-size:10px;letter-spacing:2px;color:#9bd0ef}.controls{display:flex;gap:8px;flex-wrap:wrap}button.control,select{padding:9px 14px;background:#203a4e;color:#eaf4fb;border:1px solid #526c80;border-radius:20px}.control.active{background:#cee8f8;color:#16374d}nav{padding:0 30px 20px;display:flex;gap:8px;flex-wrap:wrap}.gallery{display:grid;grid-template-columns:repeat(5,340px);gap:24px;overflow-x:auto;padding:0 30px 30px;align-items:start}.concept h2{font-size:17px;margin:0 0 12px;font-weight:600}.caption{font-size:13px;color:#b6cad8;line-height:1.5;margin-top:12px;max-width:340px}.phone{height:750px;border:4px solid #3b5264;border-radius:30px;position:relative;overflow:hidden;color:var(--text);background:radial-gradient(ellipse at 25% 12%,var(--washTop),var(--washMiddle) 45%,var(--washLower) 85%,var(--washBottom));isolation:isolate}.shape{position:absolute;z-index:-1;width:75px;height:75px;right:-30px;top:300px;background:var(--shapeFill);border:1px solid var(--shapeRim);border-radius:20px;transform:rotate(25deg)}.shape.two{left:-35px;top:540px;border-radius:50%}.status{height:26px;padding:8px 18px 0;display:flex;justify-content:space-between;font-size:10px}.bar{height:64px;display:flex;align-items:center;gap:9px;padding:0 16px}.bar strong{font-size:17px}.back{font-size:30px;line-height:1}.reward{margin-left:auto;font-size:12px;font-weight:600;color:var(--accentInk)}.content{height:calc(100% - 110px);overflow:auto;padding:8px 16px 24px;scrollbar-width:thin}.gesture{position:absolute;bottom:5px;width:100px;height:4px;border-radius:5px;background:var(--text);left:calc(50% - 50px)}.app{display:flex;align-items:center;gap:10px;margin-bottom:22px}.appicon{width:40px;height:40px;display:grid;place-items:center;background:var(--tile);border-radius:12px;color:var(--tileInk);font-weight:600;font-size:20px}.app b{font-size:14px}.muted{color:var(--text2);font-size:12px;line-height:1.45}.app small{display:block;margin-top:3px;color:var(--text2);font-size:11px}.kicker{font-size:10px;letter-spacing:1.5px;color:var(--accentInk);font-weight:600;text-transform:uppercase;margin-bottom:8px}.phone h3{font-size:29px;line-height:1.12;margin:0 0 10px;font-weight:600;letter-spacing:-.5px}.phone p{font-size:13px;line-height:1.5;color:var(--text2);margin:0}.focus{margin:20px 0}.focus label{font-size:10px;letter-spacing:1px;color:var(--accentInk);display:block;margin-bottom:5px}.focus p{font-size:14px;color:var(--text)}.primary{border:0;background:var(--primary);color:var(--onPrimary);border-radius:13px;width:100%;min-height:48px;font-weight:600;font-size:14px;padding:12px}.smallnote{text-align:center;font-size:10px;color:var(--text2);margin-top:8px}.steps{margin:20px 0}.step{display:flex;gap:12px;position:relative;padding:0 0 20px}.step:last-child{padding-bottom:0}.dot{width:26px;height:26px;flex-shrink:0;border:1px solid var(--glassBorderStrong);border-radius:50%;display:grid;place-items:center;color:var(--text2);font-size:12px}.step.done .dot{color:var(--ok);border-color:var(--ok)}.step.current .dot{background:var(--accentInk);color:var(--glass);border-color:var(--accentInk)}.step .words{padding-top:3px;flex:1}.step b{font-size:14px;font-weight:400;color:var(--text2)}.step.current b{font-weight:600;color:var(--text)}.step small{display:block;font-size:11px;color:var(--text2);line-height:1.4;margin-top:4px}.rail .step:not(:last-child):before{content:'';position:absolute;left:12px;top:31px;bottom:5px;width:1px;background:var(--glassBorder)}.rail .current{padding-bottom:24px}.rail .current .primary{margin-top:13px}.progress{display:flex;gap:5px;margin:20px 0 8px}.progress i{height:4px;border-radius:5px;background:var(--glassBorder);flex:1}.progress i.past{background:var(--ok)}.progress i.now{background:var(--accentInk)}.heroart{height:170px;display:flex;align-items:center;justify-content:center;position:relative}.heroart img{width:136px;height:136px;object-fit:contain}.orbit{position:absolute;width:156px;height:156px;border:1px solid var(--shapeRim);border-radius:50%;z-index:-1}.bigstep{font-size:88px;line-height:1;color:var(--accentInk);font-weight:600;letter-spacing:-5px}.focusmode .content{display:flex;flex-direction:column}.focusmode .app{margin-bottom:6px}.focusmode .action{margin-top:auto;padding-top:20px}.focusmode h3{text-align:center}.focusmode .intro{text-align:center}.focusmode .focus{margin:18px 0}.compact .step{padding:13px 0}.compact .dot{border-radius:8px}.compact .step.current{padding:16px 0}.compact .next{margin:20px 0 18px}.compact .primary{margin-top:16px}.split .bodygrid{display:grid;grid-template-columns:35px 1fr;gap:14px;margin-top:24px}.split .spine{display:flex;flex-direction:column;align-items:center;gap:12px}.spine .line{width:1px;background:var(--glassBorder);height:42px}.split .spine .dot.current{background:var(--accentInk);color:var(--glass)}.split h3{font-size:27px}.split .primary{margin-top:22px}.split .upnext{margin-top:32px}.split .upnext div{margin:14px 0;color:var(--text2);font-size:12px}.notebook .heading{display:flex;align-items:flex-end;gap:15px;margin:8px 0 24px}.notebook .heading .kicker{margin:0 0 6px}.notebook .bigstep{font-size:72px}.notebook .steps{display:flex;gap:16px;margin:12px 0 26px;flex-wrap:wrap}.notebook .word{font-size:12px;color:var(--text2)}.notebook .word.selected{font-weight:600;color:var(--accentInk)}.notebook .prompt{font-size:20px;color:var(--text);line-height:1.35;margin:22px 0}.notebook .action{margin-top:26px}.timer{display:flex;align-items:center;gap:8px;margin:16px 0;font-size:12px;color:var(--accentInk)}.timer svg{width:18px;height:18px}textarea{display:block;width:100%;min-height:110px;background:transparent;border:1px solid var(--fieldBorder);border-radius:12px;padding:12px;color:var(--text);font-size:13px;margin:16px 0;resize:vertical}.upload{padding:20px;border:1px dashed var(--glassBorderStrong);border-radius:12px;margin:16px 0;text-align:center;color:var(--accentInk);font-size:13px}.demo{font-size:11px;margin:12px 0;color:var(--accentInk)}footer{padding:0 30px 25px}.solo .gallery{display:flex;justify-content:center}.solo .concept{width:390px}.solo .phone{height:810px}.solo .concept[hidden]{display:none}.solo .caption{max-width:390px}button:focus-visible,select:focus-visible{outline:2px solid #89ccef;outline-offset:3px}@media(max-width:650px){header{padding:22px 18px}.gallery{padding-left:18px}nav{padding-left:18px}.solo .concept{width:min(390px,calc(100vw - 36px))}}
</style><body><header><div><div class="eyebrow">TESTTRACK / REVIEW PAGE</div><h1>Five ways to guide a review.</h1><p>Same flow and palette. Open layouts instead of stacked cards.</p></div><div class="controls"><button class="control active" id="light" onclick="theme('light')">Light</button><button class="control" id="dark" onclick="theme('dark')">Dark</button><select aria-label="Review type" onchange="live=this.value==='live';step=1;render()"><option value="closed">Closed testing</option><option value="live">Live on Play</option></select><select id="stage" aria-label="Preview stage" onchange="step=+this.value;render()"></select></div></header><nav id="nav"></nav><main class="gallery" id="gallery"></main><footer>Interactive browser concepts with sample Value Guard content. Buttons advance the demo only; no apps are opened, reviews submitted, or tickets spent.</footer><script src="../feedback/palette.js"></script><script>
let live=false,step=1,focus=0,currentTheme='light';const titles=['Editorial timeline','One step at a time','Quiet checklist','Side-rail journey','Review notebook'];const notes=['The whole journey stays visible. Only the active step expands, with its action in place.','A single task takes priority, with a small progress strip and an action near the bottom.','Compact checklist first. The next action is clear, with little scrolling and no container stack.','A narrow progress rail anchors a spacious task area. Upcoming steps are secondary.','A numbered chapter layout with the developer’s focus given prominence. Steps read as a short itinerary.'];
function stages(){return live?['Install','Use','Review','Proof']:['Install','Use','Feedback']}
function heading(){return ['Get the app.','Spend a little time.',live?'Share your experience.':'Tell them what you found.','Send your proof.'][step]}
function detail(){return ['Install Value Guard through Google Play so this review can count.','Explore Value Guard for at least 30 seconds. Return here when you’re ready.',live?'Leave an honest review on Google Play, based on your own experience.':'Write useful feedback here. Mention what worked and what could be clearer.','Attach a screenshot of your Google Play review for the developer to check.'][step]}
function action(){return ['Get it on Play','Open Value Guard',live?'Open Play to review':'Send feedback','Send proof'][step]}
function app(){return `<div class="app"><div class="appicon">V</div><div><b>Value Guard</b><small>${live?'Live on Google Play':'Closed testing'} · Sample request</small></div></div>`}
function question(){return '<div class="focus"><label>DEVELOPER’S FOCUS</label><p>Is it easy to understand your spending at a glance?</p></div>'}
function input(){return step===2&&!live?'<textarea placeholder="What worked well? What could improve?" aria-label="Your feedback"></textarea>':step===3?'<div class="upload">＋ Add review screenshot</div>':step===1?'<div class="timer">◷ <span>30 seconds of use needed</span></div>':''}
function button(id){return `<button class="primary" onclick="advance(${id})">${action()} ↗</button><div class="smallnote">30 tix after your review is approved</div>`}
function progress(){return `<div class="progress">${stages().map((_,i)=>`<i class="${i<step?'past':i===step?'now':''}"></i>`).join('')}</div><p class="muted">Step ${step+1} of ${stages().length}</p>`}
function list(id,expand=false){return `<div class="steps">${stages().map((label,i)=>`<div class="step ${i<step?'done':i===step?'current':''}"><span class="dot">${i<step?'✓':i+1}</span><div class="words"><b>${label}${i<step?' · Done':''}</b>${i===step?`<small>${detail()}</small>${expand?input()+button(id):''}`:''}</div></div>`).join('')}</div>`}
function layout(id){switch(id){case 1:return `${app()}<div class="kicker">A useful second opinion</div><h3>Help make it better.</h3>${question()}<div class="rail">${list(id,true)}</div>`;case 2:return `${app()}${progress()}<div class="heroart"><span class="orbit"></span><img src="../logo/test-exchange.svg" alt="TestTrack robot"></div><h3>${heading()}</h3><p class="intro">${detail()}</p>${question()}${input()}<div class="action">${button(id)}</div>`;case 3:return `${app()}<h3>Your review journey.</h3><p>One useful review. Three small steps.</p>${list(id)}<div class="next"><div class="kicker">Do this next</div><h3 style="font-size:23px">${heading()}</h3>${input()}${button(id)}</div>${question()}`;case 4:return `${app()}<div class="kicker">Step ${step+1} of ${stages().length}</div><div class="bodygrid"><div class="spine">${stages().map((_,i)=>`${i?'<span class="line"></span>':''}<span class="dot ${i===step?'current':''}">${i<step?'✓':i+1}</span>`).join('')}</div><div><h3>${heading()}</h3><p>${detail()}</p>${question()}${input()}${button(id)}<div class="upnext"><div class="kicker">${step===stages().length-1?'After sending':'Coming next'}</div>${stages().slice(step+1).map(x=>`<div>${x} →</div>`).join('')}<div>Developer checks your review</div></div></div></div>`;case 5:return `${app()}<div class="heading"><span class="bigstep">${step+1}</span><div><div class="kicker">Your next step</div><h3 style="font-size:25px;margin:0">${stages()[step]}</h3></div></div><div class="steps">${stages().map((x,i)=>`<span class="word ${i===step?'selected':''}">${i<step?'✓ ':''}${x}</span>`).join('')}</div><p>${detail()}</p><div class="focus"><label>KEEP THIS IN MIND</label><p class="prompt">“Is it easy to understand your spending at a glance?”</p></div>${input()}<div class="action">${button(id)}</div>`}}
function render(){document.getElementById('stage').innerHTML=stages().map((x,i)=>`<option value="${i}" ${step===i?'selected':''}>${x} stage</option>`).join('');document.getElementById('nav').innerHTML=['Compare all',...titles].map((x,i)=>`<button class="control ${focus===i?'active':''}" onclick="focus=${i};render()">${i?i+' · ':''}${x}</button>`).join('');document.body.classList.toggle('solo',focus!==0);document.getElementById('gallery').innerHTML=titles.map((x,i)=>`<article class="concept" ${focus&&focus!==i+1?'hidden':''}><h2>${i+1}. ${x}</h2><div class="phone ${['editorial','focusmode','compact','split','notebook'][i]}"><i class="shape"></i><i class="shape two"></i><div class="status"><span>9:41</span><span>••• ▰</span></div><div class="bar"><span class="back">‹</span><strong>Review app</strong><span class="reward">＋30 tix</span></div><div class="content">${layout(i+1)}</div><div class="gesture"></div></div><p class="caption">${notes[i]}</p></article>`).join('');if(live)document.querySelector('.compact .content > p').textContent='One useful review. Four small steps.';theme(currentTheme)}
function theme(t){currentTheme=t;Object.entries(palettes[t]).forEach(([k,v])=>document.getElementById('gallery').style.setProperty('--'+k,v));document.getElementById('light').classList.toggle('active',t==='light');document.getElementById('dark').classList.toggle('active',t==='dark')}
function advance(id){if(step<stages().length-1){step++;render()}else{const c=document.querySelectorAll('.concept')[id-1].querySelector('.content');c.innerHTML=`${app()}<div class="heroart"><img src="../logo/test-exchange.svg" alt="TestTrack robot"></div><div class="kicker">Demo complete</div><h3>Feedback sent.</h3><p>The developer will check your review. Tickets arrive after approval.</p><button class="primary" style="margin-top:24px" onclick="step=0;render()">Replay demo</button>`}}render();
</script></body></html>
