tion{margin-top:26px}.timer{display:flex;align-items:center;gap:8px;margin:16px 0;font-size:12px;color:var(--accentInk)}.timer svg{width:18px;height:18px}textarea{display:block;width:100%;min-height:110px;background:transparent;border:1px solid var(--fieldBorder);border-radius:12px;padding:12px;color:var(--text);font-size:13px;margin:16px 0;resize:vertical}.upload{padding:20px;border:1px dashed var(--glassBorderStrong);border-radius:12px;margin:16px 0;text-align:center;color:var(--accentInk);font-size:13px}.demo{font-size:11px;margin:12px 0;color:var(--accentInk)}footer{padding:0 30px 25px}.solo .gallery{display:flex;justify-content:center}.solo .concept{width:390px}.solo .phone{height:810px}.solo .concept[hidden]{display:none}.solo .caption{max-width:390px}button:focus-visible,select:focus-visible{outline:2px solid #89ccef;outline-offset:3px}@media(max-width:650px){header{padding:22px 18px}.gallery{padding-left:18px}nav{padding-left:18px}.solo .concept{width:min(390px,calc(100vw - 36px))}}

.phone .content{display:flex;flex-direction:column;padding:8px 18px 24px}.phone .app{margin-bottom:14px}.phone .action{margin-top:auto;padding-top:20px}.phone .task-center{text-align:center}.phone .task-center h3{font-size:27px}.phone .look{margin:20px 0 0}.look span{font-size:9px;letter-spacing:1.1px;color:var(--text2)}.look p{color:var(--text);font-size:14px;margin-top:5px;line-height:1.45}.phone .primary{border-radius:14px;min-height:49px}.scene{height:175px;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin:12px 0 14px}.scene img{width:113px;height:126px;object-fit:contain;position:absolute;left:26px;bottom:8px;transform:rotate(-5deg)}.phone-art{width:83px;height:145px;border:3px solid var(--accentInk);border-radius:18px;transform:rotate(9deg);margin-left:80px;padding:9px;background:var(--glass);box-shadow:8px 10px 0 var(--shapeFill)}.phone-speaker{width:23px;height:3px;background:var(--accentInk);border-radius:5px;margin:0 auto 11px}.demo-app{width:28px;height:28px;background:var(--tile);border-radius:8px;color:var(--tileInk);font-weight:600;display:grid;place-items:center;margin-bottom:12px}.demo-line{height:4px;background:var(--glassBorderStrong);width:45px;border-radius:3px;margin:6px 0}.demo-line.short{width:30px}.demo-bars{height:25px;display:flex;gap:5px;align-items:end;margin-top:9px}.demo-bars i{background:var(--accentInk);width:10px;height:17px;border-radius:3px}.demo-bars i:nth-child(2){height:25px}.demo-bars i:nth-child(3){height:11px}.focus-a .progress{margin:7px 0}.focus-a .content>p.muted{text-align:right;font-size:10px}.focus-a .look{text-align:left}.spotlight{text-align:center;padding:18px 0 28px}.spotlight .large-app{width:76px;height:76px;border-radius:22px;font-size:38px;margin:0 auto 15px}.spotlight h3{font-size:24px;margin-bottom:5px}.spotlight p{font-size:11px}.spot-task h3{font-size:27px}.spot-task .kicker{margin-bottom:9px}.usage-inline{display:flex;align-items:center;gap:12px;margin-top:21px}.usage-inline b{font-size:24px;font-weight:600;color:var(--accentInk)}.usage-inline span{font-size:11px;color:var(--text2);max-width:90px}.trail{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.trail>span{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px}.trail small{font-size:10px}.trail .on{color:var(--accentInk);font-weight:600}.trail .done{color:var(--ok)}.dial{position:relative;width:200px;height:200px;margin:10px auto 25px;flex-shrink:0}.dial>svg{width:100%;height:100%;transform:rotate(-90deg)}.dial circle{fill:none;stroke-width:5}.track-circle{stroke:var(--glassBorder)}.active-circle{stroke:var(--accentInk);stroke-linecap:round}.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:8px}.dial strong{font-size:60px;font-weight:600;letter-spacing:-2px;color:var(--text);line-height:1}.dial strong small{font-size:25px;color:var(--text2);font-weight:400}.dial-center>span{font-size:9px;letter-spacing:1px;margin-top:10px;color:var(--text2)}.dial>img{position:absolute;bottom:-14px;right:-3px;width:75px;height:82px;object-fit:contain}.focus-c .look{text-align:center}.guide{display:flex;align-items:center;gap:10px;margin:28px 0 18px}.guide img{width:92px;height:102px;object-fit:contain;flex-shrink:0}.guide h3{font-size:27px;margin-bottom:0}.guide .kicker{font-size:9px}.guide-copy{font-size:15px!important;line-height:1.6!important}.guide-question{margin:24px 0}.guide-question p{font-size:23px;line-height:1.35;color:var(--text);font-weight:600;letter-spacing:-.3px}.guide-question span{display:block;font-size:11px;color:var(--text2);margin-top:12px}.guide-now{display:flex;gap:10px;align-items:flex-start;margin:12px 0}.now-dot{width:7px;height:7px;border-radius:50%;background:var(--accentInk);margin-top:5px;flex-shrink:0}.guide-now strong{font-size:13px;font-weight:600}.guide-now p{font-size:11px;margin-top:4px}.focus-e .content{padding:8px 0 0}.sheet-top{padding:0 18px}.sheet-scene{height:158px;margin:8px 0 18px}.sheet-scene img{left:39px;width:105px}.top-progress{display:flex;justify-content:space-between;margin:0 0 18px;align-items:center}.top-progress span{font-size:9px;letter-spacing:1px;color:var(--text2)}.top-progress strong{font-size:13px;color:var(--accentInk)}.task-sheet{border-radius:26px 26px 0 0;background:var(--glass);padding:24px 20px;flex:1;display:flex;flex-direction:column}.task-sheet h3{font-size:27px}.task-sheet .look{margin-top:18px}.focus-e .smallnote{font-size:10px}.solo .phone{height:810px}.phone textarea{min-height:100px}.focus-c textarea,.focus-a textarea{min-height:80px}.focus-e textarea{min-height:75px}
</style><body><header><div><div class="eyebrow">TESTTRACK / REVIEW PAGE</div><h1>Five new takes on the focused review.</h1><p>Based on option 2: one task, one action. Five different compositions.</p></div><div class="controls"><button class="control active" id="light" onclick="theme('light')">Light</button><button class="control" id="dark" onclick="theme('dark')">Dark</button><select aria-label="Review type" onchange="live=this.value==='live';step=1;render()"><option value="closed">Closed testing</option><option value="live">Live on Play</option></select><select id="stage" aria-label="Preview stage" onchange="step=+this.value;render()"></select></div></header><nav id="nav"></nav><main class="gallery" id="gallery"></main><footer>Interactive browser concepts with sample Value Guard content. Buttons advance the demo only; no apps are opened, reviews submitted, or tickets spent.</footer><script src="../feedback/palette.js"></script><script>
let live=false,step=1,focus=0,currentTheme='light';const titles=['Illustrated focus','App spotlight','Progress dial','Guided conversation','Bottom action sheet'];const notes=['Original direction, tightened: robot above the task, short copy, and one anchored action.','The app leads: a large app mark, direct instructions, and a small journey strip at the bottom.','Usage is the main visual: an integrated progress dial makes the current task immediately readable.','The robot guides from the side. A short prompt and task sit together without a stack of panels.','An open illustration above a single bottom sheet holding the task and action.'];
function stages(){return live?['Install','Use','Review','Proof']:['Install','Use','Feedback']}
function heading(){return ['Get the app.','Spend a little time.',live?'Share your experience.':'Tell them what you found.','Send your proof.'][step]}
function detail(){return ['Install Value Guard through Google Play so this review can count.','Explore Value Guard for at least 30 seconds. Return here when you’re ready.',live?'Leave an honest review on Google Play, based on your own experience.':'Write useful feedback here. Mention what worked and what could be clearer.','Attach a screenshot of your Google Play review for the developer to check.'][step]}
function action(){return ['Get it on Play','Open Value Guard',live?'Open Play to review':'Send feedback','Send proof'][step]}
function app(){return `<div class="app"><div class="appicon">V</div><div><b>Value Guard</b><small>${live?'Live on Google Play':'Closed testing'} · Sample request</small></div></div>`}
function question(){return '<div class="focus"><label>DEVELOPER’S FOCUS</label><p>Is it easy to understand your spending at a glance?</p></div>'}
function input(){return step===2&&!live?'<textarea placeholder="What worked well? What could improve?" aria-label="Your feedback"></textarea>':step===3?'<div class="upload">＋ Add review screenshot</div>':step===1?'<div class="timer">◷ <span>30 seconds of use needed</span></div>':''}
function button(id){return `<button class="primary" onclick="advance(${id})">${action()} ↗</button><div class="smallnote">30 tix after your review is approved</div>`}
function progress(){return `<div class="progress">${stages().map((_,i)=>`<i class="${i<step?'past':i===step?'now':''}"></i>`).join('')}</div><p class="muted">Step ${step+1} of ${stages().length}</p>`}
function list(id,expand=false){return `<div class="steps">${stages().map((label,i)=>`<div class="step ${i<step?'done':i===step?'current':''}"><span class="dot">${i<step?'✓':i+1}</span><div class="words"><b>${label}${i<step?' · Done':''}</b>${i===step?`<small>${detail()}</small>${expand?input()+button(id):''}`:''}</div></div>`).join('')}</div>`}
function illustration(kind){return `<div class="scene ${kind}"><div class="phone-art"><div class="phone-speaker"></div><div class="demo-app">V</div><div class="demo-line"></div><div class="demo-line short"></div><div class="demo-bars"><i></i><i></i><i></i></div></div><img src="../logo/test-exchange.svg" alt="TestTrack robot"></div>`}
function trail(){return `<div class="trail">${stages().map((label,i)=>`<span class="${i===step?'on':i<step?'done':''}">${i<step?'✓':i+1}<small>${label}</small></span>`).join('')}</div>`}
function brief(){return ['Install it from Google Play to begin.','Explore the app for at least 30 seconds, then return here.',live?'Leave an honest review on Google Play.':'Share what worked and what could improve.','Add a screenshot of your Google Play review.'][step]}
function taskTitle(){return ['Get Value Guard','Try it for yourself',live?'Leave your review':'Share your feedback','Show your review'][step]}
function editor(){return step>=2?input():''}
function lookAt(){return '<div class="look"><span>LOOK OUT FOR</span><p>Is your spending easy to understand at a glance?</p></div>'}
function layout(id){switch(id){case 1:return `${app()}${progress()}${illustration('buddy')}<div class="task-center"><h3>${taskTitle()}</h3><p>${brief()}</p></div>${lookAt()}${editor()}<div class="action">${button(id)}</div>`;
case 2:return `<div class="spotlight"><div class="appicon large-app">V</div><h3>Value Guard</h3><p>${live?'Live on Google Play':'Closed testing'} · 30 tix after approval</p></div><div class="spot-task"><div class="kicker">Step ${step+1} of ${stages().length}</div><h3>${taskTitle()}</h3><p>${brief()}</p>${step===1?'<div class="usage-inline"><b>30 sec</b><span>Minimum time in the app</span></div>':''}${lookAt()}${editor()}</div><div class="action">${button(id)}${trail()}</div>`;
case 3:return `${app()}<div class="dial"><svg viewBox="0 0 220 220"><circle class="track-circle" cx="110" cy="110" r="95"/><circle class="active-circle" cx="110" cy="110" r="95" pathLength="100" stroke-dasharray="${step===1?25:(step+1)/stages().length*100} 100"/></svg><div class="dial-center">${step===1?'<strong>0<small>/30</small></strong><span>SECONDS IN APP</span>':`<strong>${step+1}<small>/${stages().length}</small></strong><span>CURRENT STEP</span>`}</div><img src="../logo/test-exchange.svg" alt="TestTrack robot"></div><div class="task-center"><h3>${taskTitle()}</h3><p>${brief()}</p></div>${lookAt()}${editor()}<div class="action">${button(id)}</div>`;
case 4:return `${app()}<div class="guide"><img src="../logo/test-exchange.svg" alt="TestTrack robot"><div><div class="kicker">A little guidance</div><h3>${step===1?'Give it a proper try.':taskTitle()}</h3></div></div><p class="guide-copy">${brief()}</p><div class="guide-question"><p>“Is your spending easy to understand at a glance?”</p><span>What the developer wants to know</span></div>${editor()}<div class="guide-now"><span class="now-dot"></span><div><strong>${stages()[step]} is your current step</strong><p>${step===1?'Your time counts while the app is open.':'Continue when you are ready.'}</p></div></div><div class="action">${button(id)}${trail()}</div>`;
case 5:return `<div class="sheet-top">${app()}${illustration('sheet-scene')}<div class="top-progress"><span>YOUR REVIEW JOURNEY</span><strong>${step+1} / ${stages().length}</strong></div></div><div class="task-sheet"><div class="kicker">${stages()[step]}</div><h3>${taskTitle()}</h3><p>${brief()}</p>${lookAt()}${editor()}<div class="action">${button(id)}</div></div>`}}

function render(){document.getElementById('stage').innerHTML=stages().map((x,i)=>`<option value="${i}" ${step===i?'selected':''}>${x} stage</option>`).join('');document.getElementById('nav').innerHTML=['Compare all',...titles].map((x,i)=>`<button class="control ${focus===i?'active':''}" onclick="focus=${i};render()">${i?i+' · ':''}${x}</button>`).join('');document.body.classList.toggle('solo',focus!==0);document.getElementById('gallery').innerHTML=titles.map((x,i)=>`<article class="concept" ${focus&&focus!==i+1?'hidden':''}><h2>${i+1}. ${x}</h2><div class="phone ${['focus-a','focus-b','focus-c','focus-d','focus-e'][i]}"><i class="shape"></i><i class="shape two"></i><div class="status"><span>9:41</span><span>••• ▰</span></div><div class="bar"><span class="back">‹</span><strong>Review app</strong><span class="reward">＋30 tix</span></div><div class="content">${layout(i+1)}</div><div class="gesture"></div></div><p class="caption">${notes[i]}</p></article>`).join('');theme(currentTheme)}
function theme(t){currentTheme=t;Object.entries(palettes[t]).forEach(([k,v])=>document.getElementById('gallery').style.setProperty('--'+k,v));document.getElementById('light').classList.toggle('active',t==='light');document.getElementById('dark').classList.toggle('active',t==='dark')}
function advance(id){if(step<stages().length-1){step++;render()}else{const c=document.querySelectorAll('.concept')[id-1].querySelector('.content');c.innerHTML=`${app()}<div class="heroart"><img src="../logo/test-exchange.svg" alt="TestTrack robot"></div><div class="kicker">Demo complete</div><h3>Feedback sent.</h3><p>The developer will check your review. Tickets arrive after approval.</p><button class="primary" style="margin-top:24px" onclick="step=0;render()">Replay demo</button>`}}render();
</script></body></html>
