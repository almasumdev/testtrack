<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Crew chat components</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:TtBarlow;src:url(../../../app/src/main/res/font/barlow_regular.ttf);font-weight:400}
@font-face{font-family:TtBarlow;src:url(../../../app/src/main/res/font/barlow_medium.ttf);font-weight:500}
@font-face{font-family:TtBarlow;src:url(../../../app/src/main/res/font/barlow_semibold.ttf);font-weight:600}
@font-face{font-family:TtBarlow;src:url(../../../app/src/main/res/font/barlow_bold.ttf);font-weight:700}
@font-face{font-family:TtMono;src:url(../../../app/src/main/res/font/plexmono_medium.ttf);font-weight:400 500}
@font-face{font-family:TtMono;src:url(../../../app/src/main/res/font/plexmono_semibold.ttf);font-weight:600}
@font-face{font-family:TtMono;src:url(../../../app/src/main/res/font/plexmono_bold.ttf);font-weight:700}

:root{
  --photo:#000;--onPhoto:#fff;--photoScrim:rgba(0,0,0,.5);--photoBad:#FF8A80;
}
[data-theme=light]{
  --bg:#F7FCFF;--text:#142F43;--text2:#203A4E;--text3:#223D50;--text4:#59758A;
  --glass:#F2F9FD;--glass2:#DFEDF6;--glassBorder:#B7D1E2;--glassBorderStrong:#789AAF;--hair:#B7D1E2;
  --accent:#3A5B73;--onAccent:#fff;--accentInk:#22394B;--badgeFill:#3A5B73;--tile:#DCE6EE;--tileInk:#3A5B73;
  --leafSoft:rgba(74,114,144,.16);--tabSelected:#2E4E66;
  --ok:#246B59;--okBg:rgba(36,107,89,.12);--bad:#9E3B2E;--badBg:rgba(158,59,46,.12);--badBorder:rgba(158,59,46,.24);--onBad:#fff;
  --field:#F7FCFF;--fieldBorder:#789AAF;--scrim:rgba(20,34,48,.46);--sheetScrim:rgba(20,34,48,.32);
  --surface3:#C7DEED;--inverse:#172F42;--onInverse:#EFF7FC;--sheet:#FFFFFF;--card:#F3F8FB;--cardLine:#E1ECF3;
  --shadow:#102F46;--primary:#3A5B73;--onPrimary:#fff;--skTint:rgba(34,57,75,.07);--skHi:rgba(242,249,253,.8);
  --pageBg:#D9E1E7;--pageInk:#1d2b36;
}
[data-theme=dark]{
  --bg:#0F1011;--text:#ECEEF0;--text2:#BCC1C6;--text3:#9DA3A9;--text4:#757C82;
  --glass:#1C1E20;--glass2:#292C2F;--glassBorder:#383C41;--glassBorderStrong:#666D74;--hair:#2B2E32;
  --accent:#4A7290;--onAccent:#fff;--accentInk:#93B3CA;--badgeFill:#4A7290;--tile:#2A2D31;--tileInk:#A2BED2;
  --leafSoft:#2A2D31;--tabSelected:#B6CCDC;
  --ok:#83D8C4;--okBg:rgba(131,216,196,.12);--bad:#E4938A;--badBg:rgba(228,147,138,.15);--badBorder:rgba(228,147,138,.3);--onBad:#3F0D06;
  --field:#141618;--fieldBorder:#666D74;--scrim:rgba(0,0,0,.6);--sheetScrim:rgba(0,0,0,.32);
  --surface3:#2E3236;--inverse:#E8EBEE;--onInverse:#15181A;--sheet:#1C1E20;--card:#1C1E20;--cardLine:#2D3034;
  --shadow:#000;--primary:#93B3CA;--onPrimary:#0F1011;--skTint:rgba(147,179,202,.07);--skHi:rgba(28,30,32,.8);
  --pageBg:#2a2c2f;--pageInk:#e6e8ea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--pageBg);color:var(--pageInk);font-family:TtBarlow,Barlow,sans-serif;padding:24px 28px 80px}
.top{display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;background:var(--pageBg);padding:10px 0 12px}
.top h1{font-size:22px;font-weight:700}
.toggle{display:flex;border-radius:99px;overflow:hidden;border:1px solid var(--glassBorderStrong)}
.toggle button{font:600 14px TtBarlow,Barlow,sans-serif;padding:7px 16px;border:0;background:transparent;color:var(--pageInk);cursor:pointer}
.toggle button.on{background:var(--accent);color:#fff}
.nav-links{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:600}
.nav-links a{color:var(--pageInk);opacity:.75;text-decoration:none}
h2{font-size:19px;font-weight:700;margin:34px 0 14px;padding-top:6px;border-top:1px solid rgba(127,127,127,.35)}
.grid{display:flex;flex-wrap:wrap;gap:26px 22px;align-items:flex-start}
.item{display:flex;flex-direction:column;gap:7px}
.lab{font-size:13.5px;font-weight:700;letter-spacing:.2px}
.lab small{font-weight:500;opacity:.7;margin-left:4px}

/* phone */
.phone{width:360px;height:760px;background:var(--bg);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 0 0 7px #111,0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;color:var(--text)}
.phone.short{height:520px}
.sbar{height:24px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:500 12px TtBarlow,sans-serif;color:var(--text)}
.sbar.dark{color:#fff;background:transparent}
.scr{flex:1;display:flex;flex-direction:column;position:relative;min-height:0}
.navb{height:16px;flex:none;display:flex;align-items:center;justify-content:center}
.navb i{width:108px;height:4px;border-radius:2px;background:var(--text);opacity:.35}
.panel{width:360px;background:var(--bg);border-radius:18px;padding:6px 12px 16px;color:var(--text);position:relative}
.panel.flat{padding:16px}

/* text */
.t{font-family:TtBarlow,Barlow,sans-serif;letter-spacing:.25px}
.mono{font-family:TtMono,'IBM Plex Mono',monospace;font-feature-settings:"tnum"}
svg.ic{display:block;flex:none}

/* top bar */
.pbar{height:64px;flex:none;display:flex;align-items:center;padding:0 4px 0 4px}
.pbar .nav{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.pbar .title{flex:1;min-width:0;display:flex;align-items:center;font:700 22px/28px TtBarlow,sans-serif;color:var(--text)}
.pbar .title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .acts{display:flex;align-items:center;padding-right:16px;position:relative}
.ibtn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* thread */
.thread{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:4px 12px 10px}
.row{display:flex;align-items:flex-end;width:100%}
.row.mine{justify-content:flex-end}
.col{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.row.mine .col{align-items:flex-end}
.who{font:600 12px/16px TtBarlow,sans-serif;letter-spacing:.25px;color:var(--text3);padding:0 0 2px 12px;max-width:270px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub{max-width:270px;padding:7px 10px 6px 12px;position:relative;overflow:hidden}
.bub.q{padding-top:6px}
.words{position:relative;font:400 15px/20px TtBarlow,sans-serif;letter-spacing:.25px;word-wrap:break-word}
.msp{display:inline-block;height:1px}
.meta{position:absolute;right:0;bottom:-2px;display:flex;align-items:center;gap:3px;height:14px}
.time{font:500 10.5px/14px TtMono,'IBM Plex Mono',monospace;font-feature-settings:"tnum";white-space:nowrap}
.mn{font-weight:700}
.mme{font-weight:700;background:var(--tile);color:var(--tileInk)}
.chip{display:inline-flex;align-items:center;vertical-align:middle;height:21px;margin:-2px 0;padding:1px 0}
.chip>span{display:inline-flex;align-items:center;height:19px;border-radius:99px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--cardLine);padding:0 8px 0 3px;gap:5px;font:600 14px/19px TtBarlow,sans-serif;color:var(--text);letter-spacing:.25px}
.quote{display:flex;border-radius:8px;padding:4px 8px 5px 11px;position:relative;overflow:hidden;max-width:240px}
.quote::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--qbar)}
.quote .qw{font:700 12px/16px TtBarlow,sans-serif;letter-spacing:.25px;color:var(--qbar);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote .qt{font:400 13px/17px TtBarlow,sans-serif;letter-spacing:.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--tile);color:var(--tileInk);font:600 14px TtBarlow,sans-serif;letter-spacing:.1px;flex:none;overflow:hidden}
.apptile{display:flex;align-items:center;justify-content:center;flex:none;font-weight:600;font-family:TtBarlow,sans-serif}
.daychip{display:flex;justify-content:center;padding:14px 0 4px}
.daychip span{border-radius:99px;background:var(--glass2);padding:3px 10px;font:600 11.5px/15px TtBarlow,sans-serif;letter-spacing:.25px;color:var(--text3)}
.newline{display:flex;align-items:center;padding-top:14px}
.newline i{flex:1;height:1px;background:var(--glassBorder)}
.newline span{padding:0 8px;font:700 12px/16px TtBarlow,sans-serif;letter-spacing:.25px;color:var(--accentInk)}
.botline{display:flex;justify-content:center;padding:12px 0 2px}
.botline>div{max-width:340px;display:flex;align-items:center;border-radius:99px;padding:3px 12px 3px 5px;gap:7px;font:400 12.5px/17px TtBarlow,sans-serif;letter-spacing:.25px}
.team{margin:12px 0 2px;border-radius:14px;background:var(--bg);padding:10px 14px 12px;outline:1px dashed var(--glassBorder);outline-offset:-.5px}
.failed{display:flex;flex-direction:column;align-items:flex-end;padding:4px 4px 0}
.failed .r{display:flex;align-items:center;font:400 12.5px/17px TtBarlow,sans-serif;letter-spacing:.25px}
.failed .e{font:400 12px/16px TtBarlow,sans-serif;letter-spacing:.25px;color:var(--text3)}
.stub{display:flex;align-items:center;padding:6px 10px 6px 12px;gap:0}
.skel{background:linear-gradient(var(--skTint),var(--skTint)),var(--glass2);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,var(--skHi) 50%,transparent 70%);background-size:300% 100%;animation:sh 2.2s linear infinite}
@keyframes sh{from{background-position:150% 0}to{background-position:-150% 0}}

/* composer */
.cframe{flex:none;background:var(--bg);border-top:1px solid var(--cardLine);padding:6px 12px 12px}
.crow{display:flex;align-items:flex-end;gap:8px}
.rb{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.field{flex:1;min-height:48px;border-radius:24px;background:var(--bg);padding:13px 16px;display:flex;align-items:flex-end;gap:8px;font:400 15px/20px TtBarlow,sans-serif;letter-spacing:.25px;min-width:0}
.field .ph{color:var(--text4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.field .tx{color:var(--text);flex:1;min-width:0}
.caret{display:inline-block;width:2px;height:18px;background:var(--accentInk);vertical-align:-3px;margin-left:1px}
.left{font:500 12px/20px TtMono,'IBM Plex Mono',monospace;color:var(--text4);white-space:nowrap}
.pbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--badgeFill);box-shadow:0 0 0 1.5px var(--bg);padding:0 4px;display:flex;align-items:center;justify-content:center;font:700 10.5px/13px TtMono,monospace;color:var(--onAccent)}
.cline{display:flex;gap:6px;padding:7px 8px 0;font:400 13px/17px TtBarlow,sans-serif;letter-spacing:.25px}
.tip{position:absolute;left:12px;bottom:calc(100% + 2px);max-width:260px;border-radius:12px;background:var(--inverse);color:var(--onInverse);padding:8px 12px;font:400 13px/17px TtBarlow,sans-serif;letter-spacing:.25px;z-index:5}
.closed{display:flex;align-items:center;gap:10px;border-radius:14px;background:var(--glass2);padding:12px 14px;font:400 13.5px/18px TtBarlow,sans-serif;letter-spacing:.25px;color:var(--text2)}

/* sheets and dialogs */
.ov{position:absolute;inset:0;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--glass);border-radius:22px 22px 0 0;z-index:21;padding:0 16px 16px;display:flex;flex-direction:column}
.handle{align-self:center;width:38px;height:4px;border-radius:2px;background:var(--text4);opacity:.5;margin:10px 0 14px}
.stitle{font:700 17px/22px TtBarlow,sans-serif;letter-spacing:.15px;color:var(--text);margin-bottom:14px}
.srow{display:flex;align-items:center;min-height:58px;padding:4px 0;gap:14px}
.srow .tt{font:600 16px/20px TtBarlow,sans-serif;letter-spacing:.25px}
.srow .ln{font:400 12.5px/16px TtBarlow,sans-serif;letter-spacing:.25px;color:var(--text3)}
.itile{border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.shead{font:700 13px/17px TtBarlow,sans-serif;letter-spacing:.25px;color:var(--text3);padding:14px 0 2px}
.search{height:48px;border-radius:24px;background:var(--field);box-shadow:inset 0 0 0 1.2px var(--fieldBorder);display:flex;align-items:center;padding:0 11px 0 14px;gap:10px;font:500 15px TtBarlow,sans-serif;letter-spacing:.5px}
.menu{position:absolute;top:52px;right:16px;background:var(--sheet);border-radius:14px;padding:8px 0;z-index:22;box-shadow:0 3px 10px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.12)}
.mrow{width:214px;min-height:48px;display:flex;align-items:center;gap:12px;padding:8px 16px}
.dlgwrap{position:absolute;left:22px;right:22px;top:50%;transform:translateY(-50%);z-index:21}
.dlg{background:var(--glass);border-radius:18px;padding:18px 16px 14px;position:relative}
.dlg h3{font:700 16px/21px TtBarlow,sans-serif;letter-spacing:.15px;color:var(--text)}
.dlg p{font:400 13.5px/19.5px TtBarlow,sans-serif;letter-spacing:.25px;color:var(--text2);margin-top:6px}
.btns{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}
.btn{height:52px;border-radius:26px;padding:0 18px;display:flex;align-items:center;font:600 14px TtBarlow,sans-serif;letter-spacing:.1px}
.pmsg{padding:6px 16px}
.pmsg>div{display:flex;align-items:center;gap:10px;border-radius:14px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glassBorder);padding:11px 10px 11px 14px;font:400 14px/19px TtBarlow,sans-serif;letter-spacing:.25px;color:var(--text)}

/* photo screens */
.dark-scr{background:#000;color:#fff}
.ebtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.schip{min-height:36px;border-radius:18px;padding:8px 14px;font:600 14px/20px TtBarlow,sans-serif;letter-spacing:.1px;flex:none}

/* entry */
.crewcard{border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--cardLine);padding:16px}
.fab{height:52px;min-width:52px;border-radius:26px;display:inline-flex;align-items:center;position:relative}
.track{border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--cardLine);padding:4px;display:flex;gap:2px}
.seg{height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex:1;font:500 14px TtBarlow,sans-serif;letter-spacing:.1px}
</style>
</head>

</div>

<script>
const A = window.ASSETS;
document.getElementById('robotdefs').innerHTML = A.defs;

/* ---------- small helpers ---------- */
const ic = (n, s, c, sw = 2) =>
  `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${A.icons[n]}</svg>`;
const back = () =>
  `<svg class="ic" width="24" height="24" viewBox="0 0 24 24"><path fill="var(--text)" d="M17.77,3.77L16,2L6,12l10,10l1.77,-1.77L9.54,12z"/></svg>`;
const v = n => `var(--${n})`;
const R = A.robot;

function botFace(size) {
  return `<svg class="ic" width="${size}" height="${size}" viewBox="12 -105 860 860" style="overflow:hidden">${R.level_robot_antenna}${R.level_robot_head}${R.level_robot_eyes}</svg>`;
}
function robotPlug(size) {
  const h = size * 980 / 880;
  return `<div style="width:${size}px;height:${h + size * .16}px;position:relative;display:flex;justify-content:center;align-items:flex-end">
    <div style="width:${size * .6}px;height:${size * .1}px;border-radius:50%;background:var(--shadow);opacity:.18"></div>
    <svg width="${size}" height="${h}" viewBox="0 0 880 980" style="position:absolute;left:0;top:${size * .06}px">
      ${R.level_robot_body}${R.level_robot_head}${R.robot_prop_plug_face}${R.level_robot_antenna}${R.robot_prop_plug_left}${R.robot_prop_plug_right}${R.robot_prop_plug_spark}${R.level_robot_hands}
    </svg></div>`;
}
function dialogRobot() {
  const w = 96, f = 96 * 980 / 880, lift = 96 * 262 / 880;
  return {
    head: `<svg width="${w}" height="${f}" viewBox="0 0 880 980" style="position:absolute;right:10px;top:0;z-index:0">${R.level_robot_antenna}${R.level_robot_head}${R.level_robot_eyes}</svg>`,
    hands: `<svg width="${w}" height="${f}" viewBox="0 0 880 980" style="position:absolute;right:10px;top:${-lift}px;z-index:2;pointer-events:none">${R.level_robot_hands}</svg>`,
    rise: 96 * 540 / 880,
  };
}
function hueOf(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) | 0; return ((h % 360) + 360) % 360; }
function appMark(name, size) {
  const h = hueOf(name);
  const dark = document.documentElement.dataset.theme === 'dark';
  const fill = dark ? `hsl(${h},30%,18%)` : `hsl(${h},45%,89%)`;
  const ink = dark ? `hsl(${h},55%,76%)` : `hsl(${h},50%,32%)`;
  return `<span class="apptile" style="width:${size}px;height:${size}px;border-radius:${size * .3}px;background:${fill};color:${ink};font-size:${Math.min(16, size * .5)}px">${name[0]}</span>`;
}
function avatar(name, size = 28) {
  return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${size >= 60 ? 26 : 14}px">${name[0]}</span>`;
}
const skel = (w, h, r, extra = '') => `<div class="skel" style="width:${w};height:${h}px;border-radius:${r}px;${extra}"></div>`;

/* ---------- people ---------- */
const P = {
  maya: { name: 'Maya Chen', app: 'Habit Grove: Daily Tracker' },
  arif: { name: 'Arif Rahman', app: 'Pix Clean' },
  lena: { name: 'Lena Novak', app: 'Budget Buddy: Simple Money' },
  me: { name: 'Sam Park', app: 'Quiet Hours' },
};
const short = a => a.split(':')[0].trim();
const CREW = 'Crew 7';

/* ---------- message text pieces ---------- */
const mention = (n, mine) => `<span class="mn" style="color:${mine ? '#fff' : v('accentInk')}">@${n}</span>`;
const mentionMe = n => `<span class="mme">@${n}</span>`;
const appChip = a => `<span class="chip"><span>${appMark(a, 17)}${short(a)}</span></span>`;

/* ---------- bubble pieces ---------- */
function shape(mine, first, last) {
  const top = first ? 18 : 4, bot = last ? 18 : 4;
  return mine ? `18px ${top}px ${bot}px 18px` : `${top}px 18px 18px ${bot}px`;
}
function metaHtml(time, send, ink) {
  let s = `<span class="time" style="color:${ink}">${time}</span>`;
  if (send === 'sending') s += ic('clock', 11, ink);
  if (send === 'failed') s += ic('circle-alert', 11, v('bad'));
  return s;
}
function metaW(time, send) { return 8 + time.length * 6.3 + (send !== 'sent' ? 14 : 0); }
function quoteHtml(q, mine, maxW = 240, extra = '') {
  const bar = mine ? '#fff' : v('accentInk');
  const fill = mine ? 'rgba(255,255,255,.16)' : v('bg');
  const ink = mine ? 'rgba(255,255,255,.82)' : q.deleted ? v('text4') : v('text2');

function pictureBubble(o) {
  const mine = !!o.mine, first = o.first !== false, last = o.last !== false;
  const W = 259, send = o.send || 'sent', time = o.time || '8:15 PM';
  const ratio = { portrait: .75, landscape: 16 / 9, tall: 9 / 20 }[o.kind || 'portrait'];

const hl = (text, q) => { if (!q) return text; const i = text.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? text : `${text.slice(0, i)}<b style="color:${v('accentInk')};font-weight:700">${text.slice(i, i + q.length)}</b>${text.slice(i + q.length)}`; };
function mentionSheet(q = '') {
  const people = [P.arif, P.lena, P.maya];
  const match = p => !q || p.name.toLowerCase().includes(q) || p.app.toLowerCase().includes(q);

function penColours(picked) {
  return `<div style="display:flex;align-items:center;gap:10px;overflow:hidden">${PENS.map(c => { const on = c === picked; const s = on ? 32 : 26; return `<span style="width:${s}px;height:${s}px;border-radius:50%;background:${c};box-shadow:inset 0 0 0 ${on ? 3 : 1.5}px #fff;flex:none"></span>`; }).join('')}</div>`;
}
function editorCanvas(mode, extra = '') {
  const inset = mode === 'crop' ? 28 : 0;
  const strokes = `<svg viewBox="0 0 300 400" width="100%" height="100%" style="position:absolute;inset:0"><path d="M70 160 C95 140 150 150 170 175 S220 230 200 250" fill="none" stroke="#F44336" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="330" text-anchor="middle" font-family="Roboto,Arial,sans-serif" font-weight="700" font-size="30" fill="#FFEB3B" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))">Stuck here</text></svg>`;
  let pic;
  if (mode === 'crop') {
    const w = 360 - inset * 2, h = w / .75;
    pic = `<div style="position:absolute;left:${inset}px;top:50%;width:${w}px;height:${h}px;transform:translateY(-50%)">${shot('portrait')}${strokes}
      <div style="position:absolute;left:0;right:0;top:0;height:14%;background:${v('photoScrim')}"></div>
      <div style="position:absolute;left:0;right:0;bottom:0;height:10%;background:${v('photoScrim')}"></div>
      <div style="position:absolute;left:0;top:14%;bottom:10%;width:8%;background:${v('photoScrim')}"></div>
      <div style="position:absolute;right:0;top:14%;bottom:10%;width:8%;background:${v('photoScrim')}"></div>
      <div style="position:absolute;left:8%;right:8%;top:14%;bottom:10%;box-shadow:inset 0 0 0 1.5px #fff">
        <i style="position:absolute;left:33.3%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.45)"></i><i style="position:absolute;left:66.6%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.45)"></i>
        <i style="position:absolute;top:33.3%;left:0;right:0;height:1px;background:rgba(255,255,255,.45)"></i><i style="position:absolute;top:66.6%;left:0;right:0;height:1px;background:rgba(255,255,255,.45)"></i>
        ${[['left', 'top'], ['right', 'top'], ['left', 'bottom'], ['right', 'bottom']].map(([x, y]) => `<i style="position:absolute;${x}:-4px;${y}:-4px;width:22px;height:4px;background:#fff"></i><i style="position:absolute;${x}:-4px;${y}:-4px;width:4px;height:22px;background:#fff"></i>`).join('')}
      </div></div>`;
  } else {
    pic = `<div style="position:absolute;left:0;top:50%;width:360px;height:480px;transform:translateY(-50%)">${shot('portrait')}${mode === 'fresh' ? '' : strokes}</div>`;
  }
  return `<div style="flex:1;position:relative;overflow:hidden">${pic}${extra}</div>`;
}
function captionBar(o = {}) {
  const prob = o.problem ? `<div style="display:flex;gap:6px;padding:0 8px 8px;color:${v('photoBad')};font:400 12px/16px TtBarlow,sans-serif;letter-spacing:.4px">${ic('circle-alert', 15, v('photoBad'))}<span>${o.problem}</span></div>` : '';

  return `<div style="padding:8px 12px 12px;flex:none">${prob}<div style="display:flex;align-items:flex-end;gap:8px"><div style="flex:1;min-height:48px;border-radius:24px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px ${o.problem ? v('photoBad') : 'transparent'};padding:13px 16px;font:400 15px/20px TtBarlow,sans-serif;letter-spacing:.5px;color:${o.text ? '#fff' : 'rgba(255,255,255,.6)'}">${o.text || 'Add a caption...'}${o.text ? '<span class="caret" style="background:#fff"></span>' : ''}</div><div class="rb" style="width:48px;height:48px;background:${canSend ? v('accent') : 'rgba(255,255,255,.18)'}">${ic('send', 20, canSend ? '#fff' : 'rgba(255,255,255,.4)')}</div></div></div>`;
}
function editor(mode, o = {}) {
  let bottom;
  if (mode === 'draw') bottom = `<div style="padding:10px 16px;flex:none">${penColours('#F44336')}<div style="display:flex;align-items:center;margin-top:6px;gap:8px"><div style="width:36px;height:36px;display:flex;align-items:center;justify-content:center"><span style="width:6px;height:6px;border-radius:50%;background:#F44336"></span></div><div style="flex:1;position:relative;height:36px"><i style="position:absolute;left:0;right:0;top:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)"></i><i style="position:absolute;left:0;width:15%;top:16px;height:4px;border-radius:2px;background:#fff"></i><i style="position:absolute;left:calc(15% - 2px);top:8px;width:4px;height:20px;border-radius:2px;background:#fff"></i></div></div></div>`;
  else if (mode === 'crop') bottom = `<div style="display:flex;align-items:center;padding:12px;gap:10px;flex:none">${ebtn('rotate-cw')}<div style="flex:1;display:flex;gap:6px;overflow:hidden">${['Free', '1:1', '4:3', '3:4', '16:9'].map((l, i) => `<span class="schip" style="background:${i === 0 ? '#fff' : v('photoScrim')};color:${i === 0 ? '#000' : '#fff'}">${l}</span>`).join('')}</div>${ebtn('check', true)}</div>`;
  else bottom = captionBar(o);
  const words = o.words ? `<div style="position:absolute;inset:0;background:${v('photoScrim')};display:flex;flex-direction:column;z-index:3"><div style="display:flex;align-items:center;padding:10px 12px 0 16px;gap:10px"><div style="flex:1;overflow:hidden">${penColours('#FFFFFF')}</div><span style="background:#fff;color:#000;border-radius:20px;padding:9px 18px;font:700 14px TtBarlow,sans-serif">Done</span></div><div style="flex:1;display:flex;align-items:center;justify-content:center;padding:0 24px;text-align:center;font:700 30px/36px TtBarlow,sans-serif;color:#FFFFFF">Login loops<span class="caret" style="background:#fff;height:32px;vertical-align:-5px"></span></div></div>` : '';
  return phone(`<div style="flex:1;display:flex;flex-direction:column;position:relative;background:#000">${editorTop(mode)}${editorCanvas(mode)}${bottom}${words}</div>`, { dark: true });
}

/* ---------- viewer ---------- */
function viewer(o = {}) {
  const img = o.broken
    ? `<div style="position:absolute;left:0;top:50%;width:360px;height:480px;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center">${ic('image-off', 28, 'rgba(255,255,255,.75)')}<div class="t" style="margin-top:8px;font-size:14px;line-height:19px;color:rgba(255,255,255,.75)">Couldn't load the picture</div></div>`
    : `<div style="position:absolute;left:0;top:50%;width:360px;height:${o.kind === 'landscape' ? 202 : 480}px;transform:translateY(-50%)">${shot(o.kind || 'portrait')}</div>`;
  const top = `<div style="position:absolute;left:0;right:0;top:0;background:linear-gradient(rgba(0,0,0,.5),transparent);padding:4px 16px 16px 4px;display:flex;align-items:center;gap:4px"><div class="ibtn">${ic('x', 24, '#fff')}</div><div><div class="t" style="font-weight:600;font-size:16px;line-height:21px;color:#fff">${o.who || 'Maya Chen'}</div><div class="t" style="font-size:12.5px;line-height:17px;color:rgba(255,255,255,.75)">Today at 8:14 AM</div></div></div>`;
  const foot = `<div style="position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.5));padding:24px 20px 16px;display:flex;flex-direction:column;align-items:center">${o.caption ? `<div class="t" style="font-size:15px;line-height:21px;color:#fff">${o.caption}</div><div style="height:8px"></div>` : ''}<div style="display:flex;align-items:center;gap:4px">${ic('clock', 12, 'rgba(255,255,255,.75)')}<span class="t" style="font-size:12px;line-height:16px;color:rgba(255,255,255,.75)">Gone in 21 h</span></div></div>`;
  return phone(`<div style="flex:1;position:relative;background:#000">${img}${top}${foot}</div>`, { dark: true });
}

/* ---------- entry points ---------- */
function tileButton(count, muted) {
  const badge = count > 0 ? `<span style="position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:${v('bg')};padding:1.5px;display:flex"><span style="flex:1;border-radius:7.5px;background:${muted ? v('text3') : v('badgeFill')};padding:0 3.5px;display:flex;align-items:center;justify-content:center;font:700 10px/15px TtMono,monospace;color:${muted ? v('bg') : v('onAccent')}">${count > 9 ? '9+' : count}</span></span>` : '';
  return `<span style="width:28px;height:28px;position:relative;display:flex;align-items:center;justify-content:center;flex:none">${ic('message-circle', 24, v('text2'))}${badge}</span>`;
}
function crewTile(count, muted) {
  return `<div class="crewcard" style="width:336px"><div style="display:flex;align-items:center"><span style="flex:1;font:600 18px/23px TtBarlow,sans-serif;color:${v('text')}">${CREW}</span><span style="font:400 12px/17px TtBarlow,sans-serif;color:${v('text3')}">Night 5 of 14</span></div><div style="display:flex;margin-top:14px;align-items:flex-start"><span style="flex:1;font:500 15px/20px TtBarlow,sans-serif;color:${v('text')}">3 apps left tonight</span><span style="flex:1;text-align:right;font:400 12px/17px TtBarlow,sans-serif;color:${v('text3')}">8 of 14 opened yours</span></div><div style="display:flex;align-items:center;margin-top:12px">${appMark(P.me.app, 28)}<span style="width:8px"></span><span style="flex:1;font:400 13px/18px TtBarlow,sans-serif;color:${v('text2')}">${P.me.app}</span><span style="width:8px"></span>${tileButton(count, muted)}</div></div>`;
}
function fab(kind, count = 0) {
  const ro = kind === 'readonly', wide = kind !== 'folded';
  const ink = ro ? v('text') : v('onPrimary');
  const c = ro ? 0 : count;
  const dot = !wide && c > 0 ? `<span style="position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:${v('onPrimary')}"></span>` : '';
  let tail = '';
  if (wide) {
    tail = `<span style="width:8px"></span><span style="font:700 15.5px/20px TtBarlow,sans-serif;letter-spacing:.25px;color:${ink}">Chat</span>`;
    if (ro) tail += `<span style="width:8px"></span>${ic('lock', 14, v('text3'))}`;
    else if (c > 0) tail += `<span style="width:8px"></span><span style="min-width:24px;height:24px;border-radius:12px;background:${v('onPrimary')};padding:0 6px;display:flex;align-items:center;justify-content:center;font:700 12.5px TtMono,monospace;color:${v('primary')}">${c > 99 ? '99+' : c}</span>`;
  }
  const style = ro ? `background:${v('glass2')};box-shadow:inset 0 0 0 1px ${v('glassBorder')}` : `background:${v('primary')};box-shadow:0 4px 10px rgba(0,0,0,.22),0 1px 3px rgba(0,0,0,.18)`;
  return `<div class="fab" style="${style};padding:0 ${wide && c > 0 ? 12 : 16}px 0 ${wide ? 18 : 16}px"><span style="position:relative;display:flex">${ic('message-circle', ro ? 19 : 20, ink)}${dot}</span>${tail}</div>`;
}
function tabs(sel, dots, counts = {}) {
  const labels = ['Open', 'Lobby', 'Run', 'Record'];
  return `<div class="track" style="width:328px">${labels.map((l, i) => {
    const on = i === sel;
    const dot = dots.includes(i) ? `<span style="width:7px;height:7px;border-radius:50%;background:${v('primary')};margin-left:2px;transform:translateY(-6px)"></span>` : '';
    const cnt = counts[i] ? `<span style="margin-left:5px;border-radius:99px;background:${on && document.documentElement.dataset.theme === 'dark' ? v('card') : v('tile')};padding:0 5px;font:700 11px/16px TtBarlow,sans-serif;color:${v('tileInk')}">${counts[i]}</span>` : '';

}

    item('Their message', chatPage({ body: `<div class="thread" style="justify-content:flex-start;padding-top:0">${sampleThread({ lift: 'maya' })}</div>`, over: sheet("Maya's message", `<div style="padding-bottom:18px">${sheetAction('reply', 'Reply')}${sheetAction('copy', 'Copy')}</div>`) })),
    item('Your message', chatPage({ body: `<div class="thread">${sampleThread({ lift: 'mine' })}</div>`, over: sheet('Your message', `<div style="padding-bottom:18px">${sheetAction('reply', 'Reply')}${sheetAction('copy', 'Copy')}${sheetAction('trash-2', 'Delete', 'Gone for everyone', true)}</div>`) })),
    item('Your picture, no caption', chatPage({ over: sheet('Your message', `<div style="padding-bottom:18px">${sheetAction('reply', 'Reply')}${sheetAction('trash-2', 'Delete', 'Gone for everyone', true)}</div>`) })),
    item('Your failed message', chatPage({ over: sheet('Your message', `<div style="padding-bottom:18px">${sheetAction('copy', 'Copy')}${sheetAction('trash-2', 'Delete', 'Gone for everyone', true)}</div>`) })),
    item('Delete', chatPage({ over: ask('Delete this message?', `It goes for everyone in ${CREW}. It still counts toward your 10 today.`, 'Keep it', 'Delete', true) })),
    item('Face tapped', chatPage({ over: ask(null, null, 'Close', null, false, `<div style="display:flex;align-items:center;gap:12px">${avatar('Maya Chen', 64)}<div><div style="font:700 16px/21px TtBarlow,sans-serif;color:${v('text')}">Maya Chen</div><div class="t" style="margin-top:3px;font-size:13.5px;line-height:18px;color:${v('text3')}">maya.chen@example.com</div></div></div><div style="margin-top:14px;background:${v('bg')};border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px">${appMark(P.maya.app, 40)}<div><div class="t" style="font-weight:600;font-size:14px;line-height:18px;color:${v('text')}">${P.maya.app}</div><div class="mono" style="margin-top:2px;font-size:11.5px;line-height:15px;color:${v('text4')}">com.grove.habits</div></div></div><div style="margin-top:12px;display:flex;align-items:center;gap:6px">${ic('calendar', 15, v('text3'))}<span class="t" style="font-size:13.5px;line-height:18px;color:${v('text2')}">Their day 5, <b style="color:${v('accentInk')};font-weight:600">2 of 11 opened tonight</b></span></div>`) })),
  ]));

  /* 7. editor */
  out.push(section('s7', 'Picture editor', [
    item('Just picked', editor('fresh')),
    item('Drawn on', editor('main')),
    item('Crop', editor('crop')),
    item('Pen', editor('draw')),
    item('Words', editor('main', { words: true })),
    item('Caption', editor('main', { text: 'This is the screen that froze' })),
    item('Caption problem', editor('main', { text: 'see play.google.com', problem: "Links can't be sent here. Take it out to send.", canSend: false })),
    item("Couldn't make it", editor('main', { problem: "That picture couldn't be made ready. Try again." })),
  ]));

  /* 8. entry points */
  out.push(section('s8', 'Ways in', [
    item('Crew tile', `<div class="panel flat">${crewTile(0)}</div>`, 'nothing new'),
    item('Crew tile', `<div class="panel flat">${crewTile(3)}</div>`, '3 new'),
    item('Crew tile', `<div class="panel flat">${crewTile(12)}</div>`, '12 new'),
    item('Crew tile', `<div class="panel flat">${crewTile(3, true)}</div>`, 'muted, 3 new'),
    item('Tile button', `<div class="panel flat" style="display:flex;gap:28px;align-items:center;justify-content:center">${tileButton(0)}${tileButton(3)}${tileButton(12)}${tileButton(3, true)}</div>`, '0, 3, 12, muted'),
    item('Chat button', `<div class="panel flat" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">${fab('wide', 0)}${fab('wide', 4)}${fab('wide', 128)}${fab('folded', 0)}${fab('folded', 4)}${fab('readonly')}</div>`, 'open, unread, 99+, folded, folded unread, read only'),
    item('Crew tabs', `<div class="panel flat" style="display:flex;flex-direction:column;gap:14px">${tabs(2, [2])}${tabs(2, [1])}${tabs(1, [1, 2], { 0: 2 })}${tabs(3, [])}</div>`, 'dot = unread, not muted'),
  ]));

  document.getElementById('app').innerHTML = out.join('');
}
build();
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.getElementById('bl').classList.toggle('on', t === 'light');
  document.getElementById('bd').classList.toggle('on', t === 'dark');
  const y = scrollY; build(); scrollTo(0, y);
}
document.getElementById('bl').onclick = () => setTheme('light');
document.getElementById('bd').onclick = () => setTheme('dark');
if (location.search.includes('dark')) setTheme('dark');
const only = new URLSearchParams(location.search).get('only');
if (only) document.querySelectorAll('#app > h2').forEach(h => { if (!only.split(',').includes(h.id)) { h.nextElementSibling.style.display = 'none'; h.style.display = 'none'; } });
const st = document.createElement('style'); st.textContent = '@keyframes spin{to{transform:rotate(360deg)}}'; document.head.appendChild(st);
</script>
</body>
</html>
