<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Take a seat, every state</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "BarlowApp"; font-weight: 400; src: url("../../../app/src/main/res/font/barlow_regular.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 500; src: url("../../../app/src/main/res/font/barlow_medium.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 600; src: url("../../../app/src/main/res/font/barlow_semibold.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 700; src: url("../../../app/src/main/res/font/barlow_bold.ttf"); }

  .light {
    --bg:#F7FCFF; --text:#142F43; --text2:#203A4E; --text3:#223D50; --text4:#59758A;
    --tabSel:#2E4E66; --glass:#F2F9FD; --gbs:#789AAF; --gb:#B7D1E2; --hair:#B7D1E2;
    --cardLine:#E1ECF3; --accent:#3A5B73; --onAccent:#FFFFFF; --accentInk:#22394B;
    --primary:#3A5B73; --onPrimary:#FFFFFF; --tile:#DCE6EE; --tileInk:#3A5B73;
    --ok:#246B59; --warn:#8A611C; --bad:#9E3B2E; --surface:#F7FCFF;
    --fieldBorder:#789AAF; --sheet:#FFFFFF; --flaskL:#9279D6; --flaskG:#4A3B86;
    --kb:#E3E9EE; --key:#FFFFFF; --keyW:#C9D3DB;
  }
  .dark {
    --bg:#0F1011; --text:#ECEEF0; --text2:#BCC1C6; --text3:#9DA3A9; --text4:#757C82;
    --tabSel:#B6CCDC; --glass:#1C1E20; --gbs:#666D74; --gb:#383C41; --hair:#2B2E32;
    --cardLine:#2D3034; --accent:#4A7290; --onAccent:#FFFFFF; --accentInk:#93B3CA;
    --primary:#93B3CA; --onPrimary:#0F1011; --tile:#2A2D31; --tileInk:#A2BED2;
    --ok:#83D8C4; --warn:#D8B774; --bad:#E4938A; --surface:#0F1011;
    --fieldBorder:#666D74; --sheet:#1C1E20; --flaskL:#8C70D4; --flaskG:#CDBEF0;
    --kb:#1B1D1F; --key:#34373B; --keyW:#26292C;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #E7ECEF; font-family: "BarlowApp", "Barlow", system-ui, sans-serif; }
  .doc { padding: 28px; display: flex; flex-wrap: wrap; gap: 44px 40px; align-items: flex-start; }
  .state { display: flex; flex-direction: column; }
  .lbl { font-size: 16px; font-weight: 700; color: #2D4A5F; margin: 0 0 8px 4px; }
  .pair { display: flex; gap: 16px; align-items: flex-start; }
  svg.i { display: block; flex: none; }
  svg.il { display: inline-block; vertical-align: -2px; margin-right: 6px; }
  .one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  b { font-weight: 600; color: var(--text); }

  /* phone */
  .phone { width: 412px; background: var(--bg); color: var(--text); border-radius: 26px; overflow: hidden; border: 1px solid #C3CFD8; display: flex; flex-direction: column; position: relative; }
  .dark.phone { border-color: #2A2D31; }
  .sbar { height: 24px; flex: none; }
  .pbar { height: 64px; position: relative; flex: none; background: var(--bg); z-index: 2; }
  .pbar .back { position: absolute; left: 16px; top: 20px; color: var(--text); }
  .pbar .pt { position: absolute; left: 56px; top: 18px; font-size: 22px; line-height: 28px; font-weight: 700; }
  .fbar { height: 64px; display: flex; align-items: center; padding: 0 4px 0 16px; flex: none; background: var(--bg); position: relative; z-index: 2; }
  .fbar .t { flex: 1; font-size: 22px; line-height: 28px; font-weight: 700; }
  .xbtn { width: 48px; height: 48px; display: grid; place-items: center; color: var(--text); flex: none; }
  .vp { position: relative; overflow: hidden; flex: 1 1 auto; }
  .scroll { padding: 8px 16px 20px; }
  .navb { height: 24px; flex: none; background: var(--bg); z-index: 2; }

  /* head */
  .ah { display: flex; align-items: center; }
  .ah .col { flex: 1; min-width: 0; margin-left: 12px; }
  .ai { width: 52px; height: 52px; border-radius: 30%; flex: none; position: relative; background: linear-gradient(135deg, #ff8a3d, #e8453c); }
  .ai i { position: absolute; left: 28%; top: 28%; width: 44%; height: 44%; border-radius: 30%; background: rgba(255,255,255,.88); }
  .ai .mk { position: absolute; right: -5px; bottom: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--sheet); box-shadow: 0 0 0 2px var(--bg); display: grid; place-items: center; }
  .hn { font-size: 16px; line-height: 18px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hed { font-size: 16px; line-height: 17px; font-weight: 600; box-shadow: inset 0 -2px 0 var(--primary); padding-bottom: 4px; overflow-wrap: anywhere; }
  .caret { display: inline-block; width: 1.5px; height: 14px; background: var(--primary); vertical-align: -2px; margin-left: 1px; }
  .dev { margin-top: 2px; font-size: 12.5px; line-height: 14px; font-weight: 500; color: var(--text3); }
  .devrow { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; line-height: 14px; font-weight: 500; color: var(--text3); }
  .devrow .one { flex: 1; min-width: 0; }
  .cnt { font-size: 11.5px; line-height: 14px; font-weight: 400; color: var(--text4); white-space: nowrap; }
  .slot { width: 40px; height: 40px; display: grid; place-items: center; flex: none; margin-left: 4px; color: var(--text4); }
  .slot.acc { color: var(--accentInk); }

  /* heading, lines */
  .sh { display: flex; align-items: center; min-height: 19px; margin-bottom: 8px; gap: 8px; }
  .sh h3 { margin: 0; flex: 1; font-size: 16px; line-height: 19px; font-weight: 700; }
  .st { display: flex; align-items: center; gap: 4px; font-size: 12.5px; line-height: 14px; font-weight: 600; white-space: nowrap; }
  .st.ok { color: var(--ok); } .st.warn { color: var(--warn); }
  .body { font-size: 13px; line-height: 18px; color: var(--text2); }
  .small { font-size: 12.5px; line-height: 17px; }
  .warnc { color: var(--warn); } .badc { color: var(--bad); }

  /* tile rows */
  .r40 { display: flex; align-items: center; min-height: 40px; }
  .r40 .col { flex: 1; min-width: 0; margin-left: 12px; }
  .t40 { width: 40px; height: 40px; border-radius: 12px; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; flex: none; }
  .t40.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
  .nm { font-size: 16px; line-height: 19px; font-weight: 600; }
  .sub { margin-top: 2px; font-size: 12.5px; line-height: 14px; font-weight: 500; color: var(--text3); display: flex; align-items: center; gap: 4px; }
  .sub.acc { color: var(--accentInk); }
  .sub.warn { color: var(--warn); font-weight: 600; }

  /* address */
  .ar { display: flex; align-items: center; min-height: 40px; }
  .ar .col { flex: 1; min-width: 0; }
  .addr { font-size: 15px; line-height: 18px; font-weight: 600; color: var(--accentInk); white-space: nowrap; overflow: hidden; }
  .copy { width: 40px; height: 40px; display: grid; place-items: center; color: var(--accentInk); margin-left: 4px; flex: none; }

  /* pills, bars, buttons */
  .pills { display: flex; gap: 8px; }
  .pt48 { flex: 1; height: 48px; display: flex; align-items: center; }
  .pill { width: 100%; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap; }
  .pill.soft { background: var(--tile); color: var(--accentInk); }
  .pill.solid { background: var(--accent); color: var(--onAccent); }
  .rp { height: 34px; border-radius: 17px; background: var(--tile); color: var(--accentInk); padding: 0 14px; display: flex; align-items: center; font-size: 14px; font-weight: 700; flex: none; margin-left: 8px; white-space: nowrap; }
  .bar { min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--tabSel); font-size: 16px; line-height: 24px; font-weight: 600; padding: 11px; white-space: nowrap; border: 1px solid var(--cardLine); border-radius: 14px; background: var(--surface); }
  .prim { min-height: 52px; border-radius: 26px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 20px; font-weight: 700; white-space: nowrap; }
  .prim.off { background: color-mix(in srgb, var(--text) 12%, transparent); color: color-mix(in srgb, var(--text) 38%, transparent); }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; flex: none; }
  .spin.l { width: 22px; height: 22px; border-width: 2.5px; }

  /* sign-in */
  .q { font-size: 14px; line-height: 20px; font-weight: 600; }
  .tc { display: flex; gap: 8px; margin-top: 8px; }
  .chc { flex: 1; min-height: 48px; border-radius: 10px; border: 1px solid var(--gbs); display: grid; place-items: center; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text2); }
  .chc.on { background: var(--tile); border-color: var(--tileInk); color: var(--tileInk); }
  .fl { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text4); margin-bottom: 4px; }
  .fd { min-height: 56px; border: 1px solid var(--fieldBorder); border-radius: 8px; padding: 0 16px; display: flex; align-items: center; font-size: 15px; line-height: 21px; font-weight: 500; }
  .fd.tall { min-height: 72px; align-items: flex-start; padding-top: 16px; }
  .fd.focus { border: 2px solid var(--primary); padding: 0 15px; }
  .fd .ph { color: var(--text4); opacity: .8; font-weight: 400; }
  .fc { display: flex; justify-content: flex-end; margin-top: 4px; font-size: 11.5px; line-height: 16px; color: var(--text2); }

  /* price rules: classic hanging bullets */
  .rl { display: flex; font-size: 13px; line-height: 17px; color: var(--text2); }
  .rl::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--text4); margin: 6.5px 8px 0 0; flex: none; }
  .rl + .rl { margin-top: 6px; }

  /* notices */
  .ttl { font-size: 14px; line-height: 20px; font-weight: 600; }
  .bs { font-size: 12px; line-height: 16px; }
  .link { font-size: 14px; line-height: 20px; font-weight: 700; color: var(--accentInk); padding: 6px 12px 0 0; display: inline-block; }

  /* boxes */
  .bx { display: flex; align-items: center; min-height: 48px; }
  .cb { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--gbs); display: grid; place-items: center; flex: none; color: var(--onAccent); }
  .cb.on { background: var(--accent); box-shadow: none; }
  .bl { margin-left: 12px; font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap; }
  .ib { width: 40px; height: 40px; margin-left: -6px; display: grid; place-items: center; color: var(--text4); flex: none; position: relative; }
  .ib.on { color: var(--accentInk); }
  .ib.on::before { content: ""; position: absolute; width: 30px; height: 30px; border-radius: 50%; background: color-mix(in srgb, var(--accentInk) 10%, transparent); }
  .ib svg { position: relative; }

  /* hint */
  .hint { text-align: center; font-size: 12.5px; line-height: 16px; font-weight: 600; color: var(--text2); min-height: 20px; padding-top: 2px; white-space: nowrap; margin-bottom: 8px; }
  .hint.todo .ic { color: var(--accentInk); }
  .hint.warn { color: var(--warn); }
  .hint.quiet { color: var(--text3); font-weight: 500; }

  /* callout */
  .pop { position: absolute; z-index: 3; }
  .pop svg.shape { position: absolute; left: 0; top: 0; overflow: visible; }
  .pop .pc { position: relative; padding: 20px 14px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 18px; color: var(--text2); }

  /* skeleton */
  .sk { background: color-mix(in srgb, var(--text) 9%, transparent); border-radius: 6px; }

  /* how-to */
  .hs { display: flex; align-items: center; gap: 12px; min-height: 32px; }
  .hnum { width: 24px; height: 24px; border-radius: 50%; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
  .ht { font-size: 15px; line-height: 20px; font-weight: 600; }
  .pic { border-radius: 12px; box-shadow: inset 0 0 0 1px var(--gb); overflow: hidden; position: relative; margin-top: 10px; background: #fff; }
  .pic img { display: block; width: 100%; height: auto; }
  .pic::after { content: ""; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--gb); pointer-events: none; }
  .zhint { margin-top: 8px; font-size: 12.5px; line-height: 14px; font-weight: 500; color: var(--text3); }

  /* keyboard */
  .kb { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 10px 4px 34px; background: var(--kb); display: flex; flex-direction: column; gap: 10px; }
  .kb .kr { display: flex; gap: 6px; justify-content: center; }
  .kb .k { height: 42px; flex: 0 0 calc((100% - 54px) / 10); border-radius: 6px; background: var(--key); }
  .kb .k.w { flex-basis: calc((100% - 54px) / 10 * 1.5); background: var(--keyW); }
  .kb .k.sp { flex-basis: 50%; }
  /* RobotOffline in CenteredState */
  .cstate { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 16px; text-align: center; }
  .robot { width: 112px; height: 142.6px; position: relative; }
  .rfig { position: absolute; left: 0; bottom: 11.2px; }
  .rfig svg { display: block; }
  .rshadow { position: absolute; left: 22.4px; bottom: 0; width: 67.2px; height: 11.2px; border-radius: 50%; background: rgba(15, 30, 45, .18); }
  .ctitle { font-size: 20px; line-height: 25px; font-weight: 700; }
  .cline { max-width: 300px; font-size: 14px; line-height: 20px; color: var(--text2); }
  .obtn { min-height: 52px; padding: 0 22px; border-radius: 26px; border: 1.5px solid var(--accentInk); color: var(--accentInk); font-size: 14.5px; font-weight: 700; display: flex; align-items: center; }
  .vp > .scroll.full { position: absolute; inset: 0; padding: 0; }
  /* Text fields: three options */
  .tsec { width: 100%; display: flex; flex-direction: column; gap: 22px; }
  .tsec h2 { margin: 0; font-size: 20px; font-weight: 700; color: #2D4A5F; }
  .tsec .row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .cap { font-size: 12px; font-weight: 600; color: #6B8396; margin: 0 0 6px 4px; }
  .cap .rec { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px; background: #246B59; color: #fff; font-size: 11px; font-weight: 700; vertical-align: 1px; }
  .opt { width: 412px; background: var(--bg); color: var(--text); border: 1px solid #C3CFD8; border-radius: 20px; padding: 16px; }
  .opt.dark { border-color: #2A2D31; }
  .tcaret { display: inline-block; width: 1.5px; height: 16px; background: var(--primary); vertical-align: -3px; margin-left: 1px; }
  .terr { margin-top: 4px; font-size: 12.5px; line-height: 16px; font-weight: 600; color: var(--bad); }
  .tcnt { display: flex; justify-content: flex-end; margin-top: 4px; font-size: 11.5px; line-height: 14px; color: var(--text4); }
  .eye { width: 40px; height: 40px; display: grid; place-items: center; color: var(--text4); flex: none; }
  /* A: outlined 48, label inside, floats on focus or once filled */
  .fa { position: relative; min-height: 48px; border: 1px solid var(--fieldBorder); border-radius: 10px; padding: 0 4px 0 14px; display: flex; align-items: center; }
  .fa.focus { border: 2px solid var(--primary); padding-left: 13px; }
  .fa.err { border: 1.5px solid var(--bad); padding-left: 13.5px; }
  .fa .in { flex: 1; min-width: 0; position: relative; align-self: stretch; }
  .fa .lab { position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-size: 15px; line-height: 20px; color: var(--text4); white-space: nowrap; }
  .fa .lab.up { top: 5px; transform: none; font-size: 11.5px; line-height: 14px; font-weight: 600; }
  .fa.focus .lab.up { color: var(--accentInk); }
  .fa.err .lab { color: var(--bad); }
  .fa .val { padding: 19px 0 5px; font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; }
  .fa.tall { align-items: stretch; }
  .fa.tall .val { white-space: normal; }
  /* B: soft filled 48, label above, focus is a 2dp line along the bottom */
  .flb { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text4); margin-bottom: 4px; }
  .flb.focus { color: var(--accentInk); } .flb.err { color: var(--bad); }
  .fb { position: relative; min-height: 48px; background: var(--tile); border-radius: 10px; padding: 0 4px 0 14px; display: flex; align-items: center; overflow: hidden; }
  .fb .v { flex: 1; min-width: 0; font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; }
  .fb .ph { color: var(--text4); font-weight: 400; }
  .fb.focus::after, .fb.err::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--primary); }
  .fb.err::after { background: var(--bad); }
  .fb.tall { padding-top: 14px; padding-bottom: 14px; }
  .fb.tall .v { white-space: normal; }
  /* C: tile-row field, the head's own editing language */
  .fcr { display: flex; align-items: center; min-height: 48px; }
  .fcr.top { align-items: flex-start; padding-top: 4px; }
  .fcr .t40.err { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
  .fcr .col { flex: 1; min-width: 0; margin-left: 12px; }
  .fcr .v { font-size: 15px; line-height: 19px; font-weight: 500; padding-bottom: 4px; box-shadow: inset 0 -1px 0 var(--fieldBorder); white-space: nowrap; overflow: hidden; }
  .fcr .v.ml { white-space: normal; }
  .fcr .v .ph { color: var(--text4); font-weight: 400; }
  .fcr.focus .v { box-shadow: inset 0 -2px 0 var(--primary); }
  .fcr.err .v { box-shadow: inset 0 -2px 0 var(--bad); }
  .fcr .lb { margin-top: 2px; display: flex; gap: 8px; font-size: 12.5px; line-height: 14px; font-weight: 500; color: var(--text3); }
  .fcr .lb .one { flex: 1; }
  .fcr.focus .lb { color: var(--accentInk); font-weight: 600; }
  .fcr.err .lb { color: var(--bad); font-weight: 600; }
  /* Now: the DialogField as built, label above a 56dp box */
  .fn { min-height: 56px; border: 1px solid var(--fieldBorder); border-radius: 8px; padding: 0 4px 0 16px; display: flex; align-items: center; font-size: 15px; line-height: 21px; font-weight: 500; }
  .fn .v { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
  .fn .ph { color: var(--text4); opacity: .8; font-weight: 400; }
  .fn.focus { border: 2px solid var(--primary); padding-left: 15px; }
  .fn.err { border: 2px solid var(--bad); padding-left: 15px; }
  .fn.tall { min-height: 72px; align-items: flex-start; padding-top: 16px; }
  .fn.tall .v { white-space: normal; }
  .fnl { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text4); margin-bottom: 4px; }
  /* A variants: 48dp outlined, label inside when empty */
  .ax { position: relative; height: 48px; border: 1px solid var(--fieldBorder); border-radius: 10px; padding: 0 4px 0 14px; display: flex; align-items: center; }
  .ax.focus { border: 2px solid var(--primary); padding-left: 13px; }
  .ax.err { border: 2px solid var(--bad); padding-left: 13px; }
  .ax.ml { height: auto; min-height: 48px; padding-top: 13px; padding-bottom: 13px; align-items: flex-start; }
  .ax .v { flex: 1; min-width: 0; font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; }
  .ax.ml .v { white-space: normal; }
  .ax .ph { color: var(--text4); font-weight: 400; }
  /* A1: the label sits in the top border, which breaks round it */
  .ax .notch { position: absolute; left: 10px; top: -9px; padding: 0 4px; background: var(--bg); font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text3); white-space: nowrap; }
  .ax.focus .notch { color: var(--accentInk); left: 9px; top: -10px; }
  .ax.err .notch { color: var(--bad); left: 9px; top: -10px; }
  /* A2: the label line above, kept even while empty so nothing jumps */
  .alab { height: 16px; margin-bottom: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text3); }
  .alab.focus { color: var(--accentInk); } .alab.err { color: var(--bad); }
  /* the line under a box: error, counter, and in A3 the label */
  .help { display: flex; gap: 8px; min-height: 14px; margin-top: 4px; font-size: 12px; line-height: 14px; font-weight: 600; color: var(--text3); }
  .help .one { flex: 1; min-width: 0; }
  .help.focus { color: var(--accentInk); }
  .help.err { color: var(--bad); }
  .help .cn { font-size: 11.5px; font-weight: 400; color: var(--text4); }
</style>
</head>
<body>
<div class="doc" id="doc"></div>
<div id="chk" hidden></div>

<script>
const P = (d, s = 24, w = 2) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const inl = svg => svg.replace('class="i"', 'class="il"');
const I = {
  check: (s, w = 2.6) => P('<path d="M20 6 9 17l-5-5"/>', s, w),

const COST = 100, SEATS = 15, DAYS = 14;
const ADDR = 'googleclosetesting@googlegroups.com';
const IMG = n => `../../../app/src/main/res/drawable-nodpi/play_step${n}.webp`;
const STEPS = ['Open Closed testing in Play Console', 'Open your track, then its Testers tab', 'Pick Google Groups, paste the address and save', 'Roll out a release to that track'];
const BASE = { name: 'Sunrise Notes', dev: 'Brightleaf Studio', group: 'open', tix: 240, boxes: [false, false], signIn: false };

/* seatHint() in CrewSeatRules.kt, first match wins */
function hint(s) {
  if (s.seating) return { k: 'quiet', t: 'Checking it on Play the way the crew will see it' };
  if (s.group === 'failed') return { k: 'warn', t: "Play doesn't show it to the group yet", i: I.alert(14) };
  if (s.group !== 'done') return { k: 'todo', t: 'Verify the testers group first', i: I.circleDashed(14) };
  if (!s.name.trim()) return { k: 'todo', t: 'Give it a name the crew sees', i: I.circleDashed(14) };
  if (s.signIn && !s.user) return { k: 'todo', t: "Add the test account's username", i: I.circleDashed(14) };
  if (s.tix < COST) return { k: 'warn', t: `You need ${COST - s.tix} more tix`, i: I.alert(14) };
  if (s.held) return { k: 'warn', t: 'Wait for the team to answer your appeal', i: I.alert(14) };
  if (!(s.boxes[0] && s.boxes[1])) return { k: 'todo', t: 'Tick both Play Console boxes', i: I.circleDashed(14) };
  return { k: 'quiet', t: `${COST} tix come off your ${s.tix}`, i: I.coins(14), ready: true };
}

const appIcon = () => `<div class="ai"><i></i><span class="mk">${I.flask(12)}</span></div>`;
function head(s) {
  if (s.editing) {
    return `<div class="ah" data-tile>${appIcon()}<div class="col"><div class="hed">${s.name}<span class="caret"></span></div><div class="devrow"><span class="one">${s.dev}</span><span class="cnt">${s.name.length}/30</span></div></div><span class="slot acc">${I.check(20, 2.4)}</span></div>`;
  }
  return `<div class="ah" data-tile>${appIcon()}<div class="col"><div class="hn">${s.name}</div><div class="dev one">${s.dev}</div></div><span class="slot">${I.pencil(18)}</span></div>`;
}

const addrRow = copied => `<div class="ar"><div class="col"><div class="addr" data-fit>${ADDR}</div><div class="sub"><span class="one">Testers group address</span></div></div><span class="copy"${copied ? ' style="color:var(--ok)"' : ''}>${copied ? I.check(18, 2.4) : I.copy(18)}</span></div>`;

function group(s) {
  if (s.group === 'done') return '';
  const failed = s.group === 'failed', checking = s.group === 'checking';
  const line = failed ? "Checked 5 min ago: Play doesn't show it to the group yet. A new rollout can take a few hours to show." : "Play doesn't show your app to the group yet";
  const verify = checking ? '<span class="spin"></span>' : `${I.refresh(16)}${failed ? 'Check again' : 'Verify on Play'}`;
  return `<div style="height:24px"></div><div data-anchor="group"><div class="sh"><h3>Testers group</h3></div>
    <div class="small warnc">${inl(I.alert(14))}${line}</div>
    <div style="height:6px"></div>${addrRow(false)}<div style="height:12px"></div>
    <div class="pills"><span class="pt48"><span class="pill soft">${I.help(16)}How to add it</span></span><span class="pt48"><span class="pill solid">${verify}</span></span></div></div>`;
}

function details(s) {
  const short = s.tix < COST;
  let h = `<div style="height:24px"></div><div class="sh"><h3>Seat details</h3>${short ? `<span class="st warn">${I.circleAlert(14)}${COST - s.tix} tix short</span>` : ''}</div>`;
  if (s.group === 'done') h += `<div class="r40" data-tile><span class="t40 ok">${I.circleCheck(20)}</span><div class="col"><div class="nm one">Testers group added</div><div class="sub"><span class="one">Play shows your app to the group</span></div></div></div><div style="height:16px"></div>`;
  h += `<div class="r40" data-tile><span class="t40">${I.users(20)}</span><div class="col"><div class="nm one">Crew 07, 6 of 15 seats left</div><div class="sub acc">${I.clock(11)}<span class="one">Likely starts in about 3 days</span></div></div></div>
    <div style="height:16px"></div>
    <div class="q">Does your app need a sign-in?</div><div class="tc"><div class="chc${s.signIn ? '' : ' on'}">No sign-in</div><div class="chc${s.signIn ? ' on' : ''}">Needs a sign-in</div></div>`;
  if (s.signIn) {
    h += `<div style="height:8px"></div><div class="body">A test account the crew can use, as Play Console's App access asks for. Fourteen testers see it, so never your own.</div>
      <div style="height:16px"></div><div class="fl">Username, email or phone</div><div class="fd focus"><span class="ph">test@example.com</span></div>
      <div style="height:16px"></div><div class="fl">Password</div><div class="fd"><span class="ph">The test account's password</span></div>
      <div style="height:16px"></div><div class="fl">Anything else needed (optional)</div><div class="fd tall"><span class="ph">A one-time code, or which screen to skip</span></div><div class="fc">0/90</div>`;
  }
  const sub = short ? `<div class="sub warn"><span class="one">You have ${s.tix} tix, ${COST - s.tix} short</span></div>` : `<div class="sub"><span class="one">You have ${s.tix} tix</span></div>`;
  h += `<div style="height:16px"></div>
    <div class="r40" data-tile><span class="t40">${I.coins(20)}</span><div class="col"><div class="nm one">A seat is ${COST} tix</div>${sub}</div>${short ? '<span class="rp">Open Circle</span>' : ''}</div>
    <div style="height:16px"></div>
    <div class="rl"><span>All <b>${COST} tix</b> come back if you take it out while the crew fills, or open every app every night to the end.</span></div>
    <div class="rl"><span>You open the other <b>${SEATS - 1}</b> apps every day for <b>${DAYS}</b> days, and they open yours.</span></div>
    <div class="rl"><span>That puts you on <b>${SEATS - 1}</b> apps a night.</span></div>`;
  if (s.refused) h += `<div style="height:16px"></div><div class="ttl badc">${inl(I.circleAlert(16, 2.2))}Couldn't take the seat</div><div style="height:4px"></div><div class="bs badc">Crew 07 filled a moment ago. Take a seat again to go into the next crew.</div>`;
  if (s.waiting) h += `<div style="height:16px"></div><div class="ttl"><span class="warnc">${inl(I.alert(16))}</span>Your app waits in Crew 04</div><div class="bs" style="color:var(--text2)">Take the next seat once that crew is full.</div><span class="link">Open the crew</span>`;
  if (s.held) h += `<div style="height:16px"></div><div class="bs" style="font-size:12px;line-height:16px"><span class="warnc">${inl(I.alert(16))}</span>You asked to get ${s.name} back into Crew 03. You can take a new seat once the team answers.</div>`;
  return h;
}

function boxes(s) {
  const rows = [['Available in all countries', 'countries'], ['Not limited to some devices', 'devices']];
  let h = `<div style="height:32px"></div><div data-anchor="boxes"><div class="sh"><h3>Before you submit</h3></div>
    <div class="body">You set both in Play Console. Every member needs them to install your app.</div><div style="height:8px"></div>`;
  rows.forEach(([label, id], i) => {
    const on = s.boxes[i];
    h += `<div class="bx"><span class="cb${on ? ' on' : ''}">${on ? I.check(14, 3) : ''}</span><span class="bl">${label}</span><span class="ib${s.pop === id ? ' on' : ''}" data-info="${id}">${I.info(20)}</span></div>`;
  });
  return h + '</div>';
}

function submit(s) {
  const m = hint(s);
  const enabled = m.ready || (s.waiting || s.refused) && m.ready;
  const icon = m.i ? `<span class="ic">${inl(m.i)}</span>` : '';
  const btn = s.seating
    ? `<div class="prim off" style="color:var(--text3)"><span class="spin l"></span></div>`
    : `<div class="prim${enabled ? '' : ' off'}">Take a seat in Crew 07</div>`;
  return `<div style="height:16px"></div><div data-anchor="end"><div class="hint ${m.k}">${icon}${m.t}</div>${btn}</div>`;
}

const pageBody = s => head(s) + group(s) + details(s) + boxes(s) + submit(s);

function keyboard() {
  const row = (n, pre = '', post = '') => `<div class="kr">${pre}${'<span class="k"></span>'.repeat(n)}${post}</div>`;
  return `<div class="kb">${row(10)}${row(9)}${row(7, '<span class="k w"></span>', '<span class="k w"></span>')}<div class="kr"><span class="k w"></span><span class="k"></span><span class="k sp"></span><span class="k"></span><span class="k w"></span></div></div>`;
}

function phone(theme, body, o = {}) {
  const fixed = (o.h ? `;height:${o.h}px` : '') + (o.w ? `;width:${o.w}px` : '');
  const bar = o.how
    ? `<div class="fbar"><span class="t">Add the testers group</span><span class="xbtn">${I.x(24)}</span></div>`
    : `<div class="pbar"><span class="back">${I.backIos(24)}</span><span class="pt">Take a seat</span></div>`;
  return `<div class="phone ${theme}" style="${fixed}" data-scroll="${o.scroll || 'top'}" data-pop="${o.pop || ''}"><div class="sbar"></div>${bar}
    <div class="vp"><div class="scroll${o.full ? ' full' : ''}">${body}</div></div><div class="navb"></div>${o.kb ? keyboard() : ''}</div>`;
}

    const d = `M${R} ${CH} L${cx - HALF} ${CH} L${cx - TIP} ${TIP} Q${cx} 0 ${cx + TIP} ${TIP} L${cx + HALF} ${CH} L${W - R} ${CH} A${R} ${R} 0 0 1 ${W} ${CH + R} L${W} ${h - R} A${R} ${R} 0 0 1 ${W - R} ${h} L${R} ${h} A${R} ${R} 0 0 1 0 ${h - R} L0 ${CH + R} A${R} ${R} 0 0 1 ${R} ${CH} Z`;
    pop.insertAdjacentHTML('afterbegin', `<svg class="shape" width="${W}" height="${h}"><path d="${d}" fill="var(--sheet)" stroke="var(--gb)" stroke-width="1"/></svg>`);
  });
}
function check() {
  const bad = [];
  document.querySelectorAll('[data-tile]').forEach(r => { const ic = r.querySelector('.ai, .t40'), col = r.querySelector('.col'); if (col.offsetHeight > ic.offsetHeight + 0.5) bad.push('tall ' + col.textContent.trim().slice(0, 24) + ' ' + col.offsetHeight); });
  document.querySelectorAll('.one, .pill, .prim, .bar, .rp, .st, .bl, .addr').forEach(t => { if (t.scrollWidth > t.clientWidth + 1) bad.push('cut ' + t.textContent.trim().slice(0, 30)); });
  document.querySelectorAll('.hint').forEach(h => { if (h.offsetHeight > 22.5) bad.push('hint wraps ' + h.textContent.trim()); });
  document.querySelectorAll('.pop').forEach(p => { const ph = p.closest('.phone').getBoundingClientRect(), r = p.getBoundingClientRect(); if (r.right > ph.right - 15 || r.left < ph.left + 15) bad.push('pop out'); });
  const heads = [...document.querySelectorAll('.ah')].map(a => a.querySelector('.col').offsetHeight);
  /* seen gaps: ink to ink, the touch boxes' empty edges counted */
  const seen = [];
  document.querySelectorAll('.phone').forEach(ph => {
    const ink = [...ph.querySelectorAll('.scroll .pill, .scroll .sh h3, .scroll .cb, .scroll .hint, .scroll .prim, .scroll .rl, .scroll .link, .scroll .t40, .scroll .chc, .scroll .ai, .scroll .addr, .scroll .body, .scroll .q, .scroll .ttl, .scroll .bs, .scroll .pic, .scroll .ht, .scroll .zhint, .scroll .bar, .scroll .fd, .scroll .fl, .scroll .fc, .scroll .sub, .scroll .small, .scroll .obtn, .scroll .robot, .scroll .ctitle, .scroll .cline')]
      .map(e => [e, e.getBoundingClientRect()]).filter(x => x[1].height > 0).sort((x, y) => x[1].top - y[1].top);
    let low = null, lowE = null;
    const lbl = (ph.closest('.state').querySelector('.lbl') || { textContent: '' }).textContent;
    ink.forEach(([e, r]) => { if (low !== null && r.top - low > 32.5 && r.top < ph.getBoundingClientRect().bottom - 24) seen.push(lbl + ':' + lowE.className + '>' + e.className + '=' + Math.round(r.top - low)); if (low === null || r.bottom > low) { low = r.bottom; lowE = e; } });
  });
  document.getElementById('chk').textContent = (bad.length ? 'BAD ' + [...new Set(bad)].join('; ') : 'OK') + ' | heads ' + [...new Set(heads)].join(',') + ' | fieldH ' + ['.fn', '.ax'].map(c => c + '=' + [...new Set([...document.querySelectorAll(c)].map(e => e.offsetHeight))].join('/')).join(' ') + ' | gaps>32 ' + [...new Set(seen)].join(',') + ' | rects ' + [...document.querySelectorAll('.state')].map(e => { const r = e.getBoundingClientRect(); return [r.left, r.top + scrollY, r.width, r.height].map(Math.round).join(':'); }).join(';');
}
function run() { fit(); callouts(); check(); }
run();
document.fonts.ready.then(run);
window.addEventListener('load', run);
</script>
