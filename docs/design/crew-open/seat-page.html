<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Take a seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "BarlowApp"; font-weight: 400; src: url("../../../app/src/main/res/font/barlow_regular.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 500; src: url("../../../app/src/main/res/font/barlow_medium.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 600; src: url("../../../app/src/main/res/font/barlow_semibold.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 700; src: url("../../../app/src/main/res/font/barlow_bold.ttf"); }

  .light {
    --bg:#F7FCFF; --text:#142F43; --text2:#203A4E; --text3:#223D50; --text4:#59758A;
    --tabSel:#2E4E66; --glass:#F2F9FD; --gbs:#789AAF; --gb:#B7D1E2; --hair:#B7D1E2;
    --cardLine:#E1ECF3; --accent:#3A5B73; --onAccent:#FFFFFF; --accentInk:#22394B;
    --primary:#3A5B73; --onPrimary:#FFFFFF; --tile:#DCE6EE; --tileInk:#3A5B73;
    --ok:#246B59; --warn:#8A611C; --bad:#9E3B2E;
    --fieldBorder:#789AAF; --sheet:#FFFFFF; --flaskL:#9279D6; --flaskG:#4A3B86;
  }
  .dark {
    --bg:#0F1011; --text:#ECEEF0; --text2:#BCC1C6; --text3:#9DA3A9; --text4:#757C82;
    --tabSel:#B6CCDC; --glass:#1C1E20; --gbs:#666D74; --gb:#383C41; --hair:#2B2E32;
    --cardLine:#2D3034; --accent:#4A7290; --onAccent:#FFFFFF; --accentInk:#93B3CA;
    --primary:#93B3CA; --onPrimary:#0F1011; --tile:#2A2D31; --tileInk:#A2BED2;
    --ok:#83D8C4; --warn:#D8B774; --bad:#E4938A;
    --fieldBorder:#666D74; --sheet:#1C1E20; --flaskL:#8C70D4; --flaskG:#CDBEF0;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #E7ECEF; font-family: "BarlowApp", "Barlow", system-ui, sans-serif; }
  .doc { padding: 28px; display: flex; flex-wrap: wrap; gap: 48px 56px; align-items: flex-start; }
  .state { display: flex; flex-direction: column; }
  .lbl { font-size: 17px; font-weight: 700; color: #2D4A5F; margin: 0 0 10px 4px; }
  .pair { display: flex; gap: 16px; align-items: flex-start; }
  .cap { font-size: 12px; font-weight: 600; color: #6B8396; margin: 0 0 6px 4px; }
  svg.i { display: block; flex: none; }
  svg.il { display: inline-block; vertical-align: -2px; margin-right: 6px; }

  .phone { background: var(--bg); color: var(--text); border-radius: 26px; overflow: hidden; border: 1px solid #C3CFD8; display: flex; flex-direction: column; }
  .dark.phone { border-color: #2A2D31; }
  .sbar { height: 24px; flex: none; }
  .pbar { height: 64px; position: relative; flex: none; background: var(--bg); z-index: 2; }
  .pbar .back { position: absolute; left: 16px; top: 20px; color: var(--text); }
  .pbar .pt { position: absolute; left: 56px; top: 18px; font-size: 22px; line-height: 28px; font-weight: 700; }
  .vp { position: relative; overflow: hidden; flex: none; }
  .scroll { padding: 8px 16px 20px; }
  .nav { height: 24px; flex: none; background: var(--bg); z-index: 2; }
  .one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ai { border-radius: 30%; flex: none; position: relative; }
  .ai i { position: absolute; left: 28%; top: 28%; width: 44%; height: 44%; border-radius: 30%; background: rgba(255,255,255,.88); }
  .ai .mk { position: absolute; right: -5px; bottom: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--sheet); box-shadow: 0 0 0 2px var(--bg); display: grid; place-items: center; }

  .ah, .r40 { display: flex; align-items: center; }
  .r40 { min-height: 40px; }
  .ah .col, .r40 .col { flex: 1; min-width: 0; margin-left: 12px; }
  .nm { font-size: 16px; line-height: 19px; font-weight: 600; color: var(--text); }
  .hn { font-size: 16px; line-height: 18px; font-weight: 600; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { margin-top: 2px; font-size: 12.5px; line-height: 14px; font-weight: 500; color: var(--text3); display: flex; align-items: center; gap: 4px; }
  .sub.acc { color: var(--accentInk); }
  .sub.warn { color: var(--warn); font-weight: 600; }

  .sec { margin-top: 32px; }
  .sec.first { margin-top: 24px; }
  .sh { display: flex; align-items: center; min-height: 19px; margin-bottom: 8px; gap: 8px; }
  .sh h3 { margin: 0; flex: 1; font-size: 16px; line-height: 19px; font-weight: 700; color: var(--text); }
  .sh .st { display: flex; align-items: center; gap: 4px; font-size: 12.5px; line-height: 14px; font-weight: 600; white-space: nowrap; }
  .sh.done { margin-bottom: 0; }
  .st.ok { color: var(--ok); } .st.warn { color: var(--warn); }
  .body { font-size: 13px; line-height: 18px; color: var(--text2); }
  .gt b, .rl b, .pop b, .il-line b { font-weight: 600; color: var(--text); }

  .afl { margin-top: 12px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text4); margin-bottom: 4px; }
  .af { min-height: 56px; border: 1px solid var(--fieldBorder); border-radius: 8px; padding: 7px 4px 7px 16px; display: flex; align-items: center; gap: 4px; }
  .af .a { flex: 1; min-width: 0; font-size: 13.5px; line-height: 18px; font-weight: 600; color: var(--accentInk); }
  .af .cbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--accentInk); flex: none; }
  .af .cbtn.done { color: var(--ok); }
  /* steps share the address row's columns: a 40 lead with the badge centred, text at 52 */
  .gs { display: flex; align-items: flex-start; margin-top: 8px; min-height: 32px; }
  .gs .lead { width: 40px; height: 32px; display: grid; place-items: center; flex: none; }
  .gn { width: 24px; height: 24px; border-radius: 7px; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .gt { margin-left: 12px; flex: 1; padding: 7px 0; font-size: 13px; line-height: 18px; color: var(--text2); }
  .big .gt { padding: 4.3px 0; }
  .bar { min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--tabSel); font-size: 16px; line-height: 24px; font-weight: 600; padding: 11px; white-space: nowrap; border: 1px solid var(--cardLine); border-radius: 14px; background: var(--glass); }

  /* a line whose icon is the first glyph of its text: a wrap runs back to the left edge */
  .il-line { font-size: 12.5px; line-height: 17px; color: var(--warn); }

  .t40 { width: 40px; height: 40px; border-radius: 12px; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; flex: none; }
  .rp { height: 34px; border-radius: 17px; background: var(--tile); color: var(--accentInk); padding: 0 14px; display: flex; align-items: center; font-size: 14px; font-weight: 700; flex: none; margin-left: 8px; white-space: nowrap; }

  .fl { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text4); margin-bottom: 4px; }
  .fd { min-height: 56px; border: 1px solid var(--fieldBorder); border-radius: 8px; padding: 0 16px; display: flex; align-items: center; font-size: 15px; line-height: 21px; font-weight: 500; color: var(--text); }
  .fd.tall { min-height: 72px; align-items: flex-start; padding-top: 16px; }
  .fd.focus { border: 2px solid var(--primary); padding: 0 15px; }
  .fd .ph { color: var(--text4); opacity: .8; font-weight: 400; }
  .fc { display: flex; justify-content: flex-end; margin-top: 4px; font-size: 11.5px; line-height: 16px; color: var(--text2); }
  .q { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text); }
  .tc { display: flex; gap: 8px; margin-top: 8px; }
  .chc { flex: 1; min-height: 48px; border-radius: 10px; border: 1px solid var(--gbs); display: grid; place-items: center; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text2); }
  .chc.on { background: var(--tile); border-color: var(--tileInk); color: var(--tileInk); }
  .sinote { margin-top: 8px; font-size: 13px; line-height: 18px; color: var(--text2); }

  /* rule line: the dot is the first glyph, so a wrap runs back to the left edge too */
  .rl { font-size: 13px; line-height: 17px; color: var(--text2); }
  .rl .dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--text4); vertical-align: 3px; margin-right: 8px; }
  .rl + .rl { margin-top: 6px; }

  /* checkbox row: box, label, then the (i) on the same row */
  .bx { display: flex; align-items: center; min-height: 48px; }
  .cb { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--gbs); display: grid; place-items: center; flex: none; color: var(--onAccent); }
  .cb.on { background: var(--accent); box-shadow: none; }
  .bl { margin-left: 12px; font-size: 15px; line-height: 20px; font-weight: 500; color: var(--text); white-space: nowrap; }
  .ib { width: 40px; height: 40px; margin-left: -6px; display: grid; place-items: center; color: var(--text4); flex: none; border-radius: 50%; }
  .ib.on { color: var(--accentInk); }
  .ib.on::before { content: ""; position: absolute; width: 30px; height: 30px; border-radius: 50%; background: color-mix(in srgb, var(--accentInk) 10%, transparent); }
  .ib { position: relative; }
  .ib svg { position: relative; }

  .end { margin-top: 32px; }
  .hint { text-align: center; font-size: 12.5px; line-height: 16px; font-weight: 600; color: var(--text2); margin-bottom: 8px; min-height: 20px; padding-top: 2px; white-space: nowrap; }
  .hint.todo .il { color: var(--accentInk); }
  .hint.warn { color: var(--warn); }
  .hint.quiet { color: var(--text3); font-weight: 500; }
  .prim { min-height: 52px; border-radius: 26px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 20px; font-weight: 700; padding: 0 24px; white-space: nowrap; }
  .prim.off { background: color-mix(in srgb, var(--text) 12%, transparent); color: color-mix(in srgb, var(--text) 38%, transparent); }

  /* the box's callout, as ProblemCallout draws it */
  .pop { position: absolute; z-index: 3; }
  .pop svg.shape { position: absolute; left: 0; top: 0; overflow: visible; }
  .pop .pc { position: relative; padding: 0 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 18px; color: var(--text2); }
  .pop .pw { color: var(--warn); }

  /* system text at 1.3x: sp grows, dp stays; the app icon grows with it up to 1.3x */
  .big .pbar .pt { font-size: 28.6px; line-height: 36.4px; top: 14px; }
  .big .hn { font-size: 20.8px; line-height: 23.4px; }
  .big .ah .sub { font-size: 16.25px; line-height: 18.2px; margin-top: 2.6px; }
  .big .ah .ai { width: 67.6px !important; height: 67.6px !important; }
  .big .sh h3 { font-size: 20.8px; line-height: 24.7px; }
  .big .body { font-size: 16.9px; line-height: 23.4px; }
  .big .afl { font-size: 15.6px; line-height: 20.8px; }
  .big .af .a { font-size: 17.55px; line-height: 23.4px; }
  .big .gt { font-size: 16.9px; line-height: 23.4px; }
  .big .gn { font-size: 15.6px; }
  .big .bar { font-size: 20.8px; line-height: 31.2px; }
  .big .nm { font-size: 20.8px; line-height: 24.7px; }
  .big .r40 .sub { font-size: 16.25px; line-height: 18.2px; }
  .big .fl { font-size: 15.6px; line-height: 20.8px; }
  .big .fd { font-size: 19.5px; line-height: 27.3px; }
  .big .fc { font-size: 15px; line-height: 20.8px; }
  .big .q, .big .chc { font-size: 18.2px; line-height: 26px; }

  /* tile rows: name and group address */
  .r40 .slot { width: 40px; height: 40px; display: grid; place-items: center; flex: none; color: var(--text4); margin-left: 4px; border-radius: 50%; }
  .r40 .slot.copy { color: var(--accentInk); }
  .r40 .slot.copy.done { color: var(--ok); }
  .addr { font-size: 14px; line-height: 17px; font-weight: 600; color: var(--accentInk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ed { box-shadow: inset 0 -2px 0 var(--primary); white-space: nowrap; overflow: hidden; padding-bottom: 4px; }
  .caret { display: inline-block; width: 1.5px; height: 17px; background: var(--primary); vertical-align: -3px; margin-left: 1px; }
  .sub.edl { color: var(--accentInk); font-weight: 600; }
  .cn { font-size: 11.5px; line-height: 16px; color: var(--text4); white-space: nowrap; }
  .big .addr { line-height: 22px; }
  /* the keyboard, only so the editing frame reads true */
  .phone { position: relative; }
  .kb { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 10px 4px 34px; background: #E3E9EE; display: flex; flex-direction: column; gap: 10px; }
  .dark .kb { background: #1B1D1F; }
  .kb .kr { display: flex; gap: 6px; justify-content: center; }
  .kb .k { height: 42px; flex: 0 0 calc((100% - 54px) / 10); border-radius: 6px; background: #FFFFFF; }
  .dark .kb .k { background: #34373B; }
  .kb .k.w { flex-basis: calc((100% - 54px) / 10 * 1.5); background: #C9D3DB; }
  .dark .kb .k.w { background: #26292C; }
  .kb .k.sp { flex-basis: 50%; }
  /* Testers group, new directions */
  .nsec { width: 100%; display: flex; flex-direction: column; gap: 26px; }
  .nsec h2 { margin: 0; font-size: 20px; font-weight: 700; color: #2D4A5F; }
  .nsec .row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .cap .rec { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px; background: #246B59; color: #fff; font-size: 11px; font-weight: 700; vertical-align: 1px; }
  .opt { background: var(--bg); color: var(--text); border: 1px solid #C3CFD8; border-radius: 20px; padding: 16px; position: relative; overflow: hidden; }
  .sr { display: flex; align-items: center; min-height: 36px; }
  .sr .lead40 { width: 40px; display: grid; place-items: center; flex: none; }
  .dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--cardLine); display: grid; place-items: center; font-size: 12px; line-height: 14px; font-weight: 700; color: var(--text4); flex: none; font-variant-numeric: tabular-nums; }
  .dot.now { background: var(--accent); box-shadow: none; color: var(--onAccent); }
  .stt { margin-left: 12px; flex: 1; min-width: 0; font-size: 14px; line-height: 19px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stt.now { font-size: 15px; font-weight: 600; color: var(--text); }
  .stt b { font-weight: 600; color: var(--text); }
  .under { padding-left: 34px; }
  .under40 { padding-left: 52px; }
  .pill { height: 34px; border-radius: 10px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap; }
  .pill.soft { background: var(--tile); color: var(--accentInk); }
  .pill.solid { background: var(--accent); color: var(--onAccent); }
  .pill.addr2 { gap: 8px; max-width: 100%; }
  .pills { display: flex; gap: 8px; }
  .pills .pill { flex: 1; }
  .chev { width: 40px; height: 40px; display: grid; place-items: center; color: var(--text4); flex: none; margin-left: 4px; }
  .scrim { position: absolute; inset: 0; background: rgba(15, 25, 35, .32); }
  .sheet { position: relative; margin: 0 -16px -16px; background: var(--sheet); border-radius: 22px 22px 0 0; padding: 10px 16px 20px; }
  .handle { width: 38px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--text4) 50%, transparent); margin: 0 auto 14px; }
  .sheet .stl { font-size: 18px; line-height: 22px; font-weight: 700; color: var(--text); margin-bottom: 14px; }
  /* A, picked: address row without a tile, full-screen how-to, viewer */
  .ar .col { margin-left: 0 !important; }
  .ar .addr { line-height: 18px; }
  .fbar { height: 64px; display: flex; align-items: center; padding: 0 4px 0 16px; flex: none; background: var(--bg); position: relative; z-index: 2; }
  .fbar.line { box-shadow: 0 1px 0 var(--hair); }
  .fbar .t { flex: 1; font-size: 22px; line-height: 28px; font-weight: 700; color: var(--text); }
  .xbtn { width: 48px; height: 48px; display: grid; place-items: center; color: var(--text); flex: none; }
  .hs { display: flex; align-items: center; gap: 12px; min-height: 32px; }
  .hnum { width: 24px; height: 24px; border-radius: 50%; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
  .ht { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--text); }
  .shot { position: relative; border-radius: 12px; box-shadow: 0 0 0 1px var(--gb); overflow: hidden; aspect-ratio: 16 / 10; background: #FFFFFF; margin-top: 10px; }
  .shot .zb { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 15px; background: rgba(32, 33, 36, .62); color: #fff; display: grid; place-items: center; }
  /* a Play Console look-alike, in percentages so it zooms */
  .pcx { position: absolute; inset: 0; font-size: 0; }
  .pcx .top { position: absolute; left: 0; right: 0; top: 0; height: 10%; background: #fff; border-bottom: 1px solid #E3E6E8; }
  .pcx .top .lg { position: absolute; left: 2.5%; top: 28%; width: 3.2%; height: 44%; border-radius: 2px; background: #34A853; }
  .pcx .top .tx { position: absolute; left: 7%; top: 38%; width: 14%; height: 24%; border-radius: 2px; background: #C4C9CE; }
  .pcx .top .av { position: absolute; right: 2.5%; top: 25%; width: 3.6%; height: 50%; border-radius: 50%; background: #D2D7DB; }
  .pcx .nav { position: absolute; left: 0; top: 10%; bottom: 0; height: auto; z-index: auto; width: 22%; background: #F7F8F9; border-right: 1px solid #E3E6E8; padding-top: 4%; }
  .pcx .nav i { display: block; height: 4.2%; margin: 0 9% 5.4% 9%; border-radius: 2px; background: #D6DBDF; }
  .pcx .nav i.sub { margin-left: 18%; background: #E1E5E8; }
  .pcx .main { position: absolute; left: 22%; right: 0; top: 10%; bottom: 0; background: #FBFCFC; }
  .pcx .h1 { position: absolute; left: 5%; top: 7%; width: 34%; height: 5%; border-radius: 2px; background: #5F6368; opacity: .55; }
  .pcx .tabs { position: absolute; left: 5%; right: 5%; top: 17%; height: 8%; border-bottom: 1px solid #E3E6E8; }
  .pcx .tabs i { position: absolute; top: 30%; height: 30%; border-radius: 2px; background: #BCC2C7; }
  .pcx .card { position: absolute; left: 5%; right: 5%; top: 31%; bottom: 7%; background: #fff; border: 1px solid #E3E6E8; border-radius: 3px; }
  .pcx .card i { position: absolute; left: 5%; height: 6%; border-radius: 2px; background: #DADFE3; }
  .pcx .fld { position: absolute; left: 5%; width: 62%; top: 44%; height: 14%; border: 1px solid #BCC2C7; border-radius: 3px; background: #fff; }
  .pcx .btn { position: absolute; border-radius: 3px; background: #01875F; }
  .pcx .hl { position: absolute; border: 2px solid #E37400; border-radius: 4px; box-shadow: 0 0 0 3px rgba(227, 116, 0, .18); }
  /* viewer */
  .viewer.phone { background: #000; border-color: #000; color: #fff; }
  .viewer > .sbar, .viewer > .nav { background: #000; }
  .vbar { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; padding: 0 4px 0 16px; z-index: 3; }
  .vbar .cnt { flex: 1; font-size: 15px; line-height: 20px; font-weight: 600; color: rgba(255,255,255,.85); }
  .vbar .xbtn { color: #fff; }
  .vimg { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); }
  .vimg .shot { margin: 0; border-radius: 0; box-shadow: none; }
  .vcap { position: absolute; left: 16px; right: 16px; bottom: 20px; z-index: 3; color: #fff; font-size: 15px; line-height: 20px; font-weight: 600; }
  .vhint { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 16px; background: rgba(255,255,255,.14); color: rgba(255,255,255,.9); font-size: 12.5px; line-height: 16px; font-weight: 600; white-space: nowrap; }
  .vdots { position: absolute; left: 0; right: 0; bottom: 52px; display: flex; justify-content: center; gap: 6px; z-index: 3; }
  .vdots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.35); }
  .vdots i.on { background: #fff; width: 16px; }
</style>
</head>
<body>
<div class="doc" id="doc"></div>
<div id="chk" hidden></div>

<script>
const P = (d, s = 24, w = 2) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const inl = svg => svg.replace('class="i"', 'class="il"');
const I = {
  check: (s, w = 2.6) => P('<path d="M20 6 9 17l-5-5"/>', s, w),
  circleCheck: s => P('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>', s, 2.4),

/* scroll each frame, then draw the open callout over it */
function layout() {
  document.querySelectorAll('.phone').forEach(ph => {
    const vp = ph.querySelector('.vp'), sc = ph.querySelector('.scroll');
    sc.style.transform = '';
    ph.querySelectorAll('.pop').forEach(p => p.remove());
    if (!vp.style.height) return;
    const max = Math.max(0, sc.offsetHeight - vp.clientHeight);
    let off = 0;
    const mode = ph.dataset.scroll;
    if (mode === 'end') off = max;
    else if (mode !== 'top') {
      const a = sc.querySelector(`[data-anchor="${mode}"]`);
      off = Math.min(max, Math.max(0, a.getBoundingClientRect().top - sc.getBoundingClientRect().top - 420));
    }
    sc.style.transform = `translateY(${-off}px)`;
    const id = ph.dataset.pop;
    if (!id) return;
    const btn = sc.querySelector(`[data-info="${id}"]`);
    const box = BOXES.find(b => b.id === id);
    const vr = vp.getBoundingClientRect(), br = btn.getBoundingClientRect();
    const W = Math.min(260, ph.clientWidth - 32);
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.style.width = W + 'px';
    pop.innerHTML = `<div class="pc"><div class="pw">${box.why}</div><div>${box.how}</div></div>`;
    vp.appendChild(pop);
    const CH = 8, R = 14, HALF = 8, TIP = 1.5, INSET = 10, GAP = 4;
    const pc = pop.querySelector('.pc');
    pc.style.paddingTop = (12 + CH) + 'px'; pc.style.paddingBottom = '12px';
    const h = pop.offsetHeight;
    const x = ph.clientWidth - 16 - W;
    const y = br.bottom - vr.top - INSET + GAP;
    pop.style.left = x + 'px'; pop.style.top = y + 'px';
    const keep = R + HALF;
    const cx = Math.min(W - keep, Math.max(keep, (br.left + br.right) / 2 - vr.left - x));
    const t = CH, b = h;
    const d = `M${R} ${t} L${cx - HALF} ${t} L${cx - TIP} ${TIP} Q${cx} 0 ${cx + TIP} ${TIP} L${cx + HALF} ${t} L${W - R} ${t} A${R} ${R} 0 0 1 ${W} ${t + R} L${W} ${b - R} A${R} ${R} 0 0 1 ${W - R} ${b} L${R} ${b} A${R} ${R} 0 0 1 0 ${b - R} L0 ${t + R} A${R} ${R} 0 0 1 ${R} ${t} Z`;
    pop.insertAdjacentHTML('afterbegin', `<svg class="shape" width="${W}" height="${h}"><path d="${d}" fill="var(--sheet)" stroke="var(--gb)" stroke-width="1"/></svg>`);
  });
}

/* layout check for the headless run, kept out of sight */
function check() {
  const bad = [];
  document.querySelectorAll('.phone:not(.big) [data-tile], .big .ah').forEach(row => {
    const ic = row.querySelector('.ai, .t40'), col = row.querySelector('.col');
    if (col.offsetHeight > ic.offsetHeight + 0.5) bad.push('tall: ' + col.textContent.trim().slice(0, 30) + ' ' + col.offsetHeight);
  });
  document.querySelectorAll('.one, .prim, .bar, .rp, .sh .st, .bl').forEach(t => {
    if (t.scrollWidth > t.clientWidth + 1) bad.push('cut: ' + t.textContent.trim().slice(0, 40));
  });
  document.querySelectorAll('.opt').forEach(o => { o.querySelectorAll('.fu .v, .nm:not(.ed)').forEach(v => { if (v.scrollWidth > v.clientWidth + 1) bad.push('name cut ' + o.style.width + ' ' + v.textContent.slice(0, 20)); }); });
  document.querySelectorAll('.addr').forEach(a => { if (a.scrollWidth > a.clientWidth + 0.5) bad.push('addr cut ' + a.closest('.phone, .opt').style.width); });
  document.querySelectorAll('.stt, .pill').forEach(t => { if (t.scrollWidth > t.clientWidth + 1) bad.push('cut ' + t.textContent.trim().slice(0, 30) + ' @' + t.closest('.opt').style.width); });
  document.querySelectorAll('.hint').forEach(h => { if (h.offsetHeight > 20.5) bad.push('wraps: ' + h.textContent.trim()); });
  document.querySelectorAll('.bx').forEach(r => { if (r.offsetHeight > 48.5 || r.scrollWidth > r.clientWidth + 1) bad.push('box row ' + r.textContent.trim()); });
  document.querySelectorAll('.phone:not(.big) .af').forEach(f => { const a = f.querySelector('.a'); if (a.scrollWidth > a.clientWidth + 1 || f.offsetHeight > 56.5) bad.push('addr ' + f.closest('.phone, .opt').style.width + ' h' + f.offsetHeight); });
  document.querySelectorAll('.pop').forEach(p => { const ph = p.closest('.phone').getBoundingClientRect(), r = p.getBoundingClientRect(); if (r.right > ph.right - 15 || r.left < ph.left + 15 || r.bottom > ph.bottom - 24) bad.push('pop out'); });
  const names = [...document.querySelectorAll('.ah')].map(n => n.querySelector('.hn').offsetHeight + '/' + n.querySelector('.col').offsetHeight + '/' + n.querySelector('.ai').offsetHeight + '@' + n.closest('.phone, .opt').style.width + (n.closest('.big') ? 'big' : ''));
  const gaps = [...document.querySelectorAll('.bx')].slice(0, 2).map(r => Math.round(r.querySelector('.ib svg').getBoundingClientRect().left - r.querySelector('.bl').getBoundingClientRect().right));
  document.getElementById('chk').textContent = (bad.length ? 'BAD ' + [...new Set(bad)].join('; ') : 'OK') + ' | names ' + [...new Set(names)].join(',') + ' | addr sp ' + [...new Set([...document.querySelectorAll('.addr')].map(a => a.dataset.sp + '@' + a.closest('.phone, .opt').style.width + (a.closest('.big') ? 'big' : '')))].join(',') + ' | align ' + [...new Set([...document.querySelectorAll('.phone')].filter(ph => ph.querySelector('.addr') && ph.querySelector('.gt')).map(ph => { const L = ph.getBoundingClientRect().left; const a = ph.querySelector('.addr').getBoundingClientRect().left - L, t = ph.querySelector('.gt').getBoundingClientRect().left - L; const tc = ph.querySelector('[data-fit]').closest('.r40').querySelector('.t40').getBoundingClientRect(), gc = ph.querySelector('.gn').getBoundingClientRect(); return Math.round(a) + '/' + Math.round(t) + ' c' + Math.round(tc.left + tc.width / 2 - L) + '/' + Math.round(gc.left + gc.width / 2 - L); }))].join(',') + ' | label-to-glyph ' + gaps.join(',') + ' | rects ' + [...document.querySelectorAll('.state')].map(e => { const r = e.getBoundingClientRect(); return [r.left, r.top + scrollY, r.width, r.height].map(Math.round).join(':'); }).join(';');
}
function fit() {
  document.querySelectorAll('[data-fit]').forEach(a => {
    const k = a.closest('.big') ? 1.3 : 1;
    if (a.closest('.pill')) { const pill = a.closest('.pill'); a.style.maxWidth = (pill.parentElement.clientWidth - 24 - 16 - 8) + 'px'; }
    let sz = +(a.dataset.max || 14);
    a.style.fontSize = sz * k + 'px';
    while (a.scrollWidth > a.clientWidth + 0.5 && sz > 10) { sz -= 0.5; a.style.fontSize = sz * k + 'px'; }
    a.dataset.sp = sz;
  });
}
function run() { fit(); layout(); check(); }
run();
document.fonts.ready.then(run);
</script>
