<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Take a seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "BarlowApp"; font-weight: 400; src: url("../../../app/src/main/res/font/barlow_regular.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 500; src: url("../../../app/src/main/res/font/barlow_medium.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 600; src: url("../../../app/src/main/res/font/barlow_semibold.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 700; src: url("../../../app/src/main/res/font/barlow_bold.ttf"); }

  .light {
    --bg:#F7FCFF; --text:#142F43; --text2:#203A4E; --text3:#223D50; --text4:#59758A;
    --tabSel:#2E4E66; --glass:#F2F9FD; --gbs:#789AAF; --hair:#B7D1E2;
    --cardLine:#E1ECF3; --accent:#3A5B73; --onAccent:#FFFFFF; --accentInk:#22394B;
    --primary:#3A5B73; --onPrimary:#FFFFFF; --tile:#DCE6EE; --tileInk:#3A5B73;
    --ok:#246B59; --warn:#8A611C; --bad:#9E3B2E;
    --fieldBorder:#789AAF; --sheet:#FFFFFF; --flaskL:#9279D6; --flaskG:#4A3B86;
  }
  .dark {
    --bg:#0F1011; --text:#ECEEF0; --text2:#BCC1C6; --text3:#9DA3A9; --text4:#757C82;
    --tabSel:#B6CCDC; --glass:#1C1E20; --gbs:#666D74; --hair:#2B2E32;
    --cardLine:#2D3034; --accent:#4A7290; --onAccent:#FFFFFF; --accentInk:#93B3CA;
    --primary:#93B3CA; --onPrimary:#0F1011; --tile:#2A2D31; --tileInk:#A2BED2;
    --ok:#83D8C4; --warn:#D8B774; --bad:#E4938A;
    --fieldBorder:#666D74; --sheet:#1C1E20; --flaskL:#8C70D4; --flaskG:#CDBEF0;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #E7ECEF; font-family: "BarlowApp", "Barlow", system-ui, sans-serif; }
  .doc { padding: 28px; display: flex; flex-direction: column; gap: 48px; }
  .state { display: flex; flex-direction: column; }
  .lbl { font-size: 15px; font-weight: 700; color: #2D4A5F; margin: 0 0 8px 4px; }
  .pair { display: flex; gap: 16px; align-items: flex-start; }
  .row { display: flex; flex-wrap: wrap; gap: 40px 48px; align-items: flex-start; width: 100%; }
  svg.i { display: block; flex: none; }

  .phone { background: var(--bg); color: var(--text); border-radius: 26px; overflow: hidden; border: 1px solid #C3CFD8; display: flex; flex-direction: column; }
  .dark.phone { border-color: #2A2D31; }
  .sbar { height: 24px; }
  .pbar { height: 64px; position: relative; }
  .pbar .back { position: absolute; left: 16px; top: 20px; color: var(--text); }
  .pbar .pt { position: absolute; left: 56px; top: 18px; font-size: 22px; line-height: 28px; font-weight: 700; }
  .scroll { padding: 8px 16px 20px; }
  .foot { border-top: 1px solid var(--hair); padding: 12px 16px; }
  .nav { height: 24px; }
  .one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ai { border-radius: 30%; flex: none; position: relative; }
  .ai i { position: absolute; left: 28%; top: 28%; width: 44%; height: 44%; border-radius: 30%; background: rgba(255,255,255,.88); }
  .ai .mk { position: absolute; right: -5px; bottom: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--sheet); box-shadow: 0 0 0 2px var(--bg); display: grid; place-items: center; }

  .ah, .r40 { display: flex; align-items: center; }
  .r40 { min-height: 40px; }
  .ah .col, .r40 .col { flex: 1; min-width: 0; margin-left: 12px; }
  .nm { font-size: 16px; line-height: 19px; font-weight: 600; color: var(--text); }
  .sub { margin-top: 2px; font-size: 12.5px; line-height: 14px; font-weight: 500; color: var(--text3); display: flex; align-items: center; gap: 4px; }
  .sub.acc { color: var(--accentInk); }
  .sub.warn { color: var(--warn); font-weight: 600; }

  .sec { margin-top: 32px; }
  .sec.first { margin-top: 24px; }
  .sh { display: flex; align-items: center; min-height: 19px; margin-bottom: 8px; gap: 8px; }
  .sh h3 { margin: 0; flex: 1; font-size: 16px; line-height: 19px; font-weight: 700; color: var(--text); }
  .sh .st { display: flex; align-items: center; gap: 4px; font-size: 12.5px; line-height: 14px; font-weight: 600; white-space: nowrap; }
  .sh.done { margin-bottom: 0; }
  .st.ok { color: var(--ok); } .st.warn { color: var(--warn); }
  .body { font-size: 13px; line-height: 18px; color: var(--text2); }
  .gt b, .rl b, .bh b { font-weight: 600; color: var(--text); }

  .afl { margin-top: 12px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text4); margin-bottom: 4px; }
  .af { min-height: 56px; border: 1px solid var(--fieldBorder); border-radius: 8px; padding: 7px 4px 7px 16px; display: flex; align-items: center; gap: 4px; }
  .af .a { flex: 1; min-width: 0; font-size: 13.5px; line-height: 18px; font-weight: 600; color: var(--accentInk); }
  .af .cbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--accentInk); flex: none; }
  .af .cbtn.done { color: var(--ok); }
  .gs { display: flex; align-items: flex-start; margin-top: 8px; }
  .gn { width: 22px; height: 22px; border-radius: 7px; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .gt { margin-left: 10px; flex: 1; padding-top: 2px; font-size: 13px; line-height: 18px; color: var(--text2); }
  .ck { display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; line-height: 17px; color: var(--warn); }
  .ck svg { margin-top: 1.5px; }
  .bar { min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--tabSel); font-size: 16px; line-height: 24px; font-weight: 600; padding: 11px; white-space: nowrap; border: 1px solid var(--cardLine); border-radius: 14px; background: var(--glass); }

  .t40 { width: 40px; height: 40px; border-radius: 12px; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; flex: none; }
  .rp { height: 34px; border-radius: 17px; background: var(--tile); color: var(--accentInk); padding: 0 14px; display: flex; align-items: center; font-size: 14px; font-weight: 700; flex: none; margin-left: 8px; white-space: nowrap; }

  .fl { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text4); margin-bottom: 4px; }
  .fd { min-height: 56px; border: 1px solid var(--fieldBorder); border-radius: 8px; padding: 0 16px; display: flex; align-items: center; font-size: 15px; line-height: 21px; font-weight: 500; color: var(--text); }
  .fd.tall { min-height: 72px; align-items: flex-start; padding-top: 16px; }
  .fd.focus { border: 2px solid var(--primary); padding: 0 15px; }
  .fd .ph { color: var(--text4); opacity: .8; font-weight: 400; }
  .fc { display: flex; justify-content: flex-end; margin-top: 4px; font-size: 11.5px; line-height: 16px; color: var(--text2); }
  .q { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text); }
  .tc { display: flex; gap: 8px; margin-top: 8px; }
  .chc { flex: 1; min-height: 48px; border-radius: 10px; border: 1px solid var(--gbs); display: grid; place-items: center; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text2); }
  .chc.on { background: var(--tile); border-color: var(--tileInk); color: var(--tileInk); }
  .sinote { margin-top: 8px; font-size: 13px; line-height: 18px; color: var(--text2); }

  .rl { display: flex; font-size: 13px; line-height: 17px; color: var(--text2); }
  .rl::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--text4); margin: 6.5px 8px 0 0; flex: none; }
  .rl + .rl { margin-top: 6px; }

  .bxb.open { padding-bottom: 8px; }
  .bx { display: flex; align-items: center; min-height: 48px; }
  .cb { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--gbs); display: grid; place-items: center; flex: none; color: var(--onAccent); }
  .cb.on { background: var(--accent); box-shadow: none; }
  .bl { margin-left: 12px; font-size: 15px; line-height: 20px; font-weight: 500; color: var(--text); }
  .bw { padding-left: 34px; display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; line-height: 17px; color: var(--warn); }
  .bw svg { margin-top: 2px; }
  .bh { padding-left: 34px; margin-top: 2px; font-size: 12.5px; line-height: 17px; color: var(--text3); }

  .hint { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; line-height: 16px; font-weight: 600; color: var(--text2); margin-bottom: 8px; min-height: 20px; }
  .hint.todo svg { color: var(--accentInk); }
  .hint.warn { color: var(--warn); }
  .hint.quiet { color: var(--text3); font-weight: 500; }
  .prim { min-height: 52px; border-radius: 26px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 20px; font-weight: 700; padding: 0 24px; white-space: nowrap; }
  .prim.off { background: color-mix(in srgb, var(--text) 12%, transparent); color: color-mix(in srgb, var(--text) 38%, transparent); }
</style>
</head>
<body>
<div class="doc" id="doc"></div>
<div id="chk" hidden></div>

<script>
const P = (d, s = 24, w = 2) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  check: (s, w = 2.6) => P('<path d="M20 6 9 17l-5-5"/>', s, w),
  circleCheck: s => P('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>', s, 2.4),
  circleAlert: s => P('<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>', s, 2.4),
  circleDashed: s => P('<path d="M10.1 2.182a10 10 0 0 1 3.8 0"/><path d="M13.9 21.818a10 10 0 0 1-3.8 0"/><path d="M17.609 3.721a10 10 0 0 1 2.69 2.7"/><path d="M2.182 13.9a10 10 0 0 1 0-3.8"/><path d="M20.279 17.609a10 10 0 0 1-2.7 2.69"/><path d="M21.818 10.1a10 10 0 0 1 0 3.8"/><path d="M3.721 6.391a10 10 0 0 1 2.7-2.69"/><path d="M6.391 20.279a10 10 0 0 1-2.69-2.7"/>', s, 2.6),
  alert: s => P('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>', s, 2.2),
  refresh: s => P('<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>', s),
  copy: s => P('<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>', s, 2.2),
  users: s => P('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>', s),
  coins: s => P('<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>', s),
  clock: s => P('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', s, 2.4),
  backIos: s => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M17.77 3.77 16 2 6 12l10 10 1.77-1.77L9.54 12z"/></svg>`,
  flask: s => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M7.9 14.3Q10 13.2 12 14.3T16.1 14.3L19.1 20.3Q19.4 21.6 18.1 21.6H5.9Q4.6 21.6 4.9 20.3Z" fill="var(--flaskL)"/><path d="M10 3v6.5a2 2 0 0 1-.2.9L4.8 20.4a1 1 0 0 0 .9 1.4h12.6a1 1 0 0 0 .9-1.4L14.2 10.4a2 2 0 0 1-.2-.9V3M8.6 3h6.8" fill="none" stroke="var(--flaskG)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

const APP = { name: 'Sunrise Notes', dev: 'Brightleaf Studio', grad: '#ff8a3d,#e8453c' };
const ADDR = 'googleclosetesting@googlegroups.com';
const COST = 100, SEATS = 15, DAYS = 14;
const icon = s => `<div class="ai" style="width:${s}px;height:${s}px;background:linear-gradient(135deg,${APP.grad})"><i></i><span class="mk">${I.flask(12)}</span></div>`;

const BASE = { group: 'new', name: APP.name, signIn: false, user: '', pass: '', tix: 240, boxes: [false, false] };

/* seatHint() in CrewSeatRules.kt, first match wins */
function hint(s) {
  if (s.group === 'failed') return { t: "Play doesn't show it to the group yet", k: 'warn', i: I.alert(14) };
  if (s.group === 'new') return { t: 'Verify the testers group first', k: 'todo', i: I.circleDashed(14) };
  if (!s.name.trim()) return { t: 'Give it a name the crew sees', k: 'todo', i: I.circleDashed(14) };
  if (s.signIn && !s.user.trim()) return { t: "Add the test account's username", k: 'todo', i: I.circleDashed(14) };
  if (s.signIn && !s.pass.trim()) return { t: "Add the test account's password", k: 'todo', i: I.circleDashed(14) };
  if (s.tix < COST) return { t: `You need ${COST - s.tix} more tix`, k: 'warn', i: I.alert(14) };
  if (!(s.boxes[0] && s.boxes[1])) return { t: 'Tick both Play Console boxes', k: 'todo', i: I.circleDashed(14) };
  return null;
}

function groupPart(s) {
  if (s.group === 'ok') {
    return `<div class="sec first"><div class="sh done"><h3>Testers group</h3><span class="st ok">${I.circleCheck(14)}Play shows it</span></div></div>`;
  }
  const failed = s.group === 'failed';
  return `<div class="sec first"><div class="sh"><h3>Testers group</h3>${failed ? `<span class="st warn">${I.circleAlert(14)}Not shown yet</span>` : ''}</div>
    <div class="body">Crew members install your app through this Google Group. Play has to show your app to it first.</div>
    <div class="afl">Group address</div>
    <div class="af"><span class="a">googleclosetesting<wbr>@googlegroups.com</span><span class="cbtn${s.copied ? ' done' : ''}">${s.copied ? I.check(18, 2.4) : I.copy(18)}</span></div>
    <div class="gs"><span class="gn">1</span><span class="gt">In Play Console, open <b>Test and release</b>, then <b>Closed testing</b>.</span></div>
    <div class="gs"><span class="gn">2</span><span class="gt">Open your track's <b>Testers</b> tab.</span></div>
    <div class="gs"><span class="gn">3</span><span class="gt">Under <b>Google Groups</b>, paste the address and save.</span></div>
    <div class="gs"><span class="gn">4</span><span class="gt">Roll out a release to that track.</span></div>
    <div style="height:16px"></div>
    ${failed ? `<div class="ck">${I.alert(14)}<span>Checked 5 min ago: Play doesn't show it to the group yet. A new rollout can take a few hours to show.</span></div>` : ''}
    <div style="height:8px"></div>
    <div class="bar">${I.refresh(20)}<span>${failed ? 'Check again' : 'Verify on Play'}</span></div></div>`;
}

function detailsPart(s) {
  const short = s.tix < COST;
  let h = `<div class="sec"><div class="sh"><h3>Seat details</h3>${short ? `<span class="st warn">${I.circleAlert(14)}${COST - s.tix} tix short</span>` : ''}</div>
    <div class="r40" data-tile><span class="t40">${I.users(20)}</span><div class="col"><div class="nm one">Crew 07, 6 seats left</div><div class="sub acc">${I.clock(11)}<span class="one">Likely starts Friday</span></div></div></div>
    <div style="height:16px"></div>
    <div class="fl">Name the crew sees</div><div class="fd">${s.name}</div><div class="fc">${s.name.length}/60</div>
    <div style="height:16px"></div>
    <div class="q">Does your app need a sign-in?</div><div class="tc"><div class="chc${s.signIn ? '' : ' on'}">No sign-in</div><div class="chc${s.signIn ? ' on' : ''}">Needs a sign-in</div></div>`;
  if (s.signIn) {
    h += `<div class="sinote">A test account the crew can use, as Play Console's App access asks for. Fourteen testers see it, so never your own.</div>
      <div style="height:16px"></div>
      <div class="fl">Username, email or phone</div><div class="fd">${s.user || '<span class="ph">test@example.com</span>'}</div>
      <div style="height:16px"></div>
      <div class="fl">Password</div><div class="fd focus"><span class="ph">The test account's password</span></div>
      <div style="height:16px"></div>
      <div class="fl">Anything else needed (optional)</div><div class="fd tall"><span class="ph">A one-time code, or which screen to skip</span></div><div class="fc">0/90</div>`;
  }
  const sub = short ? `<div class="sub warn"><span class="one">You have ${s.tix} tix, ${COST - s.tix} short</span></div>` : `<div class="sub"><span class="one">You have ${s.tix} tix</span></div>`;
  h += `<div style="height:24px"></div>
    <div class="r40" data-tile><span class="t40">${I.coins(20)}</span><div class="col"><div class="nm one">A seat is ${COST} tix</div>${sub}</div>${short ? '<span class="rp">Open Circle</span>' : ''}</div>
    <div style="height:16px"></div>
    <div class="rl"><span>All <b>${COST} tix</b> come back if you take it out while the crew fills, or open every app every night to the end.</span></div>
    <div class="rl"><span>You open the other <b>${SEATS - 1}</b> apps every day for <b>${DAYS}</b> days, and they open yours.</span></div>
    <div class="rl"><span>That puts you on <b>${SEATS - 1}</b> apps a night.</span></div>`;
  return h + '</div>';
}

function boxesPart(s) {
  const rows = [
    ['Available in all countries', "Members in other countries can't install it. If two of them report that, you lose your seat.", 'In Play Console, open <b>Closed testing</b>, then <b>Countries/regions</b>, and add all countries.'],
    ['Not limited to some devices', "Members on excluded phones can't install it. If two of them report that, you lose your seat.", 'In Play Console, open <b>Device catalog</b> and remove excluded devices.'],
  ];
  let h = `<div class="sec"><div class="sh"><h3>Before you submit</h3></div>
    <div class="body">You set both in Play Console. Every member needs them to install your app.</div><div style="height:8px"></div>`;
  rows.forEach(([label, why, how], i) => {
    const on = s.boxes[i];
    h += `<div class="bxb${on ? '' : ' open'}"><div class="bx"><span class="cb${on ? ' on' : ''}">${on ? I.check(14, 3) : ''}</span><span class="bl">${label}</span></div>`;
    if (!on) h += `<div class="bw">${I.alert(13)}<span>${why}</span></div><div class="bh">${how}</div>`;
    h += '</div>';
  });
  return h + '</div>';
}

function page(s) {
  s = { ...BASE, ...s };
  const body = `<div class="ah" data-tile>${icon(52)}<div class="col"><div class="nm one">${APP.name}</div><div class="sub"><span class="one">${APP.dev}</span></div></div></div>`
    + groupPart(s) + detailsPart(s) + boxesPart(s);
  const m = hint(s);
  const h = m ? `<div class="hint ${m.k}">${m.i}<span>${m.t}</span></div>`
              : `<div class="hint quiet">${I.coins(14)}<span>${COST} tix come off your ${s.tix}</span></div>`;
  return { body, foot: h + `<div class="prim${m ? ' off' : ''}">Take a seat in Crew 07</div>` };
}

function phone(theme, p, w) {
  return `<div class="phone ${theme}" style="width:${w}px"><div class="sbar"></div><div class="pbar"><span class="back">${I.backIos(24)}</span><span class="pt">Take a seat</span></div>
    <div class="scroll">${p.body}</div><div class="foot">${p.foot}</div><div class="nav"></div></div>`;
}

const STATES = [
  ['Group not shown', { group: 'new' }],
  ['Check failed', { group: 'failed', copied: true }],
  ['Boxes unticked', { group: 'ok' }],
  ['Ready', { group: 'ok', boxes: [true, true] }],
  ['Short of tix', { group: 'ok', boxes: [true, true], tix: 60 }],
  ['Sign-in open', { group: 'ok', boxes: [true, true], signIn: true, user: 'crewtest@sunrisenotes.app' }],
];
const frames = (list, w) => '<div class="row">' + list.map(([label, st]) => {
  const p = page(st);
  return `<div class="state"><div class="lbl">${label}</div><div class="pair">${phone('light', p, w)}${phone('dark', p, w)}</div></div>`;
}).join('') + '</div>';
document.getElementById('doc').innerHTML =
  frames([['Group not shown, 360', { group: 'new' }], ['Check failed, 360', { group: 'failed', copied: true }]], 360) +
  frames(STATES, 412);

/* layout check for the headless run, kept out of sight */
function check() {
  const bad = [];
  document.querySelectorAll('[data-tile]').forEach(row => {
    const ic = row.querySelector('.ai, .t40'), col = row.querySelector('.col');
    if (col.offsetHeight > ic.offsetHeight + 0.5) bad.push('tall: ' + col.textContent.trim().slice(0, 24));
  });
  document.querySelectorAll('.one, .prim, .bar, .rp, .cpy, .hint span, .sh .st').forEach(t => {
    if (t.scrollWidth > t.clientWidth + 1) bad.push('cut: ' + t.textContent.trim().slice(0, 40));
  });
  document.querySelectorAll('.hint').forEach(h => { if (h.offsetHeight > 20.5) bad.push('wraps: ' + h.textContent.trim()); });
  document.querySelectorAll('.af').forEach(f => { const a = f.querySelector('.a'); if (a.scrollWidth > a.clientWidth + 1 || f.offsetHeight > 56.5) bad.push('addr ' + f.closest('.phone').style.width + ' h' + f.offsetHeight); });
  document.getElementById('chk').textContent = bad.length ? 'BAD ' + [...new Set(bad)].join('; ') : 'OK';
}
check(); document.fonts.ready.then(check);
</script>
