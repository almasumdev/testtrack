<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My apps: app page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "BarlowApp"; font-weight: 400; src: url("../../../app/src/main/res/font/barlow_regular.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 500; src: url("../../../app/src/main/res/font/barlow_medium.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 600; src: url("../../../app/src/main/res/font/barlow_semibold.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 700; src: url("../../../app/src/main/res/font/barlow_bold.ttf"); }
  @font-face { font-family: "PlexApp"; font-weight: 500; src: url("../../../app/src/main/res/font/plexmono_medium.ttf"); }
  @font-face { font-family: "PlexApp"; font-weight: 700; src: url("../../../app/src/main/res/font/plexmono_bold.ttf"); }

  /* OceanLight / OceanDark from ui/theme/Tokens.kt */
  .light {
    --bg:#F7FCFF; --text:#142F43; --text2:#203A4E; --text3:#223D50; --text4:#59758A;
    --glass:#F2F9FD; --glass2:#DFEDF6; --glassBorder:#B7D1E2; --glassBorderStrong:#789AAF;
    --accent:#3A5B73; --onAccent:#FFFFFF; --accentInk:#22394B; --badgeFill:#3A5B73;
    --tile:#DCE6EE; --tileInk:#3A5B73;
    --ok:#246B59; --okBg:rgba(36,107,89,.12); --warn:#8A611C; --warnBg:rgba(154,110,36,.12);
    --bad:#9E3B2E; --badBg:rgba(158,59,46,.12);
    --track:#E4EEF4; --cardLine:#E1ECF3; --sheet:#FFFFFF; --ring:rgba(20,47,67,.14); --surface3:#C7DEED;
    --primary:var(--accent); --onPrimary:var(--onAccent); --scrim:rgba(20,34,48,.46);
  }
  .dark {
    --bg:#0F1011; --text:#ECEEF0; --text2:#BCC1C6; --text3:#9DA3A9; --text4:#757C82;
    --glass:#1C1E20; --glass2:#292C2F; --glassBorder:#383C41; --glassBorderStrong:#666D74;
    --accent:#4A7290; --onAccent:#FFFFFF; --accentInk:#93B3CA; --badgeFill:#4A7290;
    --tile:#2A2D31; --tileInk:#A2BED2;
    --ok:#83D8C4; --okBg:rgba(131,216,196,.12); --warn:#D8B774; --warnBg:rgba(216,183,116,.14);
    --bad:#E4938A; --badBg:rgba(228,147,138,.15);
    --track:#2D3034; --cardLine:#2D3034; --sheet:#1C1E20; --ring:rgba(255,255,255,.16); --surface3:#2E3236;
    --primary:var(--accentInk); --onPrimary:var(--bg); --scrim:rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #D9E0E5; font-family: "BarlowApp", "Barlow", system-ui, sans-serif; color: #1B2B36; }
  body.dk { background: #2A3036; color: #E3E8EC; }
  .top { position: sticky; top: 0; z-index: 9; display: flex; align-items: center; gap: 10px; padding: 12px 28px; background: inherit; border-bottom: 1px solid #C3CDD4; }
  body.dk .top { border-color: #3A4249; }
  .top h1 { margin: 0 14px 0 0; font-size: 20px; font-weight: 700; }
  .top button { font: 600 15px/20px "BarlowApp", "Barlow", sans-serif; padding: 8px 18px; border-radius: 20px; border: 1px solid #B3C0C9; background: #F4F7F9; color: #2D4A5F; cursor: pointer; }
  .top button.on { background: #2D4A5F; color: #fff; border-color: #2D4A5F; }
  .doc { padding: 26px 28px 80px; }
  .sec { font-size: 18px; font-weight: 700; margin: 34px 0 14px 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 34px 30px; align-items: flex-start; }
  .state { display: flex; flex-direction: column; gap: 8px; }
  .lbl { font-size: 15px; font-weight: 700; margin-left: 4px; display: flex; gap: 8px; align-items: center; }
  .tag { padding: 2px 9px; border-radius: 10px; font-size: 11.5px; font-weight: 700; color: #fff; background: #246B59; }
  .tag.old { background: #7A8691; }
  .zoom { zoom: .8; }

  /* phone */
  .phone { width: 412px; background: var(--bg); color: var(--text); border-radius: 28px; overflow: hidden; border: 1px solid #B9C5CE; position: relative; display: flex; flex-direction: column; }
  .phone.fix { height: 800px; }
  .dark.phone { border-color: #3A4046; }
  .sbar { height: 24px; flex: none; }
  .pbar { height: 64px; flex: none; display: flex; align-items: center; }
  .pbar .back { width: 48px; height: 48px; display: grid; place-items: center; margin-left: 4px; color: var(--text); }
  .scroll { padding: 8px 16px 28px; flex: 1; }

  /* icons, text helpers */
  svg.ic { display: block; flex: none; }
  .inl { display: inline-block; vertical-align: -2px; margin-right: 6px; }
  .inl svg { display: inline-block; }
  .i-ok { color: var(--ok); } .i-warn { color: var(--warn); } .i-bad { color: var(--bad); } .i-acc { color: var(--accentInk); }
  .ai { display: grid; place-items: center; flex: none; overflow: hidden; box-shadow: inset 0 0 0 1px var(--ring); font-weight: 700; }
  .light .nt { background: hsl(var(--h) 45% 89%); color: hsl(var(--h) 50% 32%); box-shadow: none; }
  .dark .nt { background: hsl(var(--h) 30% 18%); color: hsl(var(--h) 55% 76%); box-shadow: none; }

  /* StatusChip */
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 12.5px; line-height: 16px; font-weight: 700; white-space: nowrap; }
  .chip.ok { background: var(--okBg); color: var(--ok); } .chip.warn { background: var(--warnBg); color: var(--warn); }
  .chip.bad { background: var(--badBg); color: var(--bad); } .chip.quiet { background: var(--glass2); color: var(--text2); }

  /* CountBadge */
  .cb { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--badgeFill); color: var(--onAccent); font: 700 12px/22px "PlexApp", "IBM Plex Mono", monospace; text-align: center; display: inline-block; }

  /* app header */
  .hd { display: flex; align-items: center; gap: 14px; }
  .hico { position: relative; flex: none; width: 64px; height: 64px; }
  .pen { position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); border: 1px solid var(--glassBorder); display: grid; place-items: center; color: var(--accentInk); }
  .ibusy { position: absolute; inset: 0; border-radius: 19px; background: color-mix(in srgb, var(--bg) 72%, transparent); display: grid; place-items: center; }
  .hd .col { flex: 1; min-width: 0; }
  .hn { font-size: 18px; line-height: 22px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hp { margin-top: 2px; font-size: 12.5px; line-height: 16px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .facts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .nudge { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .nudge .il { flex: 1; }

  /* IconLine: icon is the first glyph, wrapped lines run back to the edge */
  .il { font-size: 13px; line-height: 18px; color: var(--text2); }
  .il.sm { font-size: 12.5px; line-height: 17px; color: var(--text3); }
  .il .inl { color: var(--text3); }
  .il.bad, .il.bad .inl { color: var(--bad); }

  /* (i) and its callout */
  .ii { position: relative; display: inline-grid; place-items: center; width: 22px; height: 18px; vertical-align: -3px; color: var(--text3); }
  .ii.on { color: var(--accentInk); }
  .ii.on::before { content: ""; position: absolute; width: 24px; height: 24px; border-radius: 50%; background: color-mix(in srgb, var(--accentInk) 10%, transparent); }
  .callout { position: absolute; z-index: 3; top: 28px; left: -70px; width: 290px; background: var(--sheet); border: 1px solid var(--glassBorder); border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 18px; color: var(--text2); box-shadow: 0 6px 18px rgba(0,0,0,.14); text-align: left; font-weight: 400; }
  .callout::before { content: ""; position: absolute; top: -7px; left: 75px; width: 12px; height: 12px; background: var(--sheet); border-left: 1px solid var(--glassBorder); border-top: 1px solid var(--glassBorder); transform: rotate(45deg); }

  /* headings (CrewHeading) */
  .head { display: flex; align-items: center; gap: 5px; font-size: 16px; line-height: 19px; font-weight: 700; padding: 20px 0 10px; }
  .head .q { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text3); }

  /* CrewCard */
  .card { background: var(--bg); border: 1px solid var(--cardLine); border-radius: 14px; position: relative; }
  .p16 { padding: 16px; }
  .th { display: flex; align-items: center; gap: 8px; }
  .th .nm { flex: 1; min-width: 0; font-size: 18px; line-height: 23px; font-weight: 600; }
  .th .dt { font-size: 12px; line-height: 17px; color: var(--text3); white-space: nowrap; }
  .th .dt.bad { color: var(--bad); } .th .dt.ok { color: var(--ok); } .th .dt.warn { color: var(--warn); }
  .ln { margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--text3); }
  .hl15 { font-size: 15px; line-height: 20px; font-weight: 500; }
  .stand { display: flex; align-items: center; gap: 12px; }
  .stand .hl { flex: 1; font-size: 15px; line-height: 20px; font-weight: 500; }
  .stand .rt { flex: 1; font-size: 12px; line-height: 17px; color: var(--text3); text-align: right; }
  .acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; margin: 8px -8px -6px 0; }
  .stand .hl { min-width: 0; }
  .stand .ia { flex: none; max-width: 45%; }
  /* empty crew / feedback: compact row (empty-cards.html option A) */
  .ra { display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 60px; }
  .ra .col { flex: 1; min-width: 0; }
  .ra .t { font-size: 16px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ra .s { font-size: 12.5px; line-height: 16px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { flex: none; max-width: 44%; min-height: 32px; padding: 7px 14px; border-radius: 16px; font-size: 13.5px; line-height: 16px; font-weight: 700; text-align: center; overflow-wrap: anywhere; }
  .pill.fill { background: var(--primary); color: var(--onPrimary); } .pill.ton { background: var(--tile); color: var(--accentInk); }
  .stand .ia { margin-right: -8px; }

  /* app strips (CrewRunAppIcons / CrewLobbyAppIcons) */
  .strip { display: flex; justify-content: space-between; }
  .si { position: relative; width: 24px; height: 24px; flex: none; }
  .si.faint > .ai { opacity: .45; }
  .cm { position: absolute; right: -3.5px; bottom: -3.5px; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--bg); display: grid; place-items: center; }
  .cm.ok { background: var(--ok); color: var(--bg); } .cm.out { background: var(--text3); color: var(--bg); } .cm.rep { background: var(--warn); color: var(--bg); }
  .light .cm.ok, .light .cm.out, .light .cm.rep { color: #fff; }
  .ph { width: 24px; height: 24px; border-radius: 7px; background: var(--tile); display: grid; place-items: center; color: var(--text3); }
  .ph.chk { box-shadow: 0 0 0 1.5px var(--warn); }
  .mine { position: absolute; right: -1px; bottom: -1px; width: 6px; height: 6px; border-radius: 50%; background: var(--accentInk); border: 1px solid var(--bg); }

  /* chat mark */
  .chat { position: relative; width: 28px; height: 28px; display: grid; place-items: center; color: var(--text2); flex: none; margin-left: 2px; }
  .chat .n { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 3.5px; border-radius: 9px; background: var(--badgeFill); color: var(--onAccent); border: 1.5px solid var(--bg); font: 700 10px/15px "PlexApp", "IBM Plex Mono", monospace; text-align: center; }

  /* meter (SegmentMeter) */
  .meter { display: flex; gap: 4px; }
  .meter i { flex: 1; height: 7px; border-radius: 4px; background: var(--track); }
  .meter i.acc { background: var(--accent); } .meter i.ok { background: var(--ok); } .meter i.now { background: color-mix(in srgb, var(--accent) 45%, transparent); }

  /* RecordAsk, compact */
  .ask { margin-top: 12px; }
  .ask-h { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 600; }
  .ask-h svg { color: var(--text3); margin-top: 2px; }
  .ask-h .qt { flex: 1; }
  .ask-h .tix { color: var(--accentInk); font-weight: 700; white-space: nowrap; }
  .ask-r { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .ask-r .hint { flex: 1; font-size: 12px; line-height: 16px; color: var(--text3); }
  .ask-r .pills { display: flex; margin-right: -8px; }
  .res { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .paid { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 16px; font-weight: 600; color: var(--text3); }

  /* InlineAction: text only, 32 high, loader in the label's place */
  .ia { position: relative; min-height: 32px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--accentInk); border-radius: 16px; white-space: normal; text-align: center; line-height: 17px; max-width: 100%; }
  .ia.off { color: var(--text4); }
  .ia.spin .t { visibility: hidden; }
  .ring { width: 18px; height: 18px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 22%, transparent); border-top-color: currentColor; animation: spin .8s linear infinite; display: inline-block; flex: none; }
  .ia.spin .ring { position: absolute; left: 50%; top: 50%; margin: -9px 0 0 -9px; color: var(--accentInk); }
  .ibusy .ring { width: 22px; height: 22px; color: var(--accentInk); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Primary / Secondary, 52 pills */
  .pbtn { height: 52px; border-radius: 26px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; }
  .pbtn .ring { width: 16px; height: 16px; color: var(--onPrimary); }
  .sbtn { height: 52px; border-radius: 26px; background: var(--glass2); color: var(--text); display: grid; place-items: center; font-size: 14.5px; font-weight: 700; }

  /* testers group address (SeatAddressRow) */
  .addr { display: flex; align-items: center; gap: 4px; min-height: 40px; margin-top: 12px; }
  .addr .col { flex: 1; min-width: 0; }
  .addr .a { font-size: 15px; line-height: 18px; font-weight: 600; color: var(--accentInk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .addr .l { margin-top: 2px; font-size: 12.5px; line-height: 14px; font-weight: 500; color: var(--text3); }
  .addr .cp { width: 40px; height: 40px; display: grid; place-items: center; color: var(--accentInk); margin-right: -10px; }
  .vh { font-size: 18px; line-height: 23px; font-weight: 600; }
  .vl { margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--text2); }
  .how { margin: 4px 0 0 -8px; }

  /* TileGroup / TileRow (Manage) */
  .tg { display: flex; flex-direction: column; gap: 3px; }
  .tr { min-height: 60px; display: flex; align-items: center; padding: 8px 12px 8px 14px; background: var(--glass); border: 1px solid var(--glassBorder); border-radius: 6px; }
  .tr:first-child { border-top-left-radius: 22px; border-top-right-radius: 22px; }
  .tr:last-child { border-bottom-left-radius: 22px; border-bottom-right-radius: 22px; }
  .itile { width: 36px; height: 36px; border-radius: 11px; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; flex: none; }
  .itile.bad { background: var(--badBg); color: var(--bad); }
  .tr .col { flex: 1; min-width: 0; margin-left: 14px; }
  .tr .t { font-size: 16px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr .t.bad { color: var(--bad); }
  .tr .s { font-size: 12.5px; line-height: 16px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr .chev { color: var(--text4); margin-left: 6px; }
  .tr .ring { color: var(--accentInk); margin-left: 6px; }
  .why { margin: 10px 4px 0; }

  /* PageMessage */
  .pmsg { margin: 0 16px 6px; display: flex; align-items: center; gap: 10px; padding: 11px 10px 11px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glassBorder); font-size: 14px; line-height: 19px; }
  .pmsg span { flex: 1; }
  .pmsg svg { color: var(--text3); } .pmsg svg:first-child { color: var(--accentInk); }

  /* skeleton */
  .sk { display: block; background: color-mix(in srgb, var(--accentInk) 7%, var(--glass2)); border-radius: 6px; position: relative; overflow: hidden; flex: none; }
  .sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, color-mix(in srgb, var(--glass) 80%, transparent) 50%, transparent 70%); background-size: 300% 100%; animation: sweep 1.6s linear infinite; }
  @keyframes sweep { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* robot state */
  .rs { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 32px 80px; }
  .rs .t { margin-top: 14px; font-size: 20px; line-height: 25px; font-weight: 700; }
  .rs .l { margin-top: 6px; font-size: 14px; line-height: 20px; color: var(--text2); max-width: 300px; }
  .rs .sbtn { margin-top: 22px; padding: 0 28px; }

  /* sheet + dialog over the page */
  .scrimL { position: absolute; inset: 0; background: var(--scrim); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet); border-radius: 22px 22px 0 0; padding: 14px 16px 24px; }
  .sheet .hdl { width: 38px; height: 4px; border-radius: 2px; background: var(--glassBorderStrong); margin: 0 auto; }
  .sheet .st { margin: 14px 0 14px; font-size: 17px; font-weight: 700; }
  .step { display: flex; gap: 10px; margin-top: 8px; font-size: 13px; line-height: 18px; color: var(--text2); }
  .step .n { width: 22px; height: 22px; border-radius: 7px; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .step b { font-weight: 600; color: var(--text); }
  .dlg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 320px; background: var(--sheet); border-radius: 28px; padding: 24px; }
  .dlg .t { font-size: 20px; line-height: 26px; font-weight: 700; }
  .dlg .b { margin-top: 14px; font-size: 14px; line-height: 20px; color: var(--text2); }
  .dlg .bt { display: flex; justify-content: flex-end; gap: 4px; margin: 20px -8px -8px 0; }
  .dlg .bt .ia.bad { color: var(--bad); }

  /* old page (rebuilt from AppPage.kt) */
  .oh { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .oico { position: relative; width: 96px; height: 96px; }
  .oico .pen { width: 30px; height: 30px; right: 0; bottom: 0; }
  .on { margin-top: 12px; font-size: 22px; line-height: 26px; font-weight: 700; }
  .op { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--text3); }
  .ochips { display: flex; gap: 6px; margin-top: 12px; }
  .achip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 600; }
  .achip.n { background: var(--glass2); color: var(--text3); } .achip.ok { background: var(--okBg); color: var(--ok); }
  .ost { font-size: 16px; font-weight: 700; padding: 16px 0 10px; }
</style>
</head>
<body>
<div class="top"><h1>My apps: app page</h1><button data-t="light" class="on">Light</button><button data-t="dark">Dark</button></div>
<div class="doc" id="doc"></div>
<script>
/* ---------- icons: Lucide, as the app uses; back is Material arrow_back_ios_new ---------- */
const L = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  minus: '<path d="M5 12h14"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  flask: '<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/>',

function art(a, s) {

  const g = Math.round(s * 0.62);
  const sv = (body) => `<svg width="${g}" height="${g}" viewBox="0 0 24 24">${body}</svg>`;
  switch (a.art) {
    case 'bluefy': return `<span class="ai" style="${base}background:linear-gradient(160deg,#EEF6FB,#D3E7F3)">${sv('<ellipse cx="12" cy="13.5" rx="7" ry="9" style="fill:#45C3E2"/><rect x="11.2" y="3.5" width="1.6" height="7" rx=".8" style="fill:#1E2B36"/>')}</span>`;

    case 'editme': return `<span class="ai" style="${base}background:linear-gradient(135deg,#8A2BE2,#E8459A);color:#fff;font-size:${s * 0.55}px">E</span>`;

/* ---------- shared bits ---------- */
const chip = (t, tone, icon) => `<span class="chip ${tone}">${icon ? ic(icon, 13, 2.4) : ''}${t}</span>`;

const iline = (icon, text, cls = '') => `<div class="il ${cls}">${inl(icon, 14)}${text}</div>`;
const INFO_TXT = "It's also verified when two crew members install it, or you accept a review.";
const ii = (open) => `<span class="ii${open ? ' on' : ''}">${ic('info', 14)}${open ? `<span class="callout">${INFO_TXT}</span>` : ''}</span>`;

function phone(theme, body, o = {}) {

    <div class="pbar"><span class="back">${BACK}</span></div>${o.msg ? `<div class="pmsg">${ic('info', 17)}<span>${o.msg}</span>${ic('x', 16)}</div>` : ''}

}

/* ---------- the app header ---------- */
function appHead(app, o = {}) {

  return `<div class="hd"><span class="hico">${art(app, 64)}${o.iconBusy ? '<span class="ibusy"><i class="ring"></i></span>' : ''}<span class="pen">${ic('pencil', 12)}</span></span>

}

/* ---------- the verify card (only while not verified) ---------- */
function verifyCard(kind, st = {}) {

  return `<div class="card p16" style="margin-top:16px">
    <div class="vh">Add our testers group</div>
    <div class="vl">Add this address to your closed track's testers, then tap Verify now.${ii(st.info)}</div>
    <div class="addr"><div class="col"><div class="a">testtrack-testers@googlegroups.com</div><div class="l">Testers group address</div></div><span class="cp">${ic(st.copied ? 'check' : 'copy', 18)}</span></div>
    <div class="how">${ia('How to add it')}</div>${sp(10)}

}

/* ---------- manage ---------- */
function manage(m = {}) {
  const rows = [];
  if (!m.live) {
    rows.push(`<div class="tr"><span class="itile">${ic('arrowUR', 19)}</span><div class="col"><div class="t">It's live on Google Play now</div>
      <div class="s">${m.busy === 'live' ? 'Checking its public Play page' : 'Moves it to feedback only'}</div></div>${m.busy === 'live' ? '<i class="ring"></i>' : `<span class="chev">${ic('chevR', 18)}</span>`}</div>`);
  }
  if (m.del) {
    rows.push(`<div class="tr"><span class="itile bad">${ic('trash', 19)}</span><div class="col"><div class="t bad">Delete app</div>${m.busy === 'del' ? '<div class="s">Deleting</div>' : ''}</div>${m.busy === 'del' ? '<i class="ring"></i>' : ''}</div>`);
  }
  const why = m.why ? `<div class="why">${iline('info', `Can't be deleted. ${m.why}`, 'sm')}</div>` : '';
  if (!rows.length && !why) return '';
  return head('Manage') + (rows.length ? `<div class="tg">${rows.join('')}</div>` : '') + why;
}
const WHY_CREW = 'It has been tested in a crew, so its record stays.';
const WHY_FB = 'It has a feedback request open. Close it first.';

/* ---------- a whole page ---------- */
function page(theme, o) {
  let b = appHead(o.app, o.head);
  if (o.verify) b += verifyCard(o.verify, o.vst);
  if (o.crew) b += head('Crew test', o.crewTrail) + o.crew;
  b += head('Feedback') + o.fb;
  b += manage(o.manage);
  return phone(theme, b, { msg: o.msg, over: o.over, fix: o.fix });
}

  const d = kind === 'live'
    ? `<div class="t">Mark Bluefy live?</div><div class="b">We'll check its public Play page. Once it's live it takes feedback, but it can never go into a crew again.</div><div class="bt">${ia('Cancel')}${ia('Mark it live')}</div>`
    : `<div class="t">Delete Pocket Budget?</div><div class="b">It comes off My apps. Nothing has happened to it yet, so there is nothing to keep.</div><div class="bt">${ia('Cancel')}${ia('Delete', 'bad')}</div>`;
  const base = kind === 'live' ? S.none : S.added;
  return page(theme, { ...base, over: `<div class="scrimL"></div><div class="dlg">${d}</div>`, fix: true });
}

/* ---------- old page, rebuilt from AppPage.kt ---------- */
function oldPage(theme) {
  const row = (icon, t, s, first, last) => `<div class="tr" style="${first ? '' : ''}"><span class="itile">${ic(icon, 19)}</span><div class="col"><div class="t">${t}</div><div class="s">${s}</div></div><span class="chev">${ic('chevR', 18)}</span></div>`;
  const body = `${sp(8)}<div class="oh"><span class="oico">${art(BLUEFY, 88)}<span class="pen">${ic('pencil', 15)}</span></span>
      <div class="on">${BLUEFY.n}</div><div class="op">${BLUEFY.p}</div>
      <div class="ochips"><span class="achip n">${ic('flask', 14)}Closed test</span><span class="achip ok">${ic('badgeCheck', 14)}Verified on Play</span></div></div>${sp(20)}
    <div class="ost">Testing</div>
    <div class="tg">${row('users', 'Crew test', 'Day 6 of 14 in Crew 07')}${row('msq', 'Feedback', '3 of 5 reviews in')}</div>
    <div class="ost">Manage</div>
    <div class="tg">${row('arrowUR', "It's live on Google Play now", 'Moves it to feedback only')}</div>
    <div class="why" style="font-size:12px;line-height:16px;color:var(--text4)">Can't be deleted. ${WHY_CREW}</div>`;
  return phone(theme, body);
}

/* ---------- the states ---------- */
const S = {

  info: { app: NEWAPP, head: {}, verify: 'closed', vst: { info: true }, crew: noCrew(false), fb: fbTile('none', false), manage: { del: true } },
  liveWait: { app: LIVEAPP, head: { live: true }, verify: 'live', fb: fbTile('none', false), manage: { live: true, del: true } },
  none: { app: BLUEFY, head: { verified: 'play' }, crew: noCrew(true), fb: fbTile('none', false), manage: { del: true } },
  lobby: { app: BLUEFY, head: { verified: 'play' }, crew: lobbyTile(), fb: fbTile('none', false), manage: { why: 'It is waiting in a crew. Take it out first.' } },

  prodYes: { app: BLUEFY, head: { verified: 'crew' }, crewTrail: '1 done', crew: recordTile({ name: 'Crew 04', dates: 'Oct 6 to 19', hl: 'Finished with 13 testers', tone: 'ok', res: 'yes' }), fb: fbTile('done', false), manage: { why: WHY_CREW } },
  prodNo: { app: BLUEFY, head: { verified: 'crew' }, crewTrail: '1 done', crew: recordTile({ name: 'Crew 01', dates: 'Aug 18 to 31', hl: 'Finished with 10 testers', tone: 'warn', res: 'no', again: true }), fb: fbTile('none', false), manage: { why: WHY_CREW } },
  out: { app: BLUEFY, head: { verified: 'play' }, crew: recordTile({ name: 'Crew 03', dates: 'Sep 22 to Oct 5', hl: 'Taken out on day 4', tone: 'bad', again: true }), fb: fbTile('none', false), manage: { why: WHY_CREW } },
  sentBack: { app: BLUEFY, head: { verified: 'play' }, crew: sentBackTile(), fb: fbTile('none', false), manage: { del: true } },

  unlisted: { app: LIVEAPP, head: { live: true, verified: 'play' }, fb: fbTile('unlisted'), manage: { why: WHY_FB } },
  liveNone: { app: LIVEAPP, head: { live: true, verified: 'play' }, fb: fbTile('none', true), manage: { live: true, del: true } },

  prodBusy: { app: BLUEFY, head: { verified: 'crew' }, crew: recordTile({ name: 'Crew 04', dates: 'Oct 6 to 19', hl: 'Finished with 13 testers', tone: 'ok', clear: 'Details clear in 2 days', ask: 'busy' }), fb: fbTile('none', false), manage: { why: WHY_CREW } },
};

const F = (label, html, tag) => `<div class="state"><div class="lbl">${label}${tag ? `<span class="tag${tag === 'Old' ? ' old' : ''}">${tag}</span>` : ''}</div>${html}</div>`;
function build(th) {
  const P = (k) => page(th, S[k]);
  return `<div class="row">
      ${F('Old', `<div class="zoom">${oldPage(th)}</div>`, 'Old')}
      ${F('New: running, night 6', P('main'), 'New')}
    </div>
    <div class="sec">Getting started</div>
    <div class="row">
      ${F('1. Just added, not verified, no icon', P('added'))}
      ${F('2. Verifying', P('verifying'))}
      ${F('3. (i) tapped', P('info'))}
      ${F('4. Live app, Play not answered yet', P('liveWait'))}
      ${F('5. Verified, no activity', P('none'))}
    </div>
    <div class="sec">Crew test</div>
    <div class="row">
      ${F('6. In a lobby', P('lobby'))}
      ${F('7. Finished, asks about production access', P('askProd'))}
      ${F('8. Answering', P('prodBusy'))}
      ${F('9. Finished, got production access', P('prodYes'))}
      ${F('10. Finished, no production access', P('prodNo'))}
      ${F('11. Taken out', P('out'))}
      ${F('12. Sent back', P('sentBack'))}
    </div>
    <div class="sec">Feedback (live apps)</div>
    <div class="row">
      ${F('13. Circle request open', P('circle'))}
      ${F('14. Off Circle', P('unlisted'))}
      ${F('15. Live app, no request yet', P('liveNone'))}
    </div>
    <div class="sec">Busy, loading, errors</div>
    <div class="row">
      ${F('16. Changing icon, marking live, page message', P('busy'))}
      ${F('17. Loading', loading(th))}
      ${F('18. Could not load', robotState(th, 'wifiOff', "Couldn't load your apps", 'Check your connection, then try again.', 'Try again'))}
      ${F('19. Not on My apps', robotState(th, 'notes', "This app isn't on My apps", 'It may have been deleted on another phone.', 'Back'))}
    </div>
    <div class="sec">Sheet and dialogs (kept as they are)</div>
    <div class="row">
      ${F('20. How to add it', howSheet(th))}
      ${F('21. Mark live', dialog(th, 'live'))}
      ${F('22. Delete', dialog(th, 'del'))}
    </div>`;
}
function show(th) {
  document.getElementById('doc').innerHTML = build(th);
  document.body.classList.toggle('dk', th === 'dark');
  document.querySelectorAll('.top button').forEach((b) => b.classList.toggle('on', b.dataset.t === th));
  history.replaceState(null, '', '#' + th);
}
document.querySelectorAll('.top button').forEach((b) => b.addEventListener('click', () => show(b.dataset.t)));
show(location.hash === '#dark' ? 'dark' : 'light');
if (document.fonts) document.fonts.ready.then(() => show(location.hash === '#dark' ? 'dark' : 'light'));
</script>
</body>
</html>
