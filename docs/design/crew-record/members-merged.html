<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TestTrack: Crew 05 testers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "BarlowApp"; font-weight: 400; src: url("../../../app/src/main/res/font/barlow_regular.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 500; src: url("../../../app/src/main/res/font/barlow_medium.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 600; src: url("../../../app/src/main/res/font/barlow_semibold.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 700; src: url("../../../app/src/main/res/font/barlow_bold.ttf"); }
  @font-face { font-family: "PlexApp"; font-weight: 500; src: url("../../../app/src/main/res/font/plexmono_medium.ttf"); }
  @font-face { font-family: "PlexApp"; font-weight: 600; src: url("../../../app/src/main/res/font/plexmono_semibold.ttf"); }
  @font-face { font-family: "PlexApp"; font-weight: 700; src: url("../../../app/src/main/res/font/plexmono_bold.ttf"); }

  /* OceanLight / OceanDark from ui/theme/Tokens.kt. Every colour inside a phone is one of these. */
  .light {
    --bg:#F7FCFF; --text:#142F43; --text2:#203A4E; --text3:#223D50; --text4:#59758A;
    --tabSelected:#2E4E66; --tabUnselected:#526B7D;
    --glass:#F2F9FD; --glass2:#DFEDF6; --glassBorder:#B7D1E2; --glassBorderStrong:#789AAF;
    --accent:#3A5B73; --onAccent:#FFFFFF; --accentInk:#22394B; --badgeFill:#3A5B73;
    --tile:#DCE6EE; --tileInk:#3A5B73; --dock:#E8F3FA; --dockInk:#304C60;
    --ok:#246B59; --okBg:rgba(36,107,89,.12); --warn:#8A611C; --warnBg:rgba(154,110,36,.12); --warnBorder:rgba(154,110,36,.24);
    --bad:#9E3B2E; --badBg:rgba(158,59,46,.12); --badBorder:rgba(158,59,46,.24);
    --track:#E4EEF4; --card:#F3F8FB; --cardLine:#E1ECF3; --sheet:#FFFFFF; --ring:rgba(20,47,67,.14);
    /* derived exactly as in TtTokens: primary/onPrimary, inkOn(ok) */
    --primary:var(--accent); --onPrimary:var(--onAccent); --inkOnOk:var(--onAccent); --scrim:rgba(20,34,48,.46);
  }
  .dark {
    --bg:#0F1011; --text:#ECEEF0; --text2:#BCC1C6; --text3:#9DA3A9; --text4:#757C82;
    --tabSelected:#B6CCDC; --tabUnselected:#989EA4;
    --glass:#1C1E20; --glass2:#292C2F; --glassBorder:#383C41; --glassBorderStrong:#666D74;
    --accent:#4A7290; --onAccent:#FFFFFF; --accentInk:#93B3CA; --badgeFill:#4A7290;
    --tile:#2A2D31; --tileInk:#A2BED2; --dock:#1C1E20; --dockInk:#BCC1C6;
    --ok:#83D8C4; --okBg:rgba(131,216,196,.12); --warn:#D8B774; --warnBg:rgba(216,183,116,.14); --warnBorder:rgba(216,183,116,.26);
    --bad:#E4938A; --badBg:rgba(228,147,138,.15); --badBorder:rgba(228,147,138,.3);
    --track:#2D3034; --card:#1C1E20; --cardLine:#2D3034; --sheet:#1C1E20; --ring:rgba(255,255,255,.16);
    --primary:var(--accentInk); --onPrimary:var(--bg); --inkOnOk:var(--bg); --scrim:rgba(0,0,0,.6);
  }
  .light, .dark { --band: color-mix(in srgb, var(--text) 5%, var(--bg)); } /* CrewRunAppStatus band: lerp(bg, text, 0.05) */

  * { box-sizing: border-box; }
  body { margin: 0; background: #D9E0E5; font-family: "BarlowApp", "Barlow", system-ui, sans-serif; color: #1B2B36; }
  .doc { padding: 28px 28px 80px; display: flex; flex-direction: column; gap: 46px; }
  h2 { margin: 0 0 16px 4px; font-size: 24px; font-weight: 700; }
  h3 { margin: 6px 0 12px 4px; font-size: 17px; font-weight: 700; color: #34505F; }
  .row { display: flex; flex-wrap: wrap; gap: 30px; align-items: flex-start; }
  .state { display: flex; flex-direction: column; gap: 8px; }
  .lbl { font-size: 15px; font-weight: 700; margin-left: 4px; display: flex; gap: 8px; align-items: center; }
  .rec { padding: 2px 9px; border-radius: 10px; background: #246B59; color: #fff; font-size: 11.5px; font-weight: 700; }
  .pair { display: flex; flex-direction: column; gap: 10px; }

  /* frames */
  .phone { width: 412px; background: var(--bg); color: var(--text); border-radius: 28px; overflow: hidden; border: 1px solid #B9C5CE; position: relative; display: flex; flex-direction: column; }
  .phone.fix { height: 780px; }
  .dark.phone { border-color: #2A2D31; }
  .mini { width: 412px; background: var(--bg); color: var(--text); border-radius: 20px; padding: 4px 16px 16px; border: 1px solid #B9C5CE; }
  .dark.mini { border-color: #2A2D31; }
  .cap { font-size: 13px; line-height: 16px; font-weight: 500; color: var(--text3); letter-spacing: .2px; margin: 14px 2px 8px; }
  .sbar { height: 24px; flex: none; }
  .pbar { height: 64px; flex: none; display: flex; align-items: center; padding: 0 16px 0 0; }
  .pbar .back { width: 48px; height: 48px; display: grid; place-items: center; color: var(--text); flex: none; margin-left: 4px; }
  .pbar .pt { flex: 1; font-size: 22px; line-height: 28px; font-weight: 700; }
  .memb { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--cardLine); border-radius: 20px; background: var(--bg); color: var(--accentInk); font-size: 14px; font-weight: 700; }
  .scroll { padding: 8px 16px 24px; flex: 1; }
  .tabs { margin: 8px 16px 0; height: 46px; border-radius: 23px; background: var(--card); border: 1px solid var(--cardLine); display: flex; padding: 4px; gap: 2px; flex: none; }
  .tabs span { flex: 1; display: grid; place-items: center; border-radius: 19px; font-size: 15px; font-weight: 500; color: var(--tabUnselected); }
  .tabs span.on { background: var(--tile); color: var(--tabSelected); font-weight: 600; }
  .dock { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: var(--dock); display: flex; align-items: center; justify-content: space-around; color: var(--dockInk); border-top: 1px solid var(--cardLine); }
  .dock .d { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; }
  .dock .d .pill { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
  .dock .d.on .pill { background: var(--tile); }
  .dock .plus { width: 56px; height: 40px; border-radius: 14px; background: var(--accent); color: var(--onAccent); display: grid; place-items: center; }

  /* type and helpers */
  svg.ic { display: block; flex: none; }
  .inl { display: inline-flex; vertical-align: -2px; margin-right: 5px; }
  b { font-weight: 600; color: var(--text); }
  .i-ok { color: var(--ok); } .i-warn { color: var(--warn); } .i-bad { color: var(--bad); }
  .i-quiet { color: var(--text2); } .i-acc { color: var(--accentInk); } .i-text { color: var(--text); } .i-faint { color: var(--text3); }
  .sp4 { height: 4px; } .sp8 { height: 8px; } .sp10 { height: 10px; } .sp12 { height: 12px; } .sp14 { height: 14px; } .sp16 { height: 16px; }

  /* CrewCard */
  .card { background: var(--bg); border: 1px solid var(--cardLine); border-radius: 14px; }
  .p16 { padding: 16px; } .p14 { padding: 14px; } .p1416 { padding: 14px 16px; } .p12 { padding: 12px; }
  .gap8 > * + * { margin-top: 8px; } .gap10 > * + * { margin-top: 10px; }

  /* StatusChip */
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: calc(12.5px * var(--fs, 1)); line-height: calc(16px * var(--fs, 1)); font-weight: 700; white-space: nowrap; flex: none; }
  .chip.ok { background: var(--okBg); color: var(--ok); } .chip.warn { background: var(--warnBg); color: var(--warn); }
  .chip.bad { background: var(--badBg); color: var(--bad); } .chip.quiet { background: var(--glass2); color: var(--text2); }
  .chip.acc { background: var(--tile); color: var(--accentInk); }

  /* CountBadge */
  .cb { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--badgeFill); color: var(--onAccent); font: 700 12px/22px "PlexApp", "IBM Plex Mono", monospace; text-align: center; display: inline-block; }

  /* Record tile = CrewListRow anatomy */
  .th { display: flex; align-items: center; gap: 8px; }
  .th .nm { flex: 1; font-size: calc(18px * var(--fs, 1)); line-height: calc(23px * var(--fs, 1)); font-weight: 600; }
  .th .dt { font-size: calc(12px * var(--fs, 1)); line-height: calc(17px * var(--fs, 1)); color: var(--text3); white-space: nowrap; }
  .strip { display: flex; justify-content: space-between; margin-top: 14px; }
  .stand { display: flex; align-items: flex-start; gap: 12px; }
  .stand .hl { flex: 1; font-size: calc(15px * var(--fs, 1)); line-height: calc(20px * var(--fs, 1)); font-weight: 500; }
  .stand .rt { font-size: 12px; line-height: 17px; color: var(--text3); text-align: right; }
  .pq { margin-top: 10px; background: var(--band); border-radius: 10px; padding: 8px 4px 4px 10px; }
  /* line 1: icon, question (may wrap), +10 tix at the end */
  .pq-q { display: flex; align-items: flex-start; gap: 6px; padding-right: 8px; font-size: calc(13px * var(--fs, 1)); line-height: calc(18px * var(--fs, 1)); font-weight: 600; color: var(--text); }
  .pq-q svg { color: var(--text3); margin-top: calc((18px * var(--fs, 1) - 14px) / 2); }
  .pq-q .qt { flex: 1; min-width: 0; }
  .pq-q .tix { flex: none; white-space: nowrap; color: var(--accentInk); font-weight: 700; }
  /* line 2: hint takes the rest and wraps; actions at the end, on the last line */
  .pq-r { display: flex; align-items: flex-end; gap: 4px; margin-top: 2px; }
  .pq-r .hint { flex: 1; min-width: 0; padding: 0 0 12px; font-size: calc(12px * var(--fs, 1)); line-height: calc(16px * var(--fs, 1)); color: var(--text3); overflow-wrap: anywhere; }
  .pq-acts { display: flex; flex: none; }
  .lg .pq-r { flex-direction: column; align-items: stretch; gap: 0; }
  .lg .pq-r .hint { padding-bottom: 2px; }
  .lg .pq-acts { align-self: flex-end; }
  .ia { min-height: 40px; min-width: 48px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; font-size: calc(14px * var(--fs, 1)); font-weight: 700; color: var(--accentInk); border-radius: 20px; white-space: nowrap; }
  .ia.off { color: var(--text4); pointer-events: none; }
  .ia.bad { color: var(--bad); }
  /* layout A: pills on line 1, hint full width on line 2 */
  .pq.A { padding: 8px 8px 8px 10px; }
  .pq-1 { display: flex; align-items: center; gap: 6px; font-size: calc(13px * var(--fs, 1)); line-height: calc(18px * var(--fs, 1)); font-weight: 600; color: var(--text); }
  .pq-1 svg { color: var(--text3); }
  .pq-1 .qt { flex: 1; min-width: 0; }
  .pq-h { margin-top: 4px; font-size: calc(12px * var(--fs, 1)); line-height: calc(16px * var(--fs, 1)); color: var(--text3); }
  .pq-h b { color: var(--accentInk); font-weight: 700; white-space: nowrap; }
  .pq-acts.top { gap: 6px; }
  .pq-acts.bot { display: none; }
  .lg .pq.A .pq-acts.top { display: none; }
  .lg .pq.A .pq-acts.bot { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  /* the title would wrap beside the pills: pills drop under the hint (here: 320 wide, question box) */
  .narrow .pq.A.q .pq-acts.top { display: none; }
  .narrow .pq.A.q .pq-acts.bot { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  .pqp { min-width: 52px; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--bg); border: 1px solid var(--glassBorder); color: var(--accentInk); display: inline-flex; align-items: center; justify-content: center; font-size: calc(13.5px * var(--fs, 1)); font-weight: 700; white-space: nowrap; }
  .pqp.off { color: var(--text4); pointer-events: none; }
  .pq-e { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: calc(12.5px * var(--fs, 1)); line-height: calc(16px * var(--fs, 1)); color: var(--bad); }
  .pq-e .ia { margin-left: auto; }
  /* sending: the tile skeleton's sweep over the whole box, nothing tappable */
  .shim { position: relative; overflow: hidden; }
  .shim::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(110deg, transparent 30%, color-mix(in srgb, var(--glass) 80%, transparent) 50%, transparent 70%); background-size: 300% 100%; animation: sweep 1.6s linear infinite; }
  /* tapped action: the tile skeleton's base and sweep on that one button */
  .tapped { position: relative; overflow: hidden; background: color-mix(in srgb, var(--accentInk) 7%, var(--glass2)) !important; color: var(--text3) !important; pointer-events: none; }
  .tapped::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, color-mix(in srgb, var(--glass) 80%, transparent) 50%, transparent 70%); background-size: 300% 100%; animation: sweep 1.6s linear infinite; }
  .ia.tapped { border-radius: 20px; }
  .ia.off, .o1-b.off, .seg-b.off { color: var(--text4); pointer-events: none; }
  .qerr { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: calc(12.5px * var(--fs, 1)); line-height: calc(16px * var(--fs, 1)); color: var(--bad); }
  .qerr .ia { margin-left: auto; min-height: 32px; }
  /* option 1: action bar inside an edged box (TintBox edge) */
  .o1 { margin-top: 10px; border: 1px solid var(--cardLine); border-radius: 12px; overflow: hidden; }
  .o1-top { padding: 10px 12px; }
  .o1-h, .o2-h { display: flex; align-items: flex-start; gap: 6px; font-size: calc(13px * var(--fs, 1)); line-height: calc(18px * var(--fs, 1)); font-weight: 600; color: var(--text); }
  .o1-h svg, .o2-h svg { color: var(--text3); margin-top: calc((18px * var(--fs, 1) - 14px) / 2); }
  .o1-h .qt { flex: 1; min-width: 0; }
  .o1-h .tix { flex: none; white-space: nowrap; color: var(--accentInk); font-weight: 700; }
  .o1-s { padding-left: 0 !important; }
  .o1-s, .o2-s { margin-top: 2px; padding-left: 20px; font-size: calc(12px * var(--fs, 1)); line-height: calc(16px * var(--fs, 1)); color: var(--text3); }
  .o2-s b, .o3-s b { color: var(--accentInk); font-weight: 700; white-space: nowrap; }
  .o1-bar { display: flex; border-top: 1px solid var(--cardLine); }
  .o1-b { flex: 1; min-height: 44px; padding: 6px 8px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: calc(14.5px * var(--fs, 1)); line-height: calc(18px * var(--fs, 1)); font-weight: 700; color: var(--accentInk); }
  .o1-b + .o1-b { border-left: 1px solid var(--cardLine); }
  /* option 1 sending: 18dp ring in the button's ink replaces the label; the label stays hidden so the size holds */
  .o1-b.spin { position: relative; pointer-events: none; }
  .o1-b.spin .lbl { visibility: hidden; }
  .o1-b.spin .ring { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; box-sizing: border-box; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accentInk) 22%, transparent); border-top-color: var(--accentInk); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 1a, 1b, 1c: borderless takes on the action bar */
  .x1 { margin-top: 10px; }
  .x1-h { display: flex; align-items: flex-start; gap: 6px; font-size: calc(13px * var(--fs, 1)); line-height: calc(18px * var(--fs, 1)); font-weight: 600; color: var(--text); }
  .x1-h svg { flex: none; color: var(--text3); margin-top: calc((18px * var(--fs, 1) - 14px) / 2); }
  .x1-h .qt { flex: 1; min-width: 0; }
  .x1-h .tix { flex: none; white-space: nowrap; color: var(--accentInk); font-weight: 700; }
  .x1-s { margin-top: 2px; font-size: calc(12px * var(--fs, 1)); line-height: calc(16px * var(--fs, 1)); color: var(--text3); }
  .x1-acts { display: flex; gap: 8px; margin-top: 10px; }
  .qb { flex: 1; min-height: 44px; padding: 6px 10px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-size: calc(14.5px * var(--fs, 1)); line-height: calc(18px * var(--fs, 1)); font-weight: 700; color: var(--accentInk); }
  .qb.off { color: var(--text4); pointer-events: none; }
  .qb.spin { position: relative; pointer-events: none; }
  .qb.spin .lbl { visibility: hidden; }
  .qb.spin .ring { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; box-sizing: border-box; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accentInk) 22%, transparent); border-top-color: var(--accentInk); animation: spin .8s linear infinite; }
  /* 1a tinted fill: glass2 box, tonal pills */
  .x1.a { background: var(--glass2); border-radius: 14px; padding: 12px; }
  .x1.a .qb { border-radius: 22px; background: color-mix(in srgb, var(--accent) 16%, var(--glass2)); }
  /* 1b open: hairline above only, tonal full-width buttons */
  .x1.b { margin-top: 12px; }
  .x1.b .qb { border-radius: 22px; background: var(--glass2); }
  /* 1c fill with bar: glass2 box, darker band, buttons are the box fill showing through */
  .x1.c { background: var(--glass2); border-radius: 14px; overflow: hidden; }
  .x1.c .x1-top { padding: 12px 12px 10px; }
  .x1.c .x1-acts { margin-top: 0; padding: 6px; background: color-mix(in srgb, var(--text) 7%, var(--glass2)); gap: 6px; }
  .x1.c .qb { border-radius: 9px; background: var(--glass2); }
  .x1 .qerr { margin-top: 6px; }
  /* 1b compact: 32dp tonal pills at the end of the hint, own end-aligned row at 320dp or above 1.3x; 48dp touch through invisible padding */
  .x1-row { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .x1-row .x1-s { margin-top: 0; }
  .x1-row .x1-s { flex: 1; min-width: 0; }
  .x1 .x1-acts.qp { flex: none; margin-top: 0; gap: 0; margin-right: -12px; }
  .x1 .x1-acts.qp.bot { display: none; }
  .lg .x1 .x1-acts.qp.top, .narrow .x1 .x1-acts.qp.top { display: none; }
  .lg .x1 .x1-acts.qp.bot, .narrow .x1 .x1-acts.qp.bot { display: flex; justify-content: flex-end; margin-top: 4px; }
  .x1.b .qb.p { flex: none; position: relative; min-height: 32px; padding: 6px 12px; border-radius: 16px; background: none; border: 0; font-size: calc(13.5px * var(--fs, 1)); line-height: calc(18px * var(--fs, 1)); white-space: nowrap; }
  .x1.b .qb.p::before { content: ""; position: absolute; inset: -8px -4px; }
  /* PageMessage (app has no snackbars): a line laid into the page under the top bar, glass + glassBorder, radius 14 */
  .pmsg { margin: 6px 16px 0; display: flex; align-items: center; gap: 10px; padding: 11px 10px 11px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glassBorder); font-size: 14px; line-height: 19px; color: var(--text); }
  .pmsg span { flex: 1; min-width: 0; }
  .pmsg svg { flex: none; color: var(--text3); }
  .pmsg svg:first-child { color: var(--accentInk); }
  .mini > .pmsg { margin: 0 0 12px; }
  .pills { display: flex; gap: 8px; margin: 0 !important; }
  /* finished crew page */
  .phone > .pmsg { margin: 0 16px 6px; }
  .fp-sub { margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--text3); }
  .fp-chiprow { margin-top: 12px; }
  .fp-res { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .fp-res .res { margin: 0; }
  .fp-clear { margin-top: 16px; border: 1px dashed var(--glassBorder); border-radius: 14px; padding: 14px 16px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 18px; color: var(--text3); }
  .fp-clear svg { flex: none; margin-top: 1px; color: var(--text4); }
  .fp-clear b { display: block; font-weight: 600; color: var(--text2); margin-bottom: 2px; }
  .nar .hero-h { font-size: 21px; line-height: 25px; }
  /* Your app, compact options */
  .ya { display: flex; align-items: center; gap: 12px; }
  .ya .col { flex: 1; min-width: 0; }
  .ya .nm { font-size: 15px; line-height: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ya .sb { margin-top: 2px; font-size: 13px; line-height: 17px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ya .chev { flex: none; color: var(--text4); display: grid; place-items: center; }
  .avs { display: flex; align-items: center; margin-top: 10px; gap: 8px; }
  .avs .stk { display: flex; flex: none; }
  .avs .a { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--tile); color: var(--tileInk); box-shadow: 0 0 0 2px var(--bg); }
  .avs .a + .a { margin-left: -7px; }
  .avs .a.more { background: var(--glass2); color: var(--text2); font-size: 10.5px; width: 30px; border-radius: 12px; }
  .avs .t { font-size: 13px; line-height: 17px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    : 'Each square is one tester on one night. The number under a night is how many it counted for. Google asks for 12.';
  const leg = finished
    ? `<span><i class="tg-c O"></i>Opened</span><span><i class="tg-c P"></i>Picture kept</span><span><i class="tg-c H"></i>Picked by hand</span><span><i class="tg-c M"></i>Missed</span><span><i class="tg-c N"></i>Not owed</span><span><i class="tg-c B"></i>Not joined yet</span><span><i class="tg-c C"></i>After they left</span>`
    : `<span><i class="tg-c P"></i>Picture in</span><span><i class="tg-c H"></i>Picked by hand</span><span><i class="tg-c W"></i>On its way</span><span><i class="tg-c L"></i>Waiting for hours</span><span><i class="tg-c T"></i>Tonight</span><span><i class="tg-c M"></i>Missed</span><span><i class="tg-c N"></i>Not owed</span><span><i class="tg-c B"></i>Not joined yet</span><span><i class="tg-c C"></i>To come</span>`;
  KEYDATA = { ex, leg };
  const now = finished ? 0 : upTo;
  const W = (i, inner, extra = '') => `<span class="go-w${i + 1 === now ? ' now' : ''}${extra}">${inner}</span>`;
  const all = (f) => Array.from({ length: 14 }, (_, i) => f(i)).join('');
  const lab = (inner) => `<span class="go-lab">${inner}</span>`;
  return `<div class="card go-card"><div class="go-top">${chipHtml}<span class="ibtn">${ic('info', 18)}</span></div>
    <div class="go-row go-days">${lab('')}<span class="go-cells">${all((i) => W(i, i + 1))}</span></div>
    ${rows.map(([nm, c, out]) => `<div class="go-row">${lab(avHtml(nm, 'go-av' + (out ? ' out' : '')))}<span class="go-cells">${all((i) => W(i, `<i class="tg-c ${c[i]}"></i>`))}</span></div>`).join('')}
    <div class="go-row go-cnt">${lab('')}<span class="go-cells">${all((i) => W(i, n[i] == null ? '' : n[i], short.includes(i + 1) ? ' short' : ''))}</span></div>
    <div class="go-hint">${ic('info', 12)}Tap a face to see who it is</div></div>`;
}
/* ring tile: the old member row's words, the ring of nights, the last 3 pictures */
const RCOL = { P: 'var(--ok)', H: 'var(--ok)', O: 'var(--ok)', M: 'var(--bad)', L: 'var(--bad)', N: 'var(--glassBorderStrong)', W: 'var(--accent)', T: 'var(--track)', C: 'var(--track)', B: 'transparent' };
function ringOf(c) {
  const seg = 360 / 14, gap = 3;
  return 'conic-gradient(' + c.split('').map((x, i) => `${RCOL[x]} ${i * seg}deg ${(i + 1) * seg - gap}deg, transparent ${(i + 1) * seg - gap}deg ${(i + 1) * seg}deg`).join(', ') + ')';
}
const dd = (n) => `${n} day${n === 1 ? '' : 's'}`;
function lineOf([, c, out, x], upTo, finished) {
  const days = c.split('').filter((s) => 'PHO'.includes(s)).length;
  const day = x.day || upTo;
  if (out) {
    const firstC = c.indexOf('C') + 1, firstM = c.indexOf('M') + 1;
    return firstM && firstM < firstC ? [`Taken out on day ${firstC}`, 'bad'] : ['Left the run', 'faint'];
  }
  if (finished) {
    const owed = c.split('').filter((s) => !'NB'.includes(s)).length;
    return days >= owed ? [`All ${owed} days`, 'ok'] : [`${days} of ${owed} days`, 'warn'];
  }
  const tonight = c[day - 1];
  const missedY = day > 1 && c[day - 2] === 'M';
  if (x.excused) return ['Reported it', 'faint'];
  if (missedY && !'PH'.includes(tonight)) return ['Missed yesterday', 'warn'];
  if (tonight === 'H') return [`By hand${x.at ? ', ' + x.at : ''}`, 'ok'];
  if (tonight === 'P') return [`Opened${x.at ? ' at ' + x.at : ' tonight'}`, 'ok'];
  if (tonight === 'W') return ['Picture on its way', 'acc'];
  if (tonight === 'L' || c[day - 2] === 'L') return ['Picture waiting', 'bad'];
  return ['Not tonight yet', 'faint'];
}
function memberTile(r, upTo, finished) {
  const [nm, c, , x] = r;
  let [txt, tone] = lineOf(r, upTo, finished);
  const days = c.split('').filter((s) => 'PHO'.includes(s)).length;
  const day = x.day || upTo;
  const from = Math.max(0, day - 3);
  const pics = c.slice(from, day).split('').filter((s) => 'PH'.includes(s));
  const other = !finished && x.day && x.day !== upTo;
  if (other) txt += `, ${dd(days)}`;
  const right = finished ? '' : `<span class="tday">${other ? `Their day ${x.day}` : dd(days)}</span>`;
  return `<div class="card tr3c"><div class="tr"><span class="ringw"><span class="rg" style="background:${ringOf(c)}"></span>${avHtml(nm, "av")}</span><div class="col">
    <div class="l1"><span class="fs-nm">${FULL[nm]}</span>${right}</div><div class="tl2"><span class="i-${tone}">${txt}</span></div></div>
    ${pics.length ? `<span class="stack">${pics.map((s) => wtThumb(s === 'H' ? 'h' : 'p')).join('')}</span>` : ''}</div></div>`;
}
function merged(rows, upTo, finished) {
  const inN = rows.filter((r) => !r[2]).length, outN = rows.length - inN;
  const opened = rows.filter(([, c, out, x]) => !out && 'PH'.includes(c[(x.day || upTo) - 1])).length;
  LINES = finished
    ? `<div class="mm-sub">${ic('clock', 13)}Pictures of the last 3 nights are kept until Fri, Nov 20. Tap one to see it whole.</div>`
    : `<div class="mm-sub">${ic('users', 13)}${inN} still in${outN ? `, ${outN} left` : ''}. 12 need to keep opening it every day.</div>
       <div class="mm-sub">${ic('image', 13)}Pictures of the last 3 nights. Tap one to see it whole.</div>`;
  const top = finished ? `<div class="mm-sum">13 of 14 opened Bluefy every night</div>` : `<div class="mm-sum">${opened} of ${inN} opened Bluefy tonight</div>`;
  /* the old order: in before out, then opened tonight first */
  const sorted = finished ? rows : [...rows].sort((p, q) => (p[2] - q[2]) || ('PH'.includes(q[1][(q[3].day || upTo) - 1]) - 'PH'.includes(p[1][(p[3].day || upTo) - 1])));
  return top + sp(12) + bigGrid(rows, upTo, finished) + head('Testers', rows.length) + `<div class="gap8">${sorted.map((r) => memberTile(r, upTo, finished)).join('')}</div>`;
}
/* A: the PickerSheet the (i) opens */
function keySheet() {
  return `<div class="ks-wrap"><div class="ks"><span class="ks-handle"></span><div class="ks-t">What the squares mean</div>
    <div class="tg-ex" style="padding-top:2px">${KEYDATA.ex}</div><div class="ks-grid">${KEYDATA.leg}</div><div class="kx-lines">${LINES}</div></div></div>`;
}
const withSheet = (phone) => phone.replace(/<\/div>\s*$/, keySheet() + '</div>');
function mLoading() {
  const sq = Array.from({ length: 14 }, () => '<span class="go-w"><i class="tg-c" style="background:color-mix(in srgb, var(--accentInk) 7%, var(--glass2))"></i></span>').join('');
  return `${sk('70%', 18)}${sp(12)}
    <div class="card go-card"><div class="go-top">${sk('110px', 24, 12)}</div>${Array.from({ length: 8 }, () => `<div class="go-row"><span class="go-lab">${sk('24px', 24, 12)}</span><span class="go-cells">${sq}</span></div>`).join('')}</div>
    <div class="head">${sk('80px', 18)}</div>
    <div class="gap8">${[1, 2, 3].map(() => `<div class="card tr3c"><div class="tr">${sk('44px', 44, 22)}<div class="col">${sk('55%', 15)}${sp(6)}${sk('30%', 12)}</div></div></div>`).join('')}</div>`;
}
const TITLE = 'Crew 05 testers';
const W360 = 360;
const VIEWS = [
  ['run', 'Running, day 9', (th) => phonePage(th, TITLE, merged(RUN9, 9, false), { members: false, w: W360 })],
  ['night1', 'Night 1', (th) => phonePage(th, TITLE, merged(NIGHT1, 1, false), { members: false, w: W360 })],
  ['fin', 'Finished', (th) => phonePage(th, TITLE, merged(FIN2, 14, true), { members: false, w: W360 })],
  ['load', 'Loading', (th) => phonePage(th, TITLE, mLoading(), { fix: true, members: false, w: W360 })],
  ['err', 'Error', (th) => phonePage(th, TITLE, robot('off', "Testers didn't load", 'Check your connection, then try again.', 'Try again', true), { fix: true, members: false, w: W360 })],
  ['cleared', 'Details cleared', (th) => phonePage(th, TITLE, robot('cal', 'Details cleared on Nov 20', 'Testers and pictures are cleared 3 days after a crew ends. The result stays on the crew page.', 'Back to Crew 05', true), { fix: true, members: false, w: W360 })],
  ['key', '(i) sheet open', (th) => withSheet(phonePage(th, TITLE, merged(RUN9, 9, false), { members: false, w: W360, fix: true }))],
  ['who', 'Profile popup', (th) => withPop(phonePage(th, TITLE, merged(RUN9, 9, false), { members: false, w: W360, fix: true }), profile('Sofia'))],
];
document.getElementById('sw').innerHTML = '<b style="font-size:17px;color:#2D4A5F;padding:8px 10px 8px 0">Crew 05 testers</b>'
  + VIEWS.map(([k, name]) => `<button data-k="${k}">${name}</button>`).join('');
function show(k) {
  const v = VIEWS.find((x) => x[0] === k) || VIEWS[0];
  document.querySelectorAll('#sw button').forEach((b) => b.classList.toggle('on', b.dataset.k === v[0]));
  document.getElementById('doc').innerHTML = `<div class="cp-row" style="gap:60px">${v[2]('light')}${v[2]('dark')}</div>`;
  history.replaceState(null, '', '#' + v[0]);
}
document.querySelectorAll('#sw button').forEach((b) => b.addEventListener('click', () => { show(b.dataset.k); window.scrollTo(0, 0); }));
show(location.hash.replace('#', ''));
if (document.fonts) document.fonts.ready.then(() => show(location.hash.replace('#', '')));
</script>
