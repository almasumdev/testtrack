<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<div id="tt-run-top-five">
  <div class="viz-carousel viz-dotted-background" aria-label="Run tab top block designs">
    <section data-variant="Clean headline" aria-label="Clean headline" ><div class="rt-stage"><div class="rt-preview" data-design="headline"></div></div></section>
    <section data-variant="Split count" aria-label="Split count" hidden><div class="rt-stage"><div class="rt-preview" data-design="split"></div></div></section>
    <section data-variant="Round button" aria-label="Round button" hidden><div class="rt-stage"><div class="rt-preview" data-design="round"></div></div></section>
    <section data-variant="Night checklist" aria-label="Night checklist" hidden><div class="rt-stage"><div class="rt-preview" data-design="checklist"></div></div></section>
    <section data-variant="Compact tile" aria-label="Compact tile" hidden><div class="rt-stage"><div class="rt-preview" data-design="compact"></div></div></section>
  </div>
</div>
<style>
#tt-run-top-five{--rt-bg:light-dark(#f7fcff,#0f1011);--rt-text:light-dark(#142f43,#eceef0);--rt-body:light-dark(#344e61,#bdc3c9);--rt-muted:light-dark(#59758a,#9da3a9);--rt-line:light-dark(#b7d1e2,#383c41);--rt-tile:light-dark(#dce6ee,#2a2d31);--rt-accent:light-dark(#3a5b73,#93b3ca);--rt-on:light-dark(#fff,#101417);--rt-ok:light-dark(#376a58,#8ac6a7);--rt-warn:light-dark(#885e24,#e2ba7b);font-family:Barlow,system-ui,sans-serif;color:var(--rt-text)}
#tt-run-top-five *{box-sizing:border-box}#tt-run-top-five [hidden]{display:none!important}
#tt-run-top-five .rt-stage{display:flex;align-items:center;justify-content:center;min-height:430px;padding:20px 0}
#tt-run-top-five .rt-preview{position:relative;width:390px;max-width:100%;background:var(--rt-bg);padding:20px 16px;min-height:290px;border-radius:18px;overflow:hidden;font-size:14px;line-height:19px}
#tt-run-top-five button{font-family:inherit;touch-action:manipulation}
#tt-run-top-five p,#tt-run-top-five h2{margin:0}
#tt-run-top-five .rt-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;min-height:40px}
#tt-run-top-five .rt-label{font-size:14px;line-height:19px;font-weight:500;color:var(--rt-body)}
#tt-run-top-five .rt-guide-button{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 0;border:0;background:transparent;color:var(--rt-accent);font-size:13px;line-height:18px;font-weight:500}
#tt-run-top-five .rt-guide-button svg{width:16px;height:16px}
#tt-run-top-five .rt-title{font-size:28px;line-height:33px;font-weight:600;letter-spacing:-.3px}
#tt-run-top-five .rt-meta{font-size:13px;line-height:18px;color:var(--rt-muted)}
#tt-run-top-five .rt-caption{font-size:12px;line-height:17px;color:var(--rt-muted)}
#tt-run-top-five .rt-line{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
#tt-run-top-five .rt-primary{min-height:48px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;background:var(--rt-accent);color:var(--rt-on);padding:12px 18px;font-size:15px;line-height:20px;font-weight:600}
#tt-run-top-five .rt-primary svg{width:18px;height:18px;flex-shrink:0}
#tt-run-top-five .rt-primary:disabled{background:var(--rt-tile);color:var(--rt-muted)}
#tt-run-top-five .rt-attention{font-size:12px;line-height:17px;color:var(--rt-warn)}
#tt-run-top-five .rt-headline .rt-title{margin-bottom:6px}
#tt-run-top-five .rt-headline .rt-primary{margin:21px 0 10px}
#tt-run-top-five .rt-headline .rt-attention{margin-top:8px}
#tt-run-top-five .rt-split .rt-counters{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 0 18px}
#tt-run-top-five .rt-counters strong{display:block;font-size:39px;line-height:44px;font-weight:500;letter-spacing:-1px;font-variant-numeric:tabular-nums}
#tt-run-top-five .rt-counters .rt-caption{display:block;margin-top:3px;font-size:13px;line-height:18px}
#tt-run-top-five .rt-counters .rt-done strong{color:var(--rt-muted)}
#tt-run-top-five .rt-split .rt-primary{margin-top:17px}
#tt-run-top-five .rt-split .rt-attention{margin-top:9px}
#tt-run-top-five .rt-round .rt-head{margin-bottom:7px}
#tt-run-top-five .rt-round .rt-start{display:flex;align-items:center;gap:14px;margin-top:18px;text-align:left;min-height:90px;border-radius:16px;padding:18px;width:100%;border:1px solid var(--rt-line);background:var(--rt-bg);color:var(--rt-text)}
#tt-run-top-five .rt-start-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--rt-accent);color:var(--rt-on);flex-shrink:0}
#tt-run-top-five .rt-start-mark svg{width:21px;height:21px}
#tt-run-top-five .rt-start-copy{display:grid;gap:4px;min-width:0}
#tt-run-top-five .rt-start-copy strong{font-size:17px;line-height:22px;font-weight:600}
#tt-run-top-five .rt-round .rt-line{margin-top:12px}
#tt-run-top-five .rt-round .rt-attention{margin-top:8px}
#tt-run-top-five .rt-plan{padding:16px;border:1px solid var(--rt-line);border-radius:16px;background:var(--rt-bg)}
#tt-run-top-five .rt-checklist .rt-head{margin-bottom:4px}
#tt-run-top-five .rt-plan-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:8px 0;font-size:14px;line-height:19px;color:var(--rt-body)}
#tt-run-top-five .rt-plan-row strong{font-size:20px;line-height:25px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--rt-text)}
#tt-run-top-five .rt-plan-row.rt-ready strong{color:var(--rt-accent)}
#tt-run-top-five .rt-plan-row.rt-needs strong{color:var(--rt-warn)}
#tt-run-top-five .rt-checklist .rt-primary{margin-top:12px}
#tt-run-top-five .rt-checklist .rt-caption{margin-top:10px;text-align:center}
#tt-run-top-five .rt-compact .rt-head{margin-bottom:8px}
#tt-run-top-five .rt-compact-tile{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 12px 16px 16px;border:1px solid var(--rt-line);border-radius:16px;background:var(--rt-bg)}
#tt-run-top-five .rt-compact-copy{min-width:0;display:grid;gap:5px}
#tt-run-top-five .rt-compact-copy strong{font-size:20px;line-height:25px;font-weight:600}
#tt-run-top-five .rt-compact .rt-primary{width:auto;flex-shrink:0;padding:10px 16px;min-height:46px;font-size:14px}
#tt-run-top-five .rt-compact .rt-line{margin-top:12px}
#tt-run-top-five .rt-compact .rt-attention{margin-top:9px}
#tt-run-top-five .rt-help{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px 16px;background:var(--rt-bg);z-index:2}
#tt-run-top-five .rt-help h2{font-size:18px;line-height:23px;font-weight:600}
#tt-run-top-five .rt-help .rt-head{margin-bottom:4px}
#tt-run-top-five .rt-help-body{display:grid;gap:12px}
#tt-run-top-five .rt-help-body p{font-size:13px;line-height:18px;color:var(--rt-body)}
#tt-run-top-five .rt-help-body strong{color:var(--rt-text);font-weight:600}
@media(max-width:350px){#tt-run-top-five .rt-preview{padding:16px 12px}#tt-run-top-five .rt-compact-tile{gap:10px;padding:14px 10px}#tt-run-top-five .rt-compact-copy strong{font-size:18px;line-height:23px}#tt-run-top-five .rt-compact .rt-primary{padding:10px 12px}#tt-run-top-five .rt-help-body{gap:9px}}
</style>
<script>
(()=>{
const root=document.getElementById('tt-run-top-five');
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const values=new Map();
const guideButton=()=>`<button type="button" class="rt-guide-button cursor-interaction" data-guide>${icon('book-open')}Nightly guide</button>`;
const help=()=>`<section class="rt-help" hidden role="dialog" aria-modal="true" aria-label="Nightly guide"><div class="rt-head"><h2>Nightly guide</h2><button type="button" class="rt-guide-button cursor-interaction" data-close>Done</button></div><div class="rt-help-body"><p><strong>Install from Google Play.</strong> Use the account in the testers group. Usage access and Google Drive are required.</p><p><strong>20 seconds per app.</strong> At least 10 seconds in front and a screenshot must be received for the open to count.</p><p><strong>Finish by your midnight.</strong> Pending pictures retry and keep their original night. Crew details cover private feedback, missed nights, and refunds.</p></div></section>`;
function paint(preview){
 const design=preview.dataset.design,s=values.get(design)||{done:10,ready:16},left=28-s.done,label=s.ready?`Open all ${s.ready}`:'Install 2 apps first';values.set(design,s);
 const head=`<div class="rt-head"><span class="rt-label">Tonight</span>${guideButton()}</div>`;
 const button=`<button type="button" class="rt-primary cursor-interaction" data-open ${s.ready?'':'disabled'}>${icon('play')}${label}</button>`;
 const counts=`<div class="rt-line rt-caption"><span>${s.done} of 28 opened</span><span>2 crews</span></div>`;
 const attention='<p class="rt-attention">2 apps need installing from Play</p>';
 let body='';
 if(design==='headline')body=`${head}<h2 class="rt-title">${left} apps left tonight</h2><p class="rt-meta">${s.done} of 28 opened across 2 crews</p>${button}<p class="rt-caption">Finish before your midnight</p>${attention}`;
 if(design==='split')body=`${head}<div class="rt-counters"><div><strong>${left}</strong><span class="rt-caption">left tonight</span></div><div class="rt-done"><strong>${s.done}</strong><span class="rt-caption">already opened</span></div></div><div class="rt-line rt-caption"><span>2 crews</span><span>Before midnight</span></div>${button}${attention}`;
 if(design==='round')body=`${head}<h2 class="rt-title">${left} left tonight</h2><p class="rt-meta">${s.done} of 28 opened</p><button type="button" class="rt-start cursor-interaction" data-open ${s.ready?'':'disabled'}><span class="rt-start-mark">${icon('play')}</span><span class="rt-start-copy"><strong>${s.ready?`Start ${s.ready} ready apps`:'Install 2 apps first'}</strong><span class="rt-caption">20 seconds each, one after another</span></span></button><div class="rt-line rt-caption"><span>Across 2 crews</span><span>By your midnight</span></div>${attention}`;
 if(design==='checklist')body=`<div class="rt-plan">${head}<div class="rt-plan-row"><span>Already opened</span><strong>${s.done}</strong></div><div class="rt-plan-row rt-ready"><span>Ready to open</span><strong>${s.ready}</strong></div><div class="rt-plan-row rt-needs"><span>Need installing</span><strong>2</strong></div>${button}</div><p class="rt-caption">28 apps across 2 crews, before midnight</p>`;
 if(design==='compact')body=`${head}<div class="rt-compact-tile"><div class="rt-compact-copy"><strong>${left} left tonight</strong><span class="rt-caption">${s.done} of 28 opened</span></div><button type="button" class="rt-primary cursor-interaction" data-open ${s.ready?'':'disabled'}>${s.ready?`Open ${s.ready}`:'Install 2'}</button></div><div class="rt-line rt-caption"><span>2 crews</span><span>By your midnight</span></div>${attention}`;
 preview.className=`rt-preview rt-${design}`;preview.innerHTML=body+help();
 globalThis.lucide?.createIcons({attrs:{width:16,height:16}});
}
root.querySelectorAll('[data-design]').forEach(paint);
root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const preview=button.closest('[data-design]');if(!preview)return;if(button.hasAttribute('data-guide')){preview.querySelector('.rt-help').hidden=false;preview.querySelector('[data-close]').focus();}else if(button.hasAttribute('data-close')){preview.querySelector('.rt-help').hidden=true;preview.querySelector('[data-guide]').focus();}else if(button.hasAttribute('data-open')){const s=values.get(preview.dataset.design);s.done+=s.ready;s.ready=0;paint(preview);}});
root.addEventListener('keydown',event=>{if(event.key!=='Escape')return;const preview=event.target.closest('[data-design]');if(preview&&!preview.querySelector('.rt-help').hidden){preview.querySelector('.rt-help').hidden=true;preview.querySelector('[data-guide]').focus();}});
})();
</script>
