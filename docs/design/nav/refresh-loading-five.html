<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<div id="tt-refresh-options">
 <div class="viz-carousel viz-dotted-background" aria-label="Feedback loading without shimmer">
  <section data-variant="Keep current cards"><div class="rf-stage" data-mode="keep"></div></section>
  <section data-variant="Static placeholders" hidden><div class="rf-stage" data-mode="static"></div></section>
  <section data-variant="Soft pulse" hidden><div class="rf-stage" data-mode="pulse"></div></section>
  <section data-variant="Single loader" hidden><div class="rf-stage" data-mode="single"></div></section>
  <section data-variant="Top progress line" hidden><div class="rf-stage" data-mode="line"></div></section>
 </div>
</div>
<style>
#tt-refresh-options { --rf-bg:light-dark(#f7fcff,#0f1011); --rf-text:light-dark(#142f43,#eceef0); --rf-sub:light-dark(#59758a,#9da3a9); --rf-ink:light-dark(#3a5b73,#b6ccdc); --rf-soft:light-dark(#e1eaf2,#2a2d31); --rf-line:light-dark(#dce7ef,#34383d); --rf-accent:light-dark(#3a5b73,#4a7290); --rf-onaccent:#fff; --rf-shadow:light-dark(#142f4317,#00000055); font-family:Barlow,system-ui,sans-serif; }
#tt-refresh-options * { box-sizing:border-box; }
#tt-refresh-options .rf-stage { min-height:620px; padding:20px 0 26px; display:flex; align-items:center; flex-direction:column; justify-content:center; gap:14px; }
#tt-refresh-options .rf-phone { width:360px; max-width:100%; height:530px; position:relative; overflow:hidden; border-radius:28px; border:1px solid var(--rf-line); color:var(--rf-text); background:var(--rf-bg); box-shadow:0 10px 28px var(--rf-shadow); }
#tt-refresh-options .rf-phone button { font-family:inherit; }
#tt-refresh-options svg { display:block; width:21px; height:21px; flex-shrink:0; stroke-width:1.8; }
#tt-refresh-options .rf-status { display:flex; align-items:center; justify-content:space-between; padding:13px 20px 9px; font-size:12px; font-weight:600; }
#tt-refresh-options .rf-status span:last-child { display:flex; gap:5px; }
#tt-refresh-options .rf-status svg { width:13px; height:13px; }
#tt-refresh-options .rf-hud { display:flex; align-items:center; padding:7px 16px 14px; gap:8px; }
#tt-refresh-options .rf-bot { width:32px; height:32px; border-radius:10px; background:var(--rf-soft); color:var(--rf-ink); display:grid; place-items:center; }
#tt-refresh-options .rf-level { font-size:12px; font-weight:600; }
#tt-refresh-options .rf-xp { width:60px; height:3px; background:var(--rf-soft); border-radius:3px; margin-top:5px; }
#tt-refresh-options .rf-xp:before { content:''; display:block; width:62%; height:100%; background:var(--rf-ink); border-radius:3px; }
#tt-refresh-options .rf-balance { margin-left:auto; display:flex; gap:6px; align-items:center; background:var(--rf-soft); color:var(--rf-ink); border-radius:10px; padding:7px 10px; font-size:13px; font-weight:600; }
#tt-refresh-options .rf-balance svg { width:16px; height:16px; }
#tt-refresh-options .rf-tabs { display:flex; align-items:center; gap:14px; padding:0 16px; font-size:13px; color:var(--rf-sub); font-weight:500; }
#tt-refresh-options .rf-tabs span:first-child { padding:7px 13px; border-radius:18px; background:var(--rf-accent); color:var(--rf-onaccent); font-weight:600; }
#tt-refresh-options .rf-loading-strip { height:37px; position:relative; display:flex; justify-content:center; align-items:center; }
#tt-refresh-options .rf-spinner { width:25px; height:25px; border:2px solid var(--rf-soft); border-top-color:var(--rf-ink); border-right-color:var(--rf-ink); border-radius:50%; }
#tt-refresh-options .rf-loader-label { font-size:12px; color:var(--rf-sub); }
#tt-refresh-options .rf-progress { width:100%; height:3px; position:absolute; top:8px; left:0; background:var(--rf-soft); overflow:hidden; }
#tt-refresh-options .rf-progress span { display:block; height:100%; width:30%; background:var(--rf-ink); transform:translateX(100%); }
#tt-refresh-options .rf-list { padding:0 16px; display:flex; flex-direction:column; gap:8px; }
#tt-refresh-options .rf-ticket { position:relative; min-height:82px; display:flex; border:1px solid var(--rf-line); border-radius:14px; background:var(--rf-bg); }
#tt-refresh-options .rf-ticket:before,#tt-refresh-options .rf-ticket:after { content:''; position:absolute; z-index:1; right:51px; width:14px; height:14px; background:var(--rf-bg); border:1px solid var(--rf-line); border-radius:50%; }
#tt-refresh-options .rf-ticket:before { top:-8px; border-top-color:transparent; }
#tt-refresh-options .rf-ticket:after { bottom:-8px; border-bottom-color:transparent; }
#tt-refresh-options .rf-main { flex:1; min-width:0; padding:12px; display:flex; align-items:center; gap:10px; }
#tt-refresh-options .rf-appmark { width:42px; height:42px; border-radius:12px; background:var(--rf-soft); color:var(--rf-ink); display:grid; place-items:center; flex-shrink:0; font-size:17px; font-weight:600; }
#tt-refresh-options .rf-copy { min-width:0; flex:1; }
#tt-refresh-options .rf-name { font-size:15px; line-height:19px; font-weight:600; }
#tt-refresh-options .rf-ask { font-size:12px; line-height:16px; color:var(--rf-sub); margin-top:4px; }
#tt-refresh-options .rf-stub { width:58px; flex-shrink:0; padding:13px 5px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border-left:1px dashed var(--rf-line); background:var(--rf-soft); border-radius:0 13px 13px 0; color:var(--rf-ink); }
#tt-refresh-options .rf-stub svg { width:17px; height:17px; transform:rotate(-12deg); }
#tt-refresh-options .rf-amount { font-size:18px; line-height:20px; font-weight:600; }
#tt-refresh-options .rf-bar { height:12px; border-radius:4px; background:var(--rf-soft); }
#tt-refresh-options .rf-bar + .rf-bar { margin-top:9px; height:9px; }
#tt-refresh-options .rf-placeholder .rf-appmark { background:var(--rf-soft); }
#tt-refresh-options .rf-placeholder .rf-stub svg { opacity:.5; }
#tt-refresh-options .rf-placeholder .rf-amount { width:22px; height:12px; border-radius:4px; background:var(--rf-ink); opacity:.12; }
#tt-refresh-options .rf-single { min-height:254px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:13px; color:var(--rf-ink); }
#tt-refresh-options .rf-single > svg { width:30px; height:30px; }
#tt-refresh-options .rf-single span { font-size:14px; color:var(--rf-sub); }
#tt-refresh-options .rf-footer { position:absolute; left:0; right:0; bottom:18px; display:flex; align-items:center; height:72px; padding:0 5px; border-top:1px solid var(--rf-line); background:var(--rf-bg); }
#tt-refresh-options .rf-tab { flex:1; min-width:0; height:64px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; font-size:11px; color:var(--rf-sub); }
#tt-refresh-options .rf-tab-icon { width:48px; height:30px; display:grid; place-items:center; border-radius:8px; }
#tt-refresh-options .rf-tab:first-child { color:var(--rf-ink); font-weight:600; }
#tt-refresh-options .rf-tab:first-child .rf-tab-icon { background:var(--rf-soft); }
#tt-refresh-options .rf-plus { flex:1; display:grid; place-items:center; }
#tt-refresh-options .rf-plus span { width:48px; height:36px; border-radius:11px; background:var(--rf-accent); color:var(--rf-onaccent); display:grid; place-items:center; }
#tt-refresh-options .rf-home { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:90px; height:4px; border-radius:3px; background:var(--rf-sub); opacity:.4; }
#tt-refresh-options .rf-sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
@media(max-width:350px) { #tt-refresh-options .rf-main { padding:10px; gap:8px; } #tt-refresh-options .rf-appmark { width:36px; height:36px; } #tt-refresh-options .rf-name { font-size:14px; } }
</style>
<script>
(() => {
 const root=document.getElementById('tt-refresh-options');
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const apps=[['S','Step Count Pro','Try the new goal screen',8],['N','Notely','Is sign in clear?',6],['W','Weatherly','First run and the widget',10]];
 const saved=window.openai?.widgetState?.privateContent||{};
 const state={appearance:saved.appearance||'light dark'};
 const timers=new Map();
 const nav=(name,i)=>`<div class="rf-tab"><span class="rf-tab-icon">${icon(i)}</span>${name}</div>`;
 const ticket=(row,placeholder)=>`<div class="rf-ticket${placeholder?' rf-placeholder':''}"><div class="rf-main"><div class="rf-appmark">${placeholder?'':row[0]}</div><div class="rf-copy">${placeholder?'<div class="rf-bar" style="width:82%"></div><div class="rf-bar" style="width:56%"></div>':`<div class="rf-name">${row[1]}</div><div class="rf-ask">${row[2]}</div>`}</div></div><div class="rf-stub">${icon('ticket')}<div class="rf-amount">${placeholder?'':row[3]}</div></div></div>`;
 root.querySelectorAll('.rf-stage').forEach(stage=>{
  stage.innerHTML=`<div class="rf-phone"><div class="rf-status"><span>9:41</span><span>${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div><div class="rf-hud"><span class="rf-bot">${icon('bot')}</span><div><div class="rf-level">Level 3</div><div class="rf-xp"></div></div><div class="rf-balance">${icon('ticket')}100</div></div><div class="rf-tabs"><span>Feedback</span><span>My reviews</span><span>To check</span></div><div class="rf-loading-strip"></div><div class="rf-body"></div><div class="rf-footer">${nav('Circle','message-square')}${nav('Crew','users')}<div class="rf-plus"><span>${icon('plus')}</span></div>${nav('My apps','layout-grid')}${nav('You','user-round')}</div><div class="rf-home"></div><div class="rf-sr" role="status"></div></div><button type="button" class="btn" data-replay>Replay refresh</button>`;
  renderStage(stage,true);
 });
 function icons(){if(globalThis.lucide)lucide.createIcons();}
 function renderStage(stage,busy){
  stage.querySelector('.rf-phone').setAttribute('aria-busy',String(busy));
  const mode=stage.dataset.mode;
  const strip=stage.querySelector('.rf-loading-strip');
  strip.innerHTML=!busy?'':mode==='keep'?'<div class="rf-spinner" aria-hidden="true"></div>':mode==='line'?'<div class="rf-progress"><span></span></div>':mode==='single'?'':'<span class="rf-loader-label">Refreshing feedback…</span>';
  stage.querySelector('.rf-body').innerHTML=busy&&mode==='single'?`<div class="rf-single">${icon('refresh-cw')}<span>Refreshing feedback…</span></div>`:`<div class="rf-list">${apps.map(a=>ticket(a,busy&&(mode==='static'||mode==='pulse'))).join('')}</div>`;
  icons();
 }
 function appearance(){root.style.colorScheme=state.appearance;}
 root.addEventListener('click',event=>{
  if(!event.target.closest('[data-replay]'))return;
  const stage=event.target.closest('.rf-stage');const mode=stage.dataset.mode;
  clearTimeout(timers.get(mode));renderStage(stage,true);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
   const spin=stage.querySelector('.rf-spinner,.rf-single > svg');
   if(spin)spin.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:900,iterations:3});
   if(mode==='pulse')stage.querySelectorAll('.rf-appmark,.rf-bar,.rf-placeholder .rf-amount').forEach(el=>el.animate([{opacity:1},{opacity:.42},{opacity:1}],{duration:1100,iterations:2.5}));
   const line=stage.querySelector('.rf-progress span');
   if(line)line.animate([{transform:'translateX(-100%)'},{transform:'translateX(440%)'}],{duration:1100,iterations:2.5});
  }
  stage.querySelector('.rf-sr').textContent='Refreshing feedback';
  timers.set(mode,setTimeout(()=>{renderStage(stage,false);stage.querySelector('.rf-sr').textContent='Feedback updated';},2800));
 });
 window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.privateContent;if(s){state.appearance=s.appearance||'light dark';appearance();}});
 appearance();icons();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{appearance();window.openai?.setWidgetState?.({privateContent:state})?.catch(()=>{});}});tweak.addSelect(state,'appearance',{label:'Appearance',options:[{label:'Follow app',value:'light dark'},{label:'Light',value:'light'},{label:'Dark',value:'dark'}]});}
})();
</script>
