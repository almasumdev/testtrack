#tt-run-icon-tile *{box-sizing:border-box}
#tt-run-icon-tile .rit-card{width:390px;max-width:100%;padding:16px;border:1px solid var(--rit-line);border-radius:16px;background:var(--rit-bg)}
#tt-run-icon-tile header{display:flex;justify-content:space-between;align-items:center;gap:8px}

#tt-run-icon-tile .rit-apps{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:14px;padding-bottom:3px}
#tt-run-icon-tile .rit-app{position:relative;min-width:0;aspect-ratio:1}
#tt-run-icon-tile .rit-face{width:100%;height:100%;object-fit:contain;border-radius:5px;display:grid;place-items:center;background:var(--rit-tile);color:var(--rit-body);font-size:11px;font-weight:600}
#tt-run-icon-tile .rit-app.done .rit-face{opacity:.52}
#tt-run-icon-tile .rit-tick{position:absolute;right:-1px;bottom:-2px;width:10px;height:10px;display:grid;place-items:center;background:var(--rit-accent);color:var(--rit-on);border-radius:50%}
#tt-run-icon-tile .rit-tick svg{width:8px;height:8px;stroke-width:3}
#tt-run-icon-tile .rit-standing{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:9px}
#tt-run-icon-tile .rit-standing strong{font-size:15px;line-height:20px;font-weight:500}
#tt-run-icon-tile .rit-standing>span{font-size:12px;line-height:17px;color:var(--rit-muted);text-align:right}
#tt-run-icon-tile footer{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;line-height:18px;color:var(--rit-body)}
#tt-run-icon-tile footer img{width:28px;height:28px;object-fit:contain;border-radius:8px}
</style>
