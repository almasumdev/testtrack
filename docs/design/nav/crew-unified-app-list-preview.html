&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;

  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      privateContent: null,
      ...parsedState,

    });

  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };
    connectorGlobals.visualization = {
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;
      }

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });

  });

  syncTheme();
})();

#tt-crew-unified .cu-app-name{min-width:0;flex:1}
#tt-crew-unified .cu-app-name h3{font-size:16px;line-height:21px;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#tt-crew-unified .cu-app-name p{font-size:12px;line-height:17px;color:var(--cu-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
#tt-crew-unified .cu-report{align-self:flex-start;display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;flex:none;min-width:52px;min-height:44px;padding:0;background:transparent;color:var(--cu-muted);font-size:12px;line-height:17px;font-weight:500}
#tt-crew-unified .cu-report svg{width:13px;height:13px}
#tt-crew-unified .cu-report:disabled{background:transparent;color:var(--cu-muted)}
#tt-crew-unified .cu-owner-progress{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;line-height:18px;color:var(--cu-body)}
#tt-crew-unified .cu-owner-progress&gt;span{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
#tt-crew-unified .cu-owner-progress svg{width:15px;height:15px;flex:none;color:var(--cu-muted);margin-right:2px}
#tt-crew-unified strong{font-weight:600}
#tt-crew-unified .cu-manage{margin-top:6px}
#tt-crew-unified .cu-manage summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:36px;color:var(--cu-muted);font-size:12px;line-height:18px}
#tt-crew-unified .cu-manage summary::-webkit-details-marker{display:none}
#tt-crew-unified .cu-manage summary svg{height:15px;width:15px}
#tt-crew-unified .cu-manage-body{padding-top:4px;font-size:13px;line-height:19px;color:var(--cu-body)}
#tt-crew-unified .cu-manage-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
#tt-crew-unified .cu-app-list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
#tt-crew-unified .cu-app-card{min-width:0;transition:border-color 160ms ease}
#tt-crew-unified .cu-status-stack{display:grid;gap:3px;min-width:0}
#tt-crew-unified .cu-state-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;margin-top:10px}
#tt-crew-unified .cu-state{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px;line-height:18px;color:var(--cu-muted)}
#tt-crew-unified .cu-state svg{width:15px;height:15px;flex:none}
#tt-crew-unified .cu-state.cu-complete{color:var(--cu-green)}
#tt-crew-unified .cu-state.cu-warning{color:var(--cu-warn)}
#tt-crew-unified .cu-status-stack{display:grid;gap:3px;min-width:0}
#tt-crew-unified .cu-soft{font-size:13px;line-height:18px;font-weight:600;color:var(--cu-accent);background:var(--cu-soft);padding:8px 15px;border-radius:99px;min-height:36px;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
#tt-crew-unified .cu-soft svg{height:14px;width:14px}
#tt-crew-unified .cu-feedback{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px;margin-top:2px;font-size:12px;line-height:17px}
#tt-crew-unified .cu-feedback .cu-state{font-size:12px;line-height:17px;gap:7px}
#tt-crew-unified .cu-feedback .cu-state svg{width:14px;height:14px}
#tt-crew-unified .cu-feedback .cu-text{font-size:12px;line-height:17px;min-height:32px}
#tt-crew-unified .cu-announcement{font-size:12px;line-height:18px;color:var(--cu-muted);margin-top:12px}
#tt-crew-unified .cu-announcement:empty{display:none}
#tt-crew-unified .cu-dialog{box-sizing:border-box;color:var(--cu-ink);background:var(--cu-bg);border:1px solid var(--cu-line);border-radius:22px;padding:12px 20px 20px;max-width:min(370px,calc(100% - 24px));width:370px;font-family:inherit}
#tt-crew-unified .cu-dialog::backdrop{background:var(--cu-overlay)}
#tt-crew-unified .cu-sheet-handle{width:32px;height:4px;border-radius:9px;background:var(--cu-line);margin:0 auto 14px}
#tt-crew-unified .cu-dialog h2{font-size:20px;line-height:26px;font-weight:600}
#tt-crew-unified .cu-dialog p,#tt-crew-unified .cu-dialog li{font-size:14px;line-height:21px;color:var(--cu-body)}
#tt-crew-unified .cu-dialog p{margin-top:10px}
#tt-crew-unified .cu-dialog ul{padding-left:18px;margin:12px 0}
#tt-crew-unified .cu-dialog li+li{margin-top:10px}
#tt-crew-unified .cu-report-reasons{display:grid;gap:6px;margin:16px 0}
#tt-crew-unified .cu-report-reasons button{justify-content:flex-start;white-space:normal;text-align:left;min-height:44px;border-radius:10px;padding:10px 12px;font-weight:500}
#tt-crew-unified .cu-report-reasons button[aria-pressed=true]{outline:1px solid var(--cu-accent)}
#tt-crew-unified .cu-field-label{display:grid;gap:6px;font-size:13px;line-height:19px;font-weight:600;margin-top:12px}
#tt-crew-unified .cu-field-label textarea{width:100%;resize:vertical;min-height:88px;max-height:180px;padding:10px 12px;background:var(--cu-bg);color:var(--cu-ink);border:1px solid var(--cu-line);border-radius:10px;font:400 16px/22px Barlow,system-ui,sans-serif}
#tt-crew-unified .cu-field-label textarea::placeholder{color:var(--cu-muted)}
#tt-crew-unified .cu-dialog p.cu-report-note{font-size:12px;line-height:18px;color:var(--cu-muted)}
#tt-crew-unified .cu-people{display:grid;gap:10px;margin-top:14px}
#tt-crew-unified .cu-person{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:21px}
#tt-crew-unified .cu-person span:last-child{color:var(--cu-green);font-size:12px}
@media(max-width:350px){#tt-crew-unified .cu-content{padding-right:12px;padding-left:12px}#tt-crew-unified .cu-bar{gap:8px;padding-right:12px;padding-left:12px}#tt-crew-unified .cu-bar h1{font-size:20px}#tt-crew-unified .cu-app-card,#tt-crew-unified .cu-your-card{padding:12px}#tt-crew-unified .cu-app-heading{gap:10px}#tt-crew-unified .cu-owner-progress{align-items:flex-start}#tt-crew-unified .cu-owner-progress&gt;span{max-width:155px}}
@media(prefers-reduced-motion:reduce){#tt-crew-unified .cu-app-card{transition:none}}
&lt;/style&gt;

        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
