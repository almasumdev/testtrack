  );

    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;

      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }

      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }

  };

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

        name,

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      ...globalThis.openai,
      ...connectorGlobals,

      sendFollowUpMessage,
      setWidgetState,
      theme,

    };

      new CustomEvent(&quot;openai:set_globals&quot;, {

      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),

  };

    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||

      }

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,

            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

    }

#tt-feedback-ten .fr-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
#tt-feedback-ten small{color:var(--fr-muted);font-size:11px;line-height:15px;font-weight:400}
#tt-feedback-ten .fr-muted{color:var(--fr-muted)}
#tt-feedback-ten .fr-accent{color:var(--fr-accent)}
#tt-feedback-ten .fr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
#tt-feedback-ten .fr-tile&gt;.fr-row,#tt-feedback-ten .fr-whole,#tt-feedback-ten .fr-edge,#tt-feedback-ten .fr-two,#tt-feedback-ten .fr-details,#tt-feedback-ten .fr-under{margin-top:10px}
#tt-feedback-ten .fr-link{--icon-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:4px 0;color:var(--fr-accent);background:transparent;font-size:12px;line-height:17px;font-weight:600;flex:none}
#tt-feedback-ten .fr-single{min-height:36px;gap:6px}
#tt-feedback-ten .fr-whole{--icon-size:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;min-height:44px;padding:0;background:transparent;color:var(--fr-accent)}
#tt-feedback-ten .fr-whole .fr-label{color:var(--fr-ink)}
#tt-feedback-ten .fr-deadline{font-size:13px;line-height:18px;font-weight:500}
#tt-feedback-ten .fr-edge{display:flex;align-items:center;justify-content:space-between;gap:12px}
#tt-feedback-ten .fr-edge&gt;div:first-child{display:flex;flex-direction:column;align-items:start}
#tt-feedback-ten .fr-night{display:flex;flex-direction:column;align-items:end;gap:1px;flex:none}
#tt-feedback-ten .fr-night strong{font-size:15px;line-height:20px;font-weight:500}
#tt-feedback-ten .fr-soft{padding:9px 10px;background:var(--fr-soft);border-radius:10px}
#tt-feedback-ten .fr-action{display:flex;align-items:center;gap:6px;font-size:12px;line-height:17px;font-weight:600;flex:none}
#tt-feedback-ten .fr-two{display:flex;flex-direction:column;gap:4px}
#tt-feedback-ten .fr-two&gt;.fr-row{min-height:28px}
#tt-feedback-ten .fr-pill{--icon-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px;width:100%;padding:8px 12px;border-radius:24px;background:var(--fr-button);color:var(--fr-accent);font-size:12px;line-height:17px;font-weight:600}
#tt-feedback-ten summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;list-style:none}
#tt-feedback-ten summary::-webkit-details-marker{display:none}
#tt-feedback-ten .fr-expand{color:var(--fr-accent);font-size:23px;line-height:24px;width:24px;text-align:center}
#tt-feedback-ten details[open] .fr-expand{transform:rotate(45deg)}
#tt-feedback-ten .fr-reveal{display:flex;flex-direction:column;align-items:start;gap:2px;padding-top:8px}
#tt-feedback-ten .fr-under{align-items:start;gap:0}
#tt-feedback-ten .fr-under-link{text-decoration:underline;text-underline-offset:4px;min-height:28px}
#tt-feedback-ten .fr-dialog{font:inherit;color:var(--fr-ink);background:var(--fr-bg);border:1px solid var(--fr-line);border-radius:16px;padding:18px;width:320px;max-width:calc(100% - 32px)}
#tt-feedback-ten .fr-dialog h3{font-size:18px;line-height:24px;margin:0;font-weight:600}
#tt-feedback-ten .fr-dialog p{font-size:14px;line-height:20px;margin:10px 0 16px;color:var(--fr-muted)}
#tt-feedback-ten .fr-dialog::backdrop{background:light-dark(#142f4333,#00000055)}
@media(max-width:350px){#tt-feedback-ten .fr-tile{padding:12px}#tt-feedback-ten .fr-single .fr-label{font-size:11px;line-height:16px}}
@media(pointer:coarse){#tt-feedback-ten .fr-link,#tt-feedback-ten .fr-pill{min-height:44px}}
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
