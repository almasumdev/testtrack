<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review flow: now and new</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "BarlowApp"; font-weight: 400; src: url("../../../app/src/main/res/font/barlow_regular.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 500; src: url("../../../app/src/main/res/font/barlow_medium.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 600; src: url("../../../app/src/main/res/font/barlow_semibold.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 700; src: url("../../../app/src/main/res/font/barlow_bold.ttf"); }
  @font-face { font-family: "PlexApp"; font-weight: 700; src: url("../../../app/src/main/res/font/plexmono_bold.ttf"); }

  /* OceanLight / OceanDark, ui/theme/Tokens.kt */
  .light {
    --bg:#F7FCFF; --text:#142F43; --text2:#203A4E; --text3:#223D50; --text4:#59758A;
    --tabSelected:#2E4E66;
    --glass:#F2F9FD; --glass2:#DFEDF6; --glassBorder:#B7D1E2; --glassBorderStrong:#789AAF;
    --accent:#3A5B73; --onAccent:#FFFFFF; --accentInk:#22394B; --badgeFill:#3A5B73;
    --tile:#DCE6EE; --tileInk:#3A5B73; --leafAccent:#3A5B73; --leafAccentSoft:rgba(74,114,144,.16);
    --ok:#246B59; --okBg:rgba(36,107,89,.12); --warn:#8A611C; --warnBg:rgba(154,110,36,.12);
    --bad:#9E3B2E; --badBg:rgba(158,59,46,.12);
    --card:#F3F8FB; --cardLine:#E1ECF3; --sheet:#FFFFFF; --ring:rgba(20,47,67,.14); --track:#E4EEF4; --sk:#E3EDF4;
    --flaskLiquid:#9279D6; --flaskGlass:#4A3B86; --dock:#E8F3FA; --dockInk:#304C60;
    --primary:var(--accent); --onPrimary:var(--onAccent); --onTone:#FFFFFF; --scrim:rgba(20,34,48,.46);
  }
  .dark {
    --bg:#0F1011; --text:#ECEEF0; --text2:#BCC1C6; --text3:#9DA3A9; --text4:#757C82;
    --tabSelected:#B6CCDC;
    --glass:#1C1E20; --glass2:#292C2F; --glassBorder:#383C41; --glassBorderStrong:#666D74;
    --accent:#4A7290; --onAccent:#FFFFFF; --accentInk:#93B3CA; --badgeFill:#4A7290;
    --tile:#2A2D31; --tileInk:#A2BED2; --leafAccent:#93B3CA; --leafAccentSoft:#2A2D31;
    --ok:#83D8C4; --okBg:rgba(131,216,196,.12); --warn:#D8B774; --warnBg:rgba(216,183,116,.14);
    --bad:#E4938A; --badBg:rgba(228,147,138,.15);
    --card:#1C1E20; --cardLine:#2D3034; --sheet:#1C1E20; --ring:rgba(255,255,255,.16); --track:#2D3034; --sk:#212427;
    --flaskLiquid:#8C70D4; --flaskGlass:#CDBEF0; --dock:#1C1E20; --dockInk:#BCC1C6;
    --primary:var(--accentInk); --onPrimary:var(--bg); --onTone:#0F1011; --scrim:rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #D9E0E5; font-family: "BarlowApp", "Barlow", system-ui, sans-serif; color: #1B2B36; }
  body.dk { background: #2A3036; color: #E3E8EC; }
  .top { position: sticky; top: 0; z-index: 9; display: flex; align-items: center; gap: 10px; padding: 12px 28px; background: inherit; border-bottom: 1px solid #C3CDD4; }
  body.dk .top { border-color: #3A4249; }
  .top h1 { margin: 0 14px 0 0; font-size: 20px; font-weight: 700; }
  .top button, .top a { font: 600 15px/20px "BarlowApp", "Barlow", sans-serif; padding: 8px 18px; border-radius: 20px; border: 1px solid #B3C0C9; background: #F4F7F9; color: #2D4A5F; cursor: pointer; text-decoration: none; }
  .top button.on { background: #2D4A5F; color: #fff; border-color: #2D4A5F; }
  .top .sp { flex: 1; }
  .doc { padding: 6px 28px 80px; }
  .page { font-size: 26px; font-weight: 700; margin: 40px 0 4px 4px; }
  .from { margin: 0 0 6px 4px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .from b { font-weight: 700; }
  .from span { background: #F4F7F9; border: 1px solid #C3CDD4; border-radius: 14px; padding: 3px 12px; font-weight: 600; }
  body.dk .from span { background: #343B42; border-color: #4A535B; }
  .from span.mv { background: #2D4A5F; color: #fff; border-color: #2D4A5F; }
  .pair { margin-top: 30px; }
  .pl { font-size: 17px; font-weight: 700; margin: 0 0 10px 4px; display: flex; gap: 8px; align-items: center; }
  .pl .k { display: inline-grid; place-items: center; min-width: 30px; height: 26px; padding: 0 7px; border-radius: 8px; background: #2D4A5F; color: #fff; font-size: 13px; }
  body.dk .pl .k { background: #93B3CA; color: #0F1011; }
  .two { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .state { display: flex; flex-direction: column; gap: 6px; }
  .tag { font-size: 13px; font-weight: 700; margin-left: 4px; letter-spacing: .4px; display: flex; gap: 6px; align-items: center; }
  .tag i { font-style: normal; padding: 2px 9px; border-radius: 7px; background: #8A949C; color: #fff; }
  .tag i.new { background: #246B59; }
  .tag em { font-style: normal; font-weight: 600; color: #6A7680; }
  body.dk .tag em { color: #9AA3AA; }
  .cap { width: 412px; height: 892px; border-radius: 28px; border: 1px solid #3A4046; display: block; object-fit: cover; object-position: top; background: #0F1011; }
  .gap { width: 30px; }

  /* phone */
  .phone { width: 412px; height: 880px; background: var(--bg); color: var(--text); border-radius: 28px; overflow: hidden; border: 1px solid #B9C5CE; position: relative; display: flex; flex-direction: column; }
  .dark.phone { border-color: #3A4046; }
  .phone.tall { height: auto; }
  .tall .scroll { overflow: visible; flex: none; }
  .sbar { height: 24px; flex: none; }
  .pbar { height: 64px; flex: none; display: flex; align-items: center; }
  .pbar .back { width: 48px; height: 48px; display: grid; place-items: center; margin-left: 4px; color: var(--text); flex: none; }
  .pbar .ttl { margin-left: 4px; font-size: 22px; line-height: 28px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbar .pr { margin-right: 4px; min-width: 48px; height: 48px; display: grid; place-items: center; color: var(--text2); font-size: 14px; font-weight: 700; font-feature-settings: "tnum"; padding: 0 8px; }
  .scroll { flex: 1; overflow-y: auto; padding: 8px 16px 20px; scrollbar-width: none; position: relative; }
  .scroll::-webkit-scrollbar { display: none; }
  .foot { flex: none; padding: 10px 16px 6px; }
  .gest { height: 22px; flex: none; display: grid; place-items: center; }
  .gest i { width: 108px; height: 4px; border-radius: 2px; background: var(--text4); opacity: .55; }

  svg.ic { display: block; flex: none; }
  .inl { display: inline-block; vertical-align: -2px; margin-right: 6px; }
  .inl svg { display: inline-block; }
  .ai { display: grid; place-items: center; flex: none; overflow: hidden; box-shadow: inset 0 0 0 1px var(--ring); font-weight: 700; }
  .light .nt { background: hsl(var(--h) 45% 89%); color: hsl(var(--h) 50% 32%); box-shadow: none; }
  .dark .nt { background: hsl(var(--h) 30% 18%); color: hsl(var(--h) 55% 76%); box-shadow: none; }

  /* app header (ask-final .ah) with the reward at its end */
  .ah { display: flex; align-items: center; gap: 12px; }
  .aic { position: relative; width: 52px; height: 52px; flex: none; }
  .src { position: absolute; right: -5px; bottom: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--sheet); box-shadow: 0 0 0 2px var(--bg); display: grid; place-items: center; }
  .ah .col { flex: 1; min-width: 0; }
  .an { font-size: 16px; line-height: 19px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ad { margin-top: 2px; font-size: 12.5px; line-height: 15px; font-weight: 500; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .rw { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; }
  .rw .f { display: flex; align-items: center; gap: 5px; font-size: 18px; line-height: 20px; font-weight: 600; color: var(--tabSelected); font-feature-settings: "tnum"; }
  .rw .h { font-size: 11.5px; line-height: 14px; font-weight: 700; color: var(--warn); }
  .rw .u { font-size: 11.5px; line-height: 14px; color: var(--text3); }

  /* step dots: the My reviews ticket's own */
  .strip { display: flex; align-items: center; gap: 6px; margin-top: 16px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .dot.d { background: var(--accentInk); }
  .dot.c { box-shadow: inset 0 0 0 2px var(--accentInk); }
  .dot.f { border: 1.5px dashed var(--text4); }
  .strip .stl { margin-left: 6px; font-size: 13px; line-height: 16px; font-weight: 600; color: var(--text2); }

  /* blocks */
  .card { background: var(--bg); border: 1px solid var(--cardLine); border-radius: 14px; position: relative; }
  .p16 { padding: 16px; }
  .p14 { padding: 12px 14px; }
  .sh { display: flex; align-items: center; gap: 8px; padding: 22px 0 10px; }
  .sh .t { flex: 1; font-size: 16px; line-height: 19px; font-weight: 700; }
  .sh .tg { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text3); background: var(--glass2); padding: 2px 9px; border-radius: 10px; }
  .ct { font-size: 16px; line-height: 20px; font-weight: 700; }
  .ct .inl { color: var(--tileInk); }
  .il { font-size: 13.5px; line-height: 19px; color: var(--text2); position: relative; }
  .il + .il { margin-top: 8px; }
  .il .inl { color: var(--text3); }
  .il b { color: var(--text); font-weight: 600; }
  .il.warn { color: var(--text); } .il.warn .inl { color: var(--warn); }
  .il.bad .inl { color: var(--bad); } .il.ok .inl { color: var(--ok); }
  .il.sm { font-size: 12.5px; line-height: 17px; color: var(--text3); }
  .ii { display: inline-grid; place-items: center; width: 22px; height: 18px; vertical-align: -3px; color: var(--text3); }
  .ii.open span { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, var(--accentInk) 10%, transparent); color: var(--accentInk); }
  .co { position: absolute; left: -4px; right: -4px; top: calc(100% + 10px); z-index: 4; background: var(--sheet); border: 1px solid var(--glassBorder); border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 18px; color: var(--text2); box-shadow: 0 8px 24px rgba(16,47,70,.16); }
  .co::before { content: ""; position: absolute; top: -7px; left: var(--cx, 60%); width: 12px; height: 12px; background: var(--sheet); border-left: 1px solid var(--glassBorder); border-top: 1px solid var(--glassBorder); transform: rotate(45deg); }
  .co b { color: var(--text); font-weight: 600; }
  .ns { margin-top: 10px; }
  .ns .n { font-size: 14px; line-height: 20px; color: var(--text2); }
  .ns .n + .n { margin-top: 8px; }
  .ns .n b { color: var(--text); font-weight: 600; }
  .nb { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--tile); color: var(--tileInk); font-size: 12px; font-weight: 700; margin-right: 8px; vertical-align: 0; line-height: 20px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 12.5px; line-height: 16px; font-weight: 700; white-space: nowrap; }
  .chip.ok { background: var(--okBg); color: var(--ok); } .chip.warn { background: var(--warnBg); color: var(--warn); }
  .chip.bad { background: var(--badBg); color: var(--bad); } .chip.quiet { background: var(--glass2); color: var(--text2); }

  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 7px 14px; border-radius: 17px; background: var(--tile); color: var(--accentInk); font-size: 13.5px; line-height: 16px; font-weight: 700; white-space: nowrap; }
  .pill.fill { background: var(--primary); color: var(--onPrimary); }
  .ia { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 8px; font-size: 14px; font-weight: 700; color: var(--accentInk); border-radius: 16px; }
  .ia.bad { color: var(--bad); } .ia.off { color: var(--text4); }
  .pbtn { height: 52px; border-radius: 26px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; }
  .pbtn.off { background: color-mix(in srgb, var(--text) 12%, transparent); color: color-mix(in srgb, var(--text) 38%, transparent); }
  .pbtn.bad { background: var(--bad); color: var(--onTone); }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; }
  .ta { display: flex; justify-content: center; align-items: center; gap: 2px; min-height: 44px; font-size: 13px; color: var(--text3); }
  .ta .ia { min-height: 44px; }

  /* field: OutlinedField, notched */
  .fld { position: relative; border: 1px solid var(--glassBorderStrong); border-radius: 10px; padding: 13px 14px; font-size: 15px; line-height: 20px; font-weight: 500; color: var(--text); white-space: pre-wrap; }
  .fld.foc { border: 2px solid var(--primary); padding: 12px 13px; }
  .fld .lab { position: absolute; top: -9px; left: 10px; padding: 0 4px; background: var(--fb, var(--bg)); font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text3); white-space: nowrap; }
  .fld.foc .lab { color: var(--accentInk); }
  .fld .ph, .fld .down { color: var(--text4); font-weight: 400; }
  .fld .cur { display: inline-block; width: 2px; height: 18px; background: var(--primary); vertical-align: -3px; }
  .fld .txt { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .fld.drop::after { content: ""; position: absolute; right: 16px; top: 21px; border: 5px solid transparent; border-top-color: var(--text3); }
  .ff { display: flex; gap: 8px; margin-top: 4px; font-size: 12px; line-height: 14px; color: var(--text3); }
  .ff .fc { margin-left: auto; color: var(--text4); font-size: 11.5px; font-feature-settings: "tnum"; }
  .ff .okc { color: var(--ok); font-weight: 600; }

  /* proof */
  .pf { display: flex; gap: 12px; align-items: flex-start; }
  .thumb { width: 72px; height: 128px; border-radius: 10px; flex: none; overflow: hidden; position: relative; }
  .thumb.empty { border: 1.5px dashed var(--glassBorderStrong); display: grid; place-items: center; color: var(--text4); }
  .pf .acts { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding-top: 2px; }

  /* the reviewer's Play screenshot: their content, not the palette */
  .shot { background: #fff; position: relative; overflow: hidden; font-family: Roboto, system-ui, sans-serif; }
  .shot .s0 { height: 9%; background: #E8EAED; }
  .shot .s1 { display: flex; gap: 6%; align-items: center; padding: 7% 8% 4%; }
  .shot .s1 i { width: 24%; aspect-ratio: 1; border-radius: 22%; background: var(--sa, #F4A261); }
  .shot .s1 b { flex: 1; height: 7px; border-radius: 4px; background: #3C4043; }
  .shot .s2 { margin: 4% 8%; height: 5px; border-radius: 3px; background: #DADCE0; }
  .shot .s3 { margin: 6% 6% 0; border: 1px solid #DADCE0; border-radius: 8px; padding: 6%; }
  .shot .st { color: #01875F; font-size: 9px; letter-spacing: 1px; line-height: 10px; }
  .shot .sl { height: 4px; border-radius: 2px; background: #BDC1C6; margin-top: 6%; }
  .shot .sl.w { width: 70%; }
  .shot .sb { margin: 6% 8% 0; height: 14%; border-radius: 8px; background: #01875F; }
  .shot .sx { margin: 6% 8% 0; font: 600 8px/10px system-ui; color: #5F6368; }
  .shot .sbox { margin: 6% 6% 0; border: 1.5px solid #01875F; border-radius: 8px; height: 14%; }

  /* chat bubbles (CrewChatBubble) */
  .thr { display: flex; flex-direction: column; gap: 10px; }
  .m { display: flex; gap: 8px; align-items: flex-end; }
  .m.r { justify-content: flex-end; }
  .m .col { max-width: 82%; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .m.r .col { align-items: flex-end; }
  .who { font-size: 12px; font-weight: 600; color: var(--text3); margin: 0 12px 3px; }
  .bub { background: var(--glass2); color: var(--text); border-radius: 18px 18px 18px 6px; padding: 7px 12px; font-size: 14.5px; line-height: 20px; }
  .m.r .bub { border-radius: 18px 18px 6px 18px; }
  .m.mine .bub { background: var(--accent); color: var(--onAccent); }
  .m.side .bub { background: var(--tile); color: var(--text); }
  .bub.haspic { padding: 4px 4px 7px; }
  .bub .pic { width: 156px; height: 232px; border-radius: 14px; overflow: hidden; margin-bottom: 6px; }
  .bub.onlypic { padding: 4px; } .bub.onlypic .pic { margin: 0; }
  .bub .tx { padding: 0 8px; display: block; max-width: 290px; }
  .bub.haspic .tx { max-width: 156px; }
  .mt { font-size: 11.5px; line-height: 15px; color: var(--text4); margin: 3px 10px 0; display: flex; align-items: center; gap: 4px; }
  .fav { width: 28px; height: 28px; border-radius: 50%; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; flex: none; }
  .fav.dev { background: var(--glass2); color: var(--text2); }
  .sys { align-self: center; display: flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 99px; background: var(--glass2); color: var(--text2); font-size: 12.5px; line-height: 17px; }
  .sys.warn { background: var(--warnBg); color: var(--warn); font-weight: 600; }

  /* reviewer face (feedback-card faces) */
  .rs { position: relative; width: 40px; height: 40px; flex: none; }
  .rs .av { width: 40px; height: 40px; border-radius: 50%; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; }
  .rs.chk .av { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--warn); }
  .rs.prog .av { opacity: .5; }
  .rs .mk { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--bg); display: grid; place-items: center; color: var(--onTone); }
  .rs .mk.ok { background: var(--ok); } .rs .mk.chk { background: var(--warn); } .rs .mk.prog { background: var(--text4); } .rs .mk.bad { background: var(--bad); }
  .rr { display: flex; align-items: center; gap: 12px; }
  .rr .col { flex: 1; min-width: 0; }
  .rr .t { font-size: 16px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rr .s { margin-top: 2px; font-size: 12.5px; line-height: 16px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rr .s.warn { color: var(--warn); font-weight: 600; } .rr .s.ok { color: var(--ok); } .rr .s.bad { color: var(--bad); }
  .rlist .card + .card { margin-top: 8px; }

  /* status + timeline on a finished review */
  .stt { display: flex; align-items: center; gap: 14px; margin-top: 22px; }
  .stt .tl { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }
  .stt .tl.ok { background: var(--okBg); color: var(--ok); } .stt .tl.now { background: var(--tile); color: var(--tileInk); }
  .stt .tl.bad { background: var(--badBg); color: var(--bad); } .stt .tl.q { background: var(--glass2); color: var(--text3); }
  .stt .t { font-size: 20px; line-height: 24px; font-weight: 700; }
  .stt .l { margin-top: 2px; font-size: 13.5px; line-height: 18px; color: var(--text2); }
  .tml { margin-top: 16px; padding: 14px 16px; }
  .tr { display: flex; gap: 12px; align-items: flex-start; position: relative; }
  .tr + .tr { margin-top: 14px; }
  .tr + .tr::before { content: ""; position: absolute; left: 11px; top: -12px; width: 2px; height: 10px; background: var(--cardLine); }
  .td { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--onTone); }
  .td.ok { background: var(--ok); } .td.now { background: var(--accent); color: var(--onAccent); } .td.later { background: var(--glass2); } .td.bad { background: var(--bad); }
  .tr .t { font-size: 15px; line-height: 19px; font-weight: 600; }
  .tr .d { font-size: 12.5px; line-height: 16px; color: var(--text3); margin-top: 1px; }
  .tr.later .t { color: var(--text2); font-weight: 500; }

  /* usage bar, return countdown */
  .ub { margin-top: 14px; height: 46px; border-radius: 11px; background: var(--track); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 13px; color: var(--text2); }
  .ub i { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 24%, var(--track)); }
  .ub span { position: relative; } .ub b { font-family: "PlexApp", monospace; font-weight: 700; color: var(--text); font-size: 13.5px; }

const NEW = (html, note) => `<div class="state"><div class="tag"><i class="new">NEW</i>${note ? `<em>${note}</em>` : ''}</div>${html}</div>`;
const PAIR = (k, label, nows, news) => `<div class="pair"><div class="pl"><span class="k">${k}</span>${label}</div><div class="two">${nows}${'<span class="gap"></span>'}${news}</div></div>`;
const PH = 'on the phone', RB = 'rebuilt from the code', DEV = "demo app isn't installed, so the phone shows step 1";
