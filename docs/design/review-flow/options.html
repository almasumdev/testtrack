<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check review and Waiting: five options each</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "BarlowApp"; font-weight: 400; src: url("../../../app/src/main/res/font/barlow_regular.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 500; src: url("../../../app/src/main/res/font/barlow_medium.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 600; src: url("../../../app/src/main/res/font/barlow_semibold.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 700; src: url("../../../app/src/main/res/font/barlow_bold.ttf"); }
  @font-face { font-family: "PlexApp"; font-weight: 700; src: url("../../../app/src/main/res/font/plexmono_bold.ttf"); }

  /* OceanLight / OceanDark, ui/theme/Tokens.kt */
  .light {
    --bg:#F7FCFF; --text:#142F43; --text2:#203A4E; --text3:#223D50; --text4:#59758A;
    --tabSelected:#2E4E66;
    --glass:#F2F9FD; --glass2:#DFEDF6; --glassBorder:#B7D1E2; --glassBorderStrong:#789AAF;
    --accent:#3A5B73; --onAccent:#FFFFFF; --accentInk:#22394B;
    --tile:#DCE6EE; --tileInk:#3A5B73; --leafAccent:#3A5B73; --leafAccentSoft:rgba(74,114,144,.16);
    --ok:#246B59; --okBg:rgba(36,107,89,.12); --warn:#8A611C; --warnBg:rgba(154,110,36,.12);
    --bad:#9E3B2E; --badBg:rgba(158,59,46,.12);
    --card:#F3F8FB; --cardLine:#E1ECF3; --sheet:#FFFFFF; --ring:rgba(20,47,67,.14); --track:#E4EEF4; --sk:#E3EDF4;
    --flaskLiquid:#9279D6; --flaskGlass:#4A3B86;
    --panelTop:#F7FCFF; --panelBottom:#E3F0F8; --panelGlow:rgba(184,204,219,.6); --panelOutline:#94B8CF;
    --tixTop:#3F6680; --tixBottom:#2B4A60;
    --primary:var(--accent); --onPrimary:var(--onAccent); --onTone:#FFFFFF; --scrim:rgba(20,34,48,.46);
  }
  .dark {
    --bg:#0F1011; --text:#ECEEF0; --text2:#BCC1C6; --text3:#9DA3A9; --text4:#757C82;
    --tabSelected:#B6CCDC;
    --glass:#1C1E20; --glass2:#292C2F; --glassBorder:#383C41; --glassBorderStrong:#666D74;
    --accent:#4A7290; --onAccent:#FFFFFF; --accentInk:#93B3CA;
    --tile:#2A2D31; --tileInk:#A2BED2; --leafAccent:#93B3CA; --leafAccentSoft:#2A2D31;
    --ok:#83D8C4; --okBg:rgba(131,216,196,.12); --warn:#D8B774; --warnBg:rgba(216,183,116,.14);
    --bad:#E4938A; --badBg:rgba(228,147,138,.15);
    --card:#1C1E20; --cardLine:#2D3034; --sheet:#1C1E20; --ring:rgba(255,255,255,.16); --track:#2D3034; --sk:#212427;
    --flaskLiquid:#8C70D4; --flaskGlass:#CDBEF0;
    --panelTop:#1F2225; --panelBottom:#18191B; --panelGlow:rgba(147,179,202,.06); --panelOutline:#40464C;
    --tixTop:#4A7290; --tixBottom:#355A75;
    --primary:var(--accentInk); --onPrimary:var(--bg); --onTone:#0F1011; --scrim:rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #D9E0E5; font-family: "BarlowApp", "Barlow", system-ui, sans-serif; color: #1B2B36; }
  body.dk { background: #2A3036; color: #E3E8EC; }
  .top { position: sticky; top: 0; z-index: 9; display: flex; align-items: center; gap: 10px; padding: 12px 28px; background: inherit; border-bottom: 1px solid #C3CDD4; }
  body.dk .top { border-color: #3A4249; }
  .top h1 { margin: 0 14px 0 0; font-size: 20px; font-weight: 700; }
  .top button, .top a { font: 600 15px/20px "BarlowApp", "Barlow", sans-serif; padding: 8px 18px; border-radius: 20px; border: 1px solid #B3C0C9; background: #F4F7F9; color: #2D4A5F; cursor: pointer; text-decoration: none; }
  .top button.on { background: #2D4A5F; color: #fff; border-color: #2D4A5F; }
  .top .gap { flex: 1; }
  .doc { padding: 6px 28px 80px; }
  .page { font-size: 30px; font-weight: 700; margin: 44px 0 6px 4px; }
  .opt { margin-top: 44px; }
  .ol { font-size: 22px; font-weight: 700; margin: 0 0 12px 4px; display: flex; gap: 10px; align-items: center; }
  .ol .k { display: inline-grid; place-items: center; height: 30px; padding: 0 12px; border-radius: 9px; background: #2D4A5F; color: #fff; font-size: 15px; }
  .ol .k.now { background: #8A949C; }
  .ol .rec { font-size: 14px; padding: 4px 12px; border-radius: 99px; background: #246B59; color: #fff; }
  body.dk .ol .k { background: #93B3CA; color: #0F1011; }
  body.dk .ol .k.now { background: #5E666D; color: #fff; }
  body.dk .ol .rec { background: #83D8C4; color: #0F1011; }
  .optrow { display: flex; gap: 26px; align-items: flex-start; flex-wrap: wrap; }
  .fr { display: flex; flex-direction: column; gap: 6px; }
  .fl { font-size: 14px; font-weight: 700; margin-left: 4px; color: #4F5C66; }
  body.dk .fl { color: #A8B2BA; }
  .minis { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .mini { zoom: .6; }
  .cap { width: 412px; height: 892px; border-radius: 28px; border: 1px solid #3A4046; display: block; object-fit: cover; object-position: top; background: #0F1011; }
  .cap.s { zoom: .6; }

  /* phone */
  .phone { width: 412px; height: 880px; background: var(--bg); color: var(--text); border-radius: 28px; overflow: hidden; border: 1px solid #B9C5CE; position: relative; display: flex; flex-direction: column; }
  .dark.phone { border-color: #3A4046; }
  .sbar { height: 24px; flex: none; }
  .pbar { height: 64px; flex: none; display: flex; align-items: center; }
  .pbar .back { width: 48px; height: 48px; display: grid; place-items: center; margin-left: 4px; color: var(--text); flex: none; }
  .pbar .ttl { margin-left: 4px; font-size: 22px; line-height: 28px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbar .pr { margin-right: 4px; min-width: 48px; height: 48px; display: grid; place-items: center; color: var(--text2); font-size: 14px; font-weight: 700; font-feature-settings: "tnum"; padding: 0 8px; }
  .pbar .tixp { margin-right: 14px; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--tile); color: var(--tileInk); display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; }
  .scroll { flex: 1; overflow-y: auto; padding: 8px 16px 20px; scrollbar-width: none; position: relative; }
  .scroll::-webkit-scrollbar { display: none; }
  .foot { flex: none; padding: 10px 16px 6px; }
  .gest { height: 22px; flex: none; display: grid; place-items: center; }
  .gest i { width: 108px; height: 4px; border-radius: 2px; background: var(--text4); opacity: .55; }

  svg.ic { display: block; flex: none; }
  .inl { display: inline-block; vertical-align: -2px; margin-right: 6px; }
  .inl svg { display: inline-block; }
  .ai { display: grid; place-items: center; flex: none; overflow: hidden; box-shadow: inset 0 0 0 1px var(--ring); font-weight: 700; }
  .light .nt { background: hsl(var(--h) 45% 89%); color: hsl(var(--h) 50% 32%); box-shadow: none; }
  .dark .nt { background: hsl(var(--h) 30% 18%); color: hsl(var(--h) 55% 76%); box-shadow: none; }

  .ah { display: flex; align-items: center; gap: 12px; }
  .aic { position: relative; flex: none; }
  .src { position: absolute; right: -5px; bottom: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--sheet); box-shadow: 0 0 0 2px var(--bg); display: grid; place-items: center; }
  .ah .col { flex: 1; min-width: 0; }
  .an { font-size: 16px; line-height: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ad { margin-top: 2px; font-size: 12.5px; line-height: 15px; font-weight: 500; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .card { background: var(--bg); border: 1px solid var(--cardLine); border-radius: 14px; position: relative; }
  .il { font-size: 13.5px; line-height: 19px; color: var(--text2); position: relative; }
  .il + .il { margin-top: 8px; }
  .il .inl { color: var(--text3); }
  .il b { color: var(--text); font-weight: 600; }
  .il.warn { color: var(--text); } .il.warn .inl { color: var(--warn); }
  .il.ok .inl { color: var(--ok); }
  .il.sm { font-size: 12.5px; line-height: 17px; color: var(--text3); }
  .ii { display: inline-grid; place-items: center; width: 22px; height: 18px; vertical-align: -3px; color: var(--text3); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 12.5px; line-height: 16px; font-weight: 700; white-space: nowrap; }
  .chip.ok { background: var(--okBg); color: var(--ok); } .chip.warn { background: var(--warnBg); color: var(--warn); }
  .chip.bad { background: var(--badBg); color: var(--bad); } .chip.quiet { background: var(--glass2); color: var(--text2); }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 7px 14px; border-radius: 17px; background: var(--tile); color: var(--accentInk); font-size: 13.5px; line-height: 16px; font-weight: 700; white-space: nowrap; }
  .pill.bad { color: var(--bad); background: var(--badBg); }
  .ia { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 8px; font-size: 14px; font-weight: 700; color: var(--accentInk); border-radius: 16px; }
  .ia.bad { color: var(--bad); } .ia.off { color: var(--text4); }
  .pbtn { height: 52px; border-radius: 26px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; }
  .pbtn.off { background: color-mix(in srgb, var(--text) 12%, transparent); color: color-mix(in srgb, var(--text) 38%, transparent); }
  .spin { width: 20px; height: 20px; border-radius: 50%; border: 2.4px solid color-mix(in srgb, currentColor 28%, transparent); border-top-color: currentColor; }
  .ta { display: flex; justify-content: center; align-items: center; min-height: 44px; }
  .sys { align-self: center; display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 99px; background: var(--glass2); color: var(--text2); font-size: 12.5px; line-height: 17px; }
  .sys.warn { background: var(--warnBg); color: var(--warn); font-weight: 600; }
  .pmsg { margin: 0 16px 6px; display: flex; align-items: center; gap: 10px; padding: 11px 10px 11px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glassBorder); font-size: 14px; line-height: 19px; flex: none; }
  .pmsg .w { flex: 1; } .pmsg .x { color: var(--text3); } .pmsg .m0 { color: var(--accentInk); }
  .sk { display: block; background: var(--sk); border-radius: 6px; }
  .ns .n { font-size: 14px; line-height: 20px; color: var(--text2); }
  .ns .n + .n { margin-top: 8px; }
  .ns .n b { color: var(--text); font-weight: 600; }
  .nb { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--tile); color: var(--tileInk); font-size: 12px; font-weight: 700; margin-right: 8px; line-height: 20px; }
  .meta { font-size: 12px; line-height: 16px; color: var(--text4); }
  .meta.ok { color: var(--ok); font-weight: 600; }
  .ttlS { font-size: 16px; line-height: 19px; font-weight: 700; }

  /* reviewer face */
  .rs { position: relative; flex: none; }
  .rs .av { border-radius: 50%; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; }
  .rs.chk .av { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--warn); }
  .rs .mk { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--bg); display: grid; place-items: center; color: var(--onTone); background: var(--warn); }
  .rr { display: flex; align-items: center; gap: 12px; }
  .rr .col { flex: 1; min-width: 0; }
  .rr .t { font-size: 16px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rr .s { margin-top: 2px; font-size: 12.5px; line-height: 16px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* chat bubbles (ThreadBubble) */
  .thr { display: flex; flex-direction: column; gap: 10px; }
  .m { display: flex; gap: 8px; align-items: flex-end; }
  .m.r { justify-content: flex-end; }
  .m .col { max-width: 82%; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .m.r .col { align-items: flex-end; }
  .who { font-size: 12px; font-weight: 600; color: var(--text3); margin: 0 12px 3px; }
  .bub { background: var(--glass2); color: var(--text); border-radius: 18px 18px 18px 6px; padding: 7px 12px; font-size: 14.5px; line-height: 20px; }
  .m.r .bub { border-radius: 18px 18px 6px 18px; }
  .m.mine .bub { background: var(--accent); color: var(--onAccent); }
  .m.ghost .bub { background: transparent; border: 1.5px dashed var(--glassBorder); color: var(--text3); }
  .bub.haspic { padding: 4px 4px 7px; }
  .bub .pic { border-radius: 14px; overflow: hidden; margin-bottom: 6px; }
  .bub.onlypic { padding: 4px; } .bub.onlypic .pic { margin: 0; }
  .bub .tx { padding: 0 8px; display: block; }
  .mt { font-size: 11.5px; line-height: 15px; color: var(--text4); margin: 3px 10px 0; }
  .fav { width: 28px; height: 28px; border-radius: 50%; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; flex: none; }
  .fav.dev { background: var(--glass2); color: var(--text2); }

  /* a picture's corner: open it whole */
  .shw { position: relative; overflow: hidden; flex: none; background: #fff; }
  .xb { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; display: grid; place-items: center; }
  .plab { position: absolute; left: 8px; top: 8px; padding: 2px 9px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff; font-size: 11.5px; line-height: 16px; font-weight: 600; }

  /* the reviewer's Play screenshot: their content, white in both themes */
  .ps { width: 180px; background: #fff; color: #202124; font-family: Roboto, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .ps .q0 { display: flex; justify-content: space-between; padding: 6px 10px 0; font-size: 7px; font-weight: 600; color: #3C4043; }
  .ps .qa { display: flex; gap: 8px; align-items: center; padding: 11px 10px 0; }
  .ps .qa i { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; font: 700 14px system-ui; font-style: normal; flex: none; }
  .ps .qa b { display: block; font-size: 10px; line-height: 12px; }
  .ps .qa span { font-size: 7px; color: #01875F; font-weight: 600; }
  .ps .qo { margin: 9px 10px 0; height: 18px; border-radius: 9px; border: 1px solid #DADCE0; display: grid; place-items: center; font-size: 7.5px; font-weight: 600; color: #01875F; }
  .ps .qh { padding: 11px 10px 0; font-size: 8.5px; font-weight: 700; }
  .ps .qs { padding: 3px 10px 0; color: #01875F; font-size: 12px; letter-spacing: 2px; line-height: 14px; }
  .ps .qb { margin: 5px 10px 0; border: 1px solid #01875F; border-radius: 6px; padding: 6px; font-size: 6.6px; line-height: 9px; color: #3C4043; min-height: 46px; }
  .ps .qk { padding: 4px 10px 0; font-size: 7px; color: #01875F; font-weight: 600; }
  .ps .ql { margin: 5px 10px 0; height: 4px; border-radius: 2px; background: #E1E3E6; }
  .ps .qr2 { display: flex; gap: 10px; padding: 6px 10px 0; align-items: center; }
  .ps .qr2 .qbg { font-size: 22px; font-weight: 500; line-height: 24px; }
  .ps .qr2 .qbars { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .ps .qr2 .qbars i { height: 3px; border-radius: 2px; background: #01875F; display: block; }
  .ps .qg { font-size: 6.5px; color: #5F6368; padding: 3px 10px 0; line-height: 9px; }

  /* ===== Check 1: the screenshot first ===== */
  .c1 { padding: 12px; }
  .c1w { margin-top: 12px; font-size: 14.5px; line-height: 20px; padding: 0 2px; }
  .c1m { margin-top: 6px; padding: 0 2px; }
  .c1two { display: flex; gap: 8px; }

  /* ===== Check 2: summary and verdict ===== */
  .panel { position: relative; border-radius: 18px; padding: 14px; background: radial-gradient(circle at 100% 0, var(--panelGlow), transparent 55%), linear-gradient(160deg, var(--panelTop), var(--panelBottom)); outline: 1.5px dashed var(--panelOutline); outline-offset: -1.5px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
  .fact .l { font-size: 11.5px; line-height: 14px; color: var(--text3); font-weight: 600; }
  .fact .v { margin-top: 2px; font-size: 16px; line-height: 20px; font-weight: 700; font-feature-settings: "tnum"; }
  .fact .v.warn { color: var(--warn); }
  .sent2 { display: flex; gap: 12px; margin-top: 14px; }
  .sent2 .tx { font-size: 13.5px; line-height: 19px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .verdict { margin-top: 18px; }
  .vh { display: flex; align-items: baseline; gap: 8px; }
  .vh .big { font-family: "PlexApp", monospace; font-size: 30px; line-height: 34px; font-weight: 700; color: var(--warn); }
  .vh .w { font-size: 13.5px; color: var(--text2); }
  .vbtn { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 18px; border-radius: 32px; margin-top: 10px; }
  .vbtn .a { font-size: 16px; line-height: 20px; font-weight: 700; }
  .vbtn .b { font-size: 12.5px; line-height: 16px; opacity: .85; }
  .vbtn.go { background: var(--primary); color: var(--onPrimary); }
  .vbtn.no { background: var(--badBg); color: var(--bad); min-height: 56px; }
  .vbtn .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, currentColor 16%, transparent); flex: none; }

  /* ===== Check 3 and Waiting 5: thread ===== */
  .datep { align-self: center; font-size: 12px; font-weight: 600; color: var(--text3); }
  .qr { display: flex; gap: 8px; padding-bottom: 10px; }
  .bar3 { display: flex; gap: 10px; align-items: center; }
  .bar3 .pbtn { flex: 1; }

  /* ===== Check 4 and Waiting 3: rail ===== */
  .tbar { margin-top: 2px; }
  .tbar .tr0 { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 8px; }
  .tbar .tr0 i { display: block; height: 100%; background: var(--warn); border-radius: 3px; }
  .rail { position: relative; margin-top: 18px; }
  .rail .stp { position: relative; padding-left: 40px; padding-bottom: 22px; }
  .rail .stp::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; background: var(--cardLine); }
  .rail .stp:last-child::before { display: none; }
  .rail .no { position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--tile); color: var(--tileInk); }
  .rail .no.ok { background: var(--ok); color: var(--onTone); }
  .rail .no.now { background: var(--accent); color: var(--onAccent); }
  .rail .no.later { background: var(--glass2); color: var(--text3); }
  .rail .no.warn { background: var(--warn); color: var(--onTone); }
  .rail .h { font-size: 16px; line-height: 28px; font-weight: 700; }
  .rail .h.later { color: var(--text2); font-weight: 600; }
  .rail .h small { font-size: 12px; font-weight: 600; color: var(--text3); margin-left: 6px; }
  .rail .d { font-size: 13px; line-height: 18px; color: var(--text3); }
  .quote { margin-top: 8px; padding: 10px 12px; border-radius: 14px; background: var(--glass2); font-size: 14px; line-height: 20px; }

  /* ===== Check 5: split ===== */
  .split { display: flex; gap: 12px; }
  .split .rc { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .split .tx { font-size: 14px; line-height: 20px; }
  .dock5 { flex: none; background: var(--sheet); border-radius: 22px 22px 0 0; padding: 12px 16px 6px; box-shadow: 0 -6px 24px rgba(16,47,70,.12); }
  .dark .dock5 { box-shadow: 0 -6px 24px rgba(0,0,0,.5); }
  .dock5 .hd { width: 38px; height: 4px; border-radius: 2px; background: var(--text4); opacity: .5; margin: 0 auto 12px; }
  .dock5 .row { display: flex; align-items: center; gap: 10px; }
  .dock5 .pay { display: flex; align-items: center; gap: 8px; font-size: 22px; line-height: 26px; font-weight: 700; flex: 1; font-feature-settings: "tnum"; }
  .dock5 .pay small { font-size: 12.5px; font-weight: 600; color: var(--text3); }
  .yd { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--text3); margin-bottom: 8px; }

  /* ===== Waiting 1: ring ===== */

    <div class="in"><span class="ico" style="${warn ? 'background:var(--warnBg);color:var(--warn)' : ''}">${ic(warn ? 'camera' : 'hourglass', 16, 2.2)}</span><span class="v">${d.left}</span><span class="u">${warn ? 'to send it' : d.live ? 'until we check' : 'until it accepts itself'}</span></div></div>`;

    t += `<div class="sys warn">${ic('clock', 13, 2.4)}Send it by ${d.by}</div>`;
    const body = head(d.app, d.live, { s: 36, sub: 'With the developer' }) + sp(14) + `<div class="thr">${t}</div>`;
    return phone(th, { title: d.title, tix: TIX(d), body, foot: `<div class="qr" style="justify-content:center">${pill('Capture on Play', 'camera')}</div>` + SENDNEW });
  }
  if (d.again) {
    t += M({ side: 'r', tone: 'mine', pic: d.pics[0], pw: 130, ph: 170, meta: 'First screenshot' });
    t += M({ dev: true, who: 'Developer', text: 'Asked you for a new screenshot' });
    t += M({ side: 'r', tone: 'mine', pic: d.pics[1], pw: 130, ph: 170, meta: `New, ${d.sent}` });
  } else {
    t += M({ side: 'r', tone: 'mine', pic: d.pics[0], text: d.text, pw: 190, ph: 240, meta: `Sent ${d.sent.split(', ')[1]}` });
    t += `<div class="sys">${ic('check', 13, 2.6)}All 4 steps done</div>`;
  }
  t += `<div class="m l ghost"><span class="fav dev">${ic('grid', 15, 2)}</span><div class="col"><div class="bub">${ic('hourglass', 14, 2.2).replace('class="ic"', 'class="ic" style="display:inline-block;vertical-align:-2px;margin-right:6px"')}Not checked yet</div><div class="mt">${d.live ? 'We check after a day if they don\'t answer' : `Accepts itself in ${d.left}`}</div></div></div>`;
  const body = head(d.app, d.live, { s: 36, sub: 'With the developer' }) + sp(14) + `<div class="thr">${t}</div>` + (d.live ? sp(14) + KEEP(d) : '');
  return phone(th, { title: d.title, tix: TIX(d), body, foot: DONE });
}

/* ---------- the page ---------- */
const OPTS1 = [
  ['1', 'The screenshot first', C1, true],
  ['2', 'Summary and a big verdict', C2],
  ['3', 'A chat with the reviewer', C3],
  ['4', 'Three checks down a rail', C4],
  ['5', 'They sent, you decide', C5],
];
const OPTS2 = [
  ['1', 'Countdown ring', W1, true],
  ['2', 'A receipt', W2],
  ['3', 'Timeline', W3],
  ['4', 'One quiet card', W4],
  ['5', 'A chat with the developer', W5],
];
function section(id, title, nows, opts, data, minis) {
  let h = `<div class="page" id="${id}">${title}</div>`;
  h += `<div class="opt"><div class="ol"><span class="k now">Today</span>On the phone now</div><div class="optrow">${nows}</div></div>`;
  for (const [k, name, fn, rec] of opts) {
    h += `<div class="opt"><div class="ol"><span class="k">Option ${k}</span>${name}${rec ? '<span class="rec">Recommended</span>' : ''}</div><div class="optrow">`;
    h += F('Main', fn(TH, data.main));
    h += `<div class="minis">${minis.map(([key, label]) => MINI(label, fn(TH, data[key]))).join('')}</div>`;
    h += `</div></div>`;
  }
  return h;
}
const IMG = (src, label) => F(label, `<img class="cap" src="${src}" alt="${label}">`);
const IMGS = (src, label) => `<div class="fr"><div class="fl">${label}</div><img class="cap s" src="${src}" alt="${label}"></div>`;
let TH = 'light';
function show(th) {
  TH = th;
  let h = section('p1', 'Check review', IMG('device/B1-check.png', 'Dark, 1 of 2') + `<div class="minis">${IMGS('device/render-B02-kept.png', 'Light, uninstalled warning')}${IMGS('device/render-B04-recheck.png', 'New screenshot came')}${IMGS('device/render-B03-half.png', 'Half pay')}</div>`,
    OPTS1, CK, [['again', 'New screenshot came'], ['half', 'Half pay, uninstalled'], ['busy', 'Accepting']]);
  h += section('p2', 'Waiting for the developer', IMG('current/waiting_sent-1.png', 'Sent, waiting') + `<div class="minis">${IMGS('current/waiting_sent-2-scrolled.png', 'Scrolled')}${IMGS('current/waiting_half-1.png', 'Live, half pay')}${IMGS('current/waiting_checking-1.png', 'Asked for a new one')}</div>`,
    OPTS2, WT, [['again', 'Sent again'], ['checking', 'Asked for a new one'], ['half', 'Live, half pay']]);
  document.getElementById('doc').innerHTML = h;
  document.body.classList.toggle('dk', th === 'dark');
  document.querySelectorAll('.top button').forEach((b) => b.classList.toggle('on', b.dataset.t === th));
  history.replaceState(null, '', location.hash.startsWith('#p') ? location.hash : '#' + th);
}
document.querySelectorAll('.top button').forEach((b) => b.addEventListener('click', () => { history.replaceState(null, '', '#' + b.dataset.t); show(b.dataset.t); }));
show(location.hash === '#dark' ? 'dark' : 'light');
if (document.fonts) document.fonts.ready.then(() => show(TH));
</script>
</body>
</html>
