<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owner sees crew reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "BarlowApp"; font-weight: 400; src: url("../../../app/src/main/res/font/barlow_regular.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 500; src: url("../../../app/src/main/res/font/barlow_medium.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 600; src: url("../../../app/src/main/res/font/barlow_semibold.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 700; src: url("../../../app/src/main/res/font/barlow_bold.ttf"); }
  @font-face { font-family: "PlexApp"; font-weight: 700; src: url("../../../app/src/main/res/font/plexmono_bold.ttf"); }

  /* OceanLight / OceanDark, ui/theme/Tokens.kt. No new tokens. */
  .light {
    --bg:#F7FCFF; --text:#142F43; --text2:#203A4E; --text3:#223D50; --text4:#59758A;
    --tabSelected:#2E4E66; --glass:#F2F9FD; --glass2:#DFEDF6; --glassBorder:#B7D1E2; --glassBorderStrong:#789AAF;
    --accent:#3A5B73; --onAccent:#FFFFFF; --accentInk:#22394B; --badgeFill:#3A5B73;
    --tile:#DCE6EE; --tileInk:#3A5B73; --leafAccentSoft:rgba(74,114,144,.16); --dock:#E8F3FA; --dockInk:#304C60;
    --ok:#246B59; --okBg:rgba(36,107,89,.12); --warn:#8A611C; --warnBg:rgba(154,110,36,.12);
    --bad:#9E3B2E; --badBg:rgba(158,59,46,.12);
    --field:#F7FCFF; --fieldBorder:#789AAF; --card:#F3F8FB; --cardLine:#E1ECF3; --sheet:#FFFFFF; --ring:rgba(20,47,67,.14); --track:#E4EEF4;
    --inverse:#172F42; --onInverse:#EFF7FC; --inverseAccent:#A9C3D6; --sOk:#83D8C4; --sBad:#E4938A;
    --primary:#3A5B73; --onPrimary:#FFFFFF; --scrim:rgba(20,34,48,.46); --sk:#E3EDF4;
    --snackShadow:0 6px 20px rgba(16,47,70,.24); --kb:#E8EBEE; --key:#FFFFFF; --keyInk:#202124;
  }
  .dark {
    --bg:#0F1011; --text:#ECEEF0; --text2:#BCC1C6; --text3:#9DA3A9; --text4:#757C82;
    --tabSelected:#B6CCDC; --glass:#1C1E20; --glass2:#292C2F; --glassBorder:#383C41; --glassBorderStrong:#666D74;
    --accent:#4A7290; --onAccent:#FFFFFF; --accentInk:#93B3CA; --badgeFill:#4A7290;
    --tile:#2A2D31; --tileInk:#A2BED2; --leafAccentSoft:#2A2D31; --dock:#1C1E20; --dockInk:#BCC1C6;
    --ok:#83D8C4; --okBg:rgba(131,216,196,.12); --warn:#D8B774; --warnBg:rgba(216,183,116,.14);
    --bad:#E4938A; --badBg:rgba(228,147,138,.15);
    --field:#141618; --fieldBorder:#666D74; --card:#1C1E20; --cardLine:#2D3034; --sheet:#1C1E20; --ring:rgba(255,255,255,.16); --track:#2D3034;
    --inverse:#E8EBEE; --onInverse:#15181A; --inverseAccent:#3F6681; --sOk:#246B59; --sBad:#9E3B2E;
    --primary:#93B3CA; --onPrimary:#0F1011; --scrim:rgba(0,0,0,.6); --sk:#212427;
    --snackShadow:0 6px 22px rgba(0,0,0,.55); --kb:#1B1D20; --key:#3A3D41; --keyInk:#E8EAED;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #D9E0E5; font-family: "BarlowApp", "Barlow", system-ui, sans-serif; color: #1B2B36; }
  .top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 12px 28px; background: #D9E0E5; border-bottom: 1px solid #C3CDD4; }
  .top h1 { margin: 0 14px 0 0; font-size: 20px; font-weight: 700; }
  .top a { font: 600 15px/20px "BarlowApp", "Barlow", sans-serif; padding: 8px 18px; border-radius: 20px; border: 1px solid #B3C0C9; background: #F4F7F9; color: #2D4A5F; text-decoration: none; }
  .doc { padding: 6px 28px 80px; }
  .part { font-size: 30px; font-weight: 700; margin: 40px 0 2px 4px; }
  .partsub { font-size: 15px; color: #4F5C66; margin: 0 0 6px 4px; }
  .grp { font-size: 15px; font-weight: 700; color: #4F5C66; margin: 26px 0 10px 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px 22px; align-items: flex-start; }
  .state { display: flex; flex-direction: column; gap: 8px; }
  .lbl { font-size: 15px; font-weight: 700; margin-left: 4px; display: flex; gap: 8px; align-items: center; max-width: 360px; }
  .lbl .k { display: inline-grid; place-items: center; min-width: 30px; height: 24px; padding: 0 7px; border-radius: 8px; background: #2D4A5F; color: #fff; font-size: 13px; flex: none; }
  .lbl .dk { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #1A1D20; color: #DDE3E8; font-weight: 600; }
  .mini { width: 360px; background: var(--bg); color: var(--text); border-radius: 18px; padding: 14px 16px; border: 1px solid #B9C5CE; display: flex; flex-direction: column; gap: 10px; }
  .mcap { font-size: 12px; font-weight: 700; color: var(--text3); margin: 4px 0 -4px 2px; }

  /* phone, 360 x 800 */
  .phone { width: 360px; height: 800px; background: var(--bg); color: var(--text); border-radius: 26px; overflow: hidden; border: 1px solid #B9C5CE; position: relative; display: flex; flex-direction: column; }
  .dark.phone, .dark.mini { border-color: #3A4046; }
  .sbar { height: 26px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 18px 0 22px; font-size: 13px; font-weight: 600; }
  .sbar .bat { width: 20px; height: 10px; border-radius: 3px; border: 1.5px solid currentColor; position: relative; }
  .sbar .bat::after { content: ""; position: absolute; inset: 1px 3px 1px 1px; background: currentColor; border-radius: 1px; }
  .gest { height: 20px; flex: none; display: grid; place-items: center; }
  .gest i { width: 108px; height: 4px; border-radius: 2px; background: var(--text4); opacity: .55; }
  .pbar { height: 64px; flex: none; display: flex; align-items: center; }
  .pbar .back { width: 48px; height: 48px; display: grid; place-items: center; margin-left: 4px; color: var(--text); flex: none; }
  .pbar .t2 { margin-left: 4px; flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pbar .t2 .a { font-size: 22px; line-height: 27px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbar .t2 .b { font-size: 12.5px; line-height: 16px; color: var(--text3); font-weight: 500; white-space: nowrap; }
  .mbtn { margin-right: 16px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--cardLine); display: inline-flex; align-items: center; gap: 6px; color: var(--accentInk); font-size: 14px; font-weight: 700; }
  .scroll { flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 12px; position: relative;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); }
  .scroll.tab { padding-top: 12px; padding-bottom: 86px; }
  .foot { flex: none; padding: 8px 16px 4px; }

  svg.ic { display: block; flex: none; }
  .inl { display: inline-block; vertical-align: -2px; margin-right: 6px; }
  .ai { display: grid; place-items: center; flex: none; overflow: hidden; box-shadow: inset 0 0 0 1px var(--ring); font-weight: 700; }
  .light .nt { background: hsl(var(--h) 45% 89%); color: hsl(var(--h) 50% 32%); box-shadow: none; }
  .dark .nt { background: hsl(var(--h) 30% 18%); color: hsl(var(--h) 55% 76%); box-shadow: none; }
  .sk { display: block; background: var(--sk); border-radius: 6px; flex: none; }

  /* crew tab chrome: HUD, segmented tabs, dock */
  .lvl { display: flex; align-items: center; gap: 10px; padding: 4px 16px 2px; flex: none; }
  .lvl .a { font-size: 17px; line-height: 21px; font-weight: 600; } .lvl .b { font-size: 12.5px; color: var(--text2); }
  .tix { display: inline-flex; align-items: center; gap: 8px; font: 700 21px "PlexApp", monospace; color: var(--text); }
  .tabs { margin: 8px 16px 0; height: 44px; border-radius: 22px; background: var(--card); border: 1px solid var(--cardLine); display: flex; padding: 3px; gap: 2px; flex: none; }
  .tabs .sg { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 17px; font-size: 14px; font-weight: 500; color: var(--text2); white-space: nowrap; }
  .tabs .sg.on { background: var(--leafAccentSoft); color: var(--tabSelected); font-weight: 600; }
  .tabs .wc { margin-left: 5px; font: 700 11px/16px "PlexApp", monospace; color: var(--tileInk); background: var(--tile); border-radius: 8px; padding: 0 5px; }
  .tabs .tdot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); margin-left: 2px; transform: translateY(-6px); }
  .dock { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: var(--dock); display: flex; align-items: center; justify-content: space-around; color: var(--dockInk); border-top: 1px solid var(--cardLine); z-index: 4; }
  .dock .d { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; }
  .dock .d .pl { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
  .dock .d.on .pl { background: var(--tile); }
  .dock .plus { width: 56px; height: 40px; border-radius: 14px; background: var(--accent); color: var(--onAccent); display: grid; place-items: center; }

  /* cards and heads (CrewCard = tileFrame, 14 corner) */
  .card { background: var(--bg); border: 1px solid var(--cardLine); border-radius: 14px; padding: 14px 16px; }
  .card.p16 { padding: 16px; } .card.p14 { padding: 14px; }
  .card + .card { margin-top: 8px; }
  .hd { display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 19px; font-weight: 700; margin: 20px 0 10px; }
  .hd:first-child { margin-top: 4px; }
  .hd .cb { min-width: 22px; height: 22px; border-radius: 11px; background: var(--badgeFill); color: var(--onAccent); font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 7px; }
  .hd .tr { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--text3); }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 12.5px; line-height: 16px; font-weight: 700; white-space: nowrap; flex: none; }
  .chip.sm { font-size: 11.5px; font-weight: 600; padding: 3px 9px 3px 8px; gap: 4px; }
  .chip.accent { background: var(--tile); color: var(--accentInk); } .chip.tile { background: var(--tile); color: var(--tileInk); }
  .chip.ok { background: var(--okBg); color: var(--ok); } .chip.warn { background: var(--warnBg); color: var(--warn); }
  .chip.bad { background: var(--badBg); color: var(--bad); } .chip.quiet { background: var(--glass2); color: var(--text3); }
  .hh { margin-top: 10px; font-size: 23px; line-height: 27px; font-weight: 700; }
  .hl { margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--text2); }
  .hl.warn { color: var(--warn); font-weight: 600; } .hl.bad { color: var(--bad); font-weight: 600; }
  .segs { display: flex; gap: 4px; margin-top: 14px; } .segs i { flex: 1; height: 7px; border-radius: 4px; display: block; }
  .ml { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12.5px; color: var(--text4); }
  .tint { margin-top: 12px; border: 1px solid var(--cardLine); border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 18px; color: var(--text2); }
  .tint b { color: var(--text); font-weight: 600; }
  .qn { font-size: 12.5px; line-height: 17px; color: var(--text4); }
  .qn .inl { color: var(--text4); }
  .it { display: flex; align-items: center; gap: 10px; }
  .it .col { flex: 1; min-width: 0; }
  .t16 { font-size: 16px; line-height: 19px; font-weight: 600; }
  .t15 { font-size: 15px; line-height: 19px; font-weight: 600; }
  .s12 { font-size: 12.5px; line-height: 16px; color: var(--text3); }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .itile { display: grid; place-items: center; flex: none; background: var(--tile); color: var(--tileInk); }

  /* buttons */
  .pbtn { height: 52px; border-radius: 26px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; }
  .pbtn.off { background: color-mix(in srgb, var(--text) 12%, transparent); color: color-mix(in srgb, var(--text) 38%, transparent); }
  .sbtn { height: 52px; border-radius: 26px; background: var(--glass2); color: var(--text); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px; font-weight: 700; flex: 1; }
  .sbtn.bad { background: var(--badBg); color: var(--bad); }
  .two { display: flex; gap: 8px; }
  .ia { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 8px; font-size: 14px; font-weight: 700; color: var(--accentInk); border-radius: 16px; white-space: nowrap; flex: none; }
  .ia.bad { color: var(--bad); } .ia.q { color: var(--text3); }
  .ia.u { text-decoration: underline; text-underline-offset: 3px; }
  .rp { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--tile); color: var(--accentInk); font-size: 14px; font-weight: 700; white-space: nowrap; flex: none; }
  .rp.ic { padding-left: 12px; }
  .rp.solid { background: var(--accent); color: var(--onAccent); }
  .xbtn { width: 32px; height: 32px; border-radius: 16px; display: grid; place-items: center; color: var(--text4); flex: none; margin-right: -6px; }
  .fab { position: absolute; right: 16px; bottom: 30px; z-index: 3; height: 52px; padding: 0 18px 0 16px; border-radius: 26px; background: var(--accent); color: var(--onAccent); display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; box-shadow: 0 4px 14px rgba(16,47,70,.22); }
  .fab .n { min-width: 20px; height: 20px; border-radius: 10px; background: var(--onAccent); color: var(--accent); font: 700 11.5px/20px "PlexApp", monospace; text-align: center; padding: 0 5px; }

  /* crew tiles */
  .th { display: flex; align-items: center; gap: 8px; min-height: 28px; }
  .th .nm { font-size: 18px; line-height: 23px; font-weight: 600; white-space: nowrap; }
  .th .dt { flex: 1; font-size: 12px; line-height: 17px; color: var(--text3); padding-top: 2px; }
  .cp { height: 28px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; padding: 0 12px 0 10px; background: var(--tile); color: var(--tileInk); font-size: 13.5px; font-weight: 600; flex: none; }
  .strip { display: flex; gap: 4px; margin-top: 14px; }
  .slot { position: relative; flex: none; }
  .mk { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 1.5px var(--bg); background: var(--ok); color: var(--bg); }
  .stand { display: flex; align-items: flex-start; gap: 12px; margin-top: 9px; }
  .stand .h { flex: 1; font-size: 15px; line-height: 20px; font-weight: 500; }
  .stand .h.ok { color: var(--ok); } .stand .h.bad { color: var(--bad); }
  .stand .r { flex: 1; font-size: 12px; line-height: 17px; color: var(--text3); text-align: right; }
  .tfoot { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--text2); }
  .spots { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .spots .s12 { flex: 1; }
  .faded { opacity: .55; }

  /* app tile and its band (CrewRunAppTile, StatusLine band) */
  .an { font-size: 16px; line-height: 19px; font-weight: 600; }
  .ap { font-size: 12px; line-height: 14px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .band { margin-top: 10px; min-height: 44px; border-radius: 10px; background: color-mix(in srgb, var(--text) 5%, var(--bg)); display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; font-size: 13px; line-height: 18px; color: var(--text3); }
  .band .w { flex: 1; min-width: 0; }
  .band.ok { color: var(--ok); } .band.warn { color: var(--warn); } .band.bad { color: var(--bad); } .band.acc { color: var(--accentInk); }

  /* AskRow */
  .ask { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 1px solid var(--cardLine); border-radius: 14px; background: var(--bg); }
  .ask .col { flex: 1; min-width: 0; }
  .ask .t { font-size: 14.5px; line-height: 19px; font-weight: 600; }
  .ask .chev { color: var(--text4); }

  /* lines with an inline icon */
  .il { font-size: 13.5px; line-height: 19px; color: var(--text2); }
  .il b { color: var(--text); font-weight: 600; }
  .il .inl { color: var(--accentInk); }
  .il.warn .inl, .il.warn b { color: var(--warn); }
  .ils { display: flex; flex-direction: column; gap: 9px; }

  /* the tracking grid (TrackingGrid) */
  .grid { background: var(--bg); border: 1px solid var(--cardLine); border-radius: 14px; padding: 12px 6px; }
  .grid .gt { display: flex; align-items: center; padding: 0 4px 10px; }
  .grid .gt .sp { flex: 1; }
  .gr { display: flex; align-items: center; }
  .gr .fc { width: 26px; flex: none; position: relative; }
  .gr .ns { flex: 1; display: flex; }
  .gr .ns > span { flex: 1; padding: 1px .5px; display: block; }
  .gr .ns > span.lit { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .gr .dn { flex: 1; text-align: center; font-size: 9.5px; line-height: 14px; color: var(--text4); }
  .gr .dn.lit { color: var(--accentInk); font-weight: 700; background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 4px 4px 0 0; }
  .sq { display: block; aspect-ratio: 1; border-radius: 4px; border: 1px solid transparent; }
  .sq.p { background: var(--ok); border-color: var(--ok); }
  .sq.o { background: var(--okBg); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .sq.m { background: var(--badBg); border-color: var(--bad); }
  .sq.n { background: var(--glass2); border-color: var(--glassBorder); }
  .sq.t { border: 1.5px solid var(--accent); }
  .sq.c { border-color: var(--glassBorder); }
  .sq.b { border: 1px dashed var(--glassBorderStrong); }
  .gnote { display: flex; align-items: center; gap: 4px; padding: 8px 4px 0; font-size: 11.5px; color: var(--text4); }
  .vb { position: absolute; left: 14px; top: 13px; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); color: var(--onAccent); display: grid; place-items: center; box-shadow: 0 0 0 1.5px var(--bg); }

  /* avatars and tester tiles */
  .av { border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; }
  .ring { position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; }
  .ring svg { position: absolute; inset: 0; }
  .tt { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .tt .col { flex: 1; min-width: 0; }
  .tt .nmr { display: flex; align-items: center; gap: 8px; }
  .tt .nmr .t15 { flex: 0 1 auto; min-width: 0; }
  .tt .dd { margin-left: auto; font-size: 11.5px; color: var(--text3); white-space: nowrap; }
  .tt .ln { margin-top: 2px; font-size: 12.5px; line-height: 17px; font-weight: 600; color: var(--text3); }
  .tt .ln.ok { color: var(--ok); } .tt .ln.warn { color: var(--warn); } .tt .ln.bad { color: var(--bad); }
  .thumbs { display: flex; gap: 6px; }
  .thumb { width: 32px; height: 46px; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--ring); }

  /* chat bubbles (CrewChatBubble) */
  .m { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .m .col { max-width: 80%; display: flex; flex-direction: column; align-items: flex-start; }
  .who { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text3); margin: 0 0 3px 12px; }
  .bub { background: var(--glass2); color: var(--text); border-radius: 18px; padding: 7px 12px; font-size: 15px; line-height: 20px; }
  .m.r { justify-content: flex-end; } .m.r .bub { background: var(--accent); color: var(--onAccent); }

  /* outlined field, 48dp (OutlinedField) */
  .fld { position: relative; height: 48px; border: 1px solid var(--fieldBorder); border-radius: 10px; padding: 0 14px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: var(--text); background: var(--sheet); }
  .fld.foc { border: 2px solid var(--primary); padding: 0 13px; }
  .fld.err { border: 2px solid var(--bad); padding: 0 13px; }
  .fld .lab { position: absolute; top: -9px; left: 10px; padding: 0 4px; background: var(--sheet); font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text3); }
  .fld.foc .lab { color: var(--accentInk); } .fld.err .lab { color: var(--bad); }
  .fld .cur { display: inline-block; width: 2px; height: 18px; background: var(--primary); vertical-align: -3px; margin-left: 1px; }
  .fld .lead { color: var(--text3); margin-right: 10px; }
  .fe { margin: 5px 4px 0; font-size: 12px; line-height: 16px; color: var(--text3); font-weight: 600; }

function F6(th) {
  const w = 96, f = 96 * 980 / 880, lift = 96 * 262 / 880, rise = 96 * 540 / 880;
  const dd = `<div class="fld dd"><span class="lab">What's wrong</span><span class="ddv">The sign-in details don't work</span><span class="ddc">${ic('chevD', 20, 2)}</span></div>`;
  const det = `<div class="fld ml"><span class="lab">Details</span>Anything that helps them fix it</div><div class="fe"><span>Optional</span><span>0/280</span></div>`;
  const card = `<div class="nd"><div class="tt">Report Habit Hen?</div>
    <div class="b">Rafi sees what you write, not your name. 2 reports send it back to be fixed. If it still won't work once the run starts, report it that night.</div>
    <div class="c">${dd}${sp(14)}${det}</div>
    <div class="br"><span class="tb">Cancel</span><span class="pl">Report</span></div></div>`;
  const dlg = `<div class="scrimL"></div><div class="dw2"><div style="position:relative;padding-top:${rise}px">
    <svg width="${w}" height="${f}" viewBox="0 0 880 980" style="position:absolute;right:10px;top:0;z-index:0">${R.level_robot_antenna}${R.level_robot_head}${R.level_robot_eyes}</svg>
    ${card}
    <svg width="${w}" height="${f}" viewBox="0 0 880 980" style="position:absolute;right:10px;top:${-lift}px;z-index:2;pointer-events:none">${R.level_robot_hands}</svg></div></div>`;
  return page(th, 'Crew 126', lobbyBehind(), { sub: 'Starts in 6 h', end: membersBtn(15), extra: dlg });
}
