*{box-sizing:border-box}body{margin:0;background:#111e28;color:#ecf5fc;font-family:Barlow,system-ui}button{font:inherit;cursor:pointer}header{max-width:1060px;margin:auto;padding:28px 24px 20px;display:flex;justify-content:space-between;gap:20px;align-items:center}header p{color:#b4c8d7;margin:6px 0}h1{font-size:27px;margin:5px 0}.eyebrow{font-size:11px;letter-spacing:2px;color:#9bc8e4}header button{border:1px solid #52728a;border-radius:24px;background:#213c50;color:#ecf5fc;padding:12px 20px}.gallery{display:flex;gap:40px;justify-content:center;padding:12px 24px 32px;flex-wrap:wrap}.label{font-size:12px;letter-spacing:2px;color:#a8c0d1;margin:0 0 12px 4px}.phone{width:390px;height:802px;border:5px solid #3a5061;border-radius:36px;position:relative;overflow:hidden;color:var(--text);background:radial-gradient(ellipse at 35% 8%,var(--washTop),var(--washMiddle) 35%,var(--washLower) 76%,var(--washBottom));isolation:isolate}.shape{position:absolute;z-index:-1;background:var(--shapeFill);border:1px solid var(--shapeRim);width:80px;height:80px;border-radius:20px;transform:rotate(24deg);right:-20px;top:220px}.shape.two{top:450px;left:-35px;transform:rotate(-20deg);border-radius:50%}.status{height:28px;padding:9px 20px 0;display:flex;justify-content:space-between;font-size:10px;font-weight:600}.hud{height:76px;display:flex;align-items:center;padding:8px 16px;gap:10px}.robot{width:56px;height:56px;object-fit:contain;flex-shrink:0}.identity{flex:1;min-width:0}.level{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:7px}.level small{font-size:10px;font-weight:400;color:var(--text2)}.track{height:5px;background:var(--glassBorder);border-radius:8px;overflow:hidden}.fill{width:60%;height:100%;border-radius:8px;background:var(--accentInk);transition:width 800ms cubic-bezier(.2,.8,.2,1)}.xp{font-size:10px;color:var(--text2);margin-top:5px}.tickets{display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:22px;background:var(--glass);color:var(--accentInk);font-size:15px;font-weight:600;margin-left:3px}.tickets svg{width:17px;height:17px}.body{padding:8px 16px 110px}.tabs{display:flex;gap:6px;margin-bottom:20px}.tabs button{background:transparent;border:0;color:var(--text2);padding:10px 14px;border-radius:22px;font-size:13px}.tabs button.active{background:var(--tile);color:var(--tileInk);font-weight:600}.tabs small{margin-left:4px;font-size:10px}.ask{width:100%;border:1px dashed var(--glassBorderStrong);background:var(--shapeFill);border-radius:16px;padding:15px;display:flex;text-align:left;align-items:center;gap:12px;color:var(--text);margin-bottom:22px}.ask .plus{font-size:25px;color:var(--accentInk)}.ask strong{display:block;font-size:15px}.ask small{display:block;color:var(--text2);font-size:12px;margin-top:3px}.section{display:flex;justify-content:space-between;margin:0 0 12px;align-items:center}.section strong{font-size:16px}.section span{font-size:11px;color:var(--text2)}.post{background:var(--glass);border:1px solid var(--glassBorder);border-radius:18px;padding:16px;margin-bottom:12px}.posthead{display:flex;gap:10px;align-items:center}.appicon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--tile);color:var(--tileInk);font-size:21px;font-weight:600}.appname{font-size:15px;font-weight:600}.meta{font-size:11px;color:var(--text2);margin-top:3px}.reward{margin-left:auto;font-size:12px;color:var(--accentInk);font-weight:600}.post p{font-size:14px;line-height:1.45;margin:14px 0;color:var(--text)}.postfooter{display:flex;align-items:center;justify-content:space-between;gap:10px}.postfooter span{font-size:11px;color:var(--text2)}.review{border:0;background:var(--tile);color:var(--tileInk);font-weight:600;border-radius:20px;padding:9px 14px;font-size:12px}.nav{position:absolute;bottom:18px;left:12px;right:12px;border:1px solid var(--glassBorder);background:var(--dock);border-radius:24px;display:flex;justify-content:space-around;padding </style></head><body><header><div><div class="eyebrow">TESTTRACK / CIRCLE</div><h1>The robot itself carries your progress.</h1><p>The head casing lights up with XP · No separate frame or ring</p><div class="demo-status" id="demo-status">Preview: Level 4 · 120 / 200 XP</div></div><button onclick="earn()">Earn XP ↗</button></header><main class="gallery" id="gallery"></main><footer>Interactive design preview. No account data is changed.</footer><script src="../feedback/palette.js"></script><script>
const progressRobot="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"180 95 895 1060\" class=\"progress-robot\" aria-hidden=\"true\" fill=\"none\" role=\"img\" aria-labelledby=\"title desc\">\n  <title id=\"title\">TestTrack \u2014 Test Exchange</title>\n  <desc id=\"desc\">A friendly blue robot holding two checked app cards, joined by exchange arrows.</desc>\n  <!-- Editable paths only. No embedded bitmap. Named groups also drive the Android animation. -->\n  <defs>\n    <linearGradient id=\"blue\" gradientUnits=\"userSpaceOnUse\" x1=\"350\" y1=\"277\" x2=\"910\" y2=\"744\">\n      <stop offset=\"0\" stop-color=\"#32729B\"/><stop offset=\"1\" stop-color=\"#1D5C82\"/>\n    </linearGradient>\n    <linearGradient id=\"deepBlue\" gradientUnits=\"userSpaceOnUse\" x1=\"230\" y1=\"436\" x2=\"1000\" y2=\"985\">\n      <stop offset=\"0\" stop-color=\"#245F84\"/><stop offset=\"1\" stop-color=\"#174866\"/>\n    </linearGradient>\n    <linearGradient id=\"handBlue\" gradientUnits=\"userSpaceOnUse\" x1=\"270\" y1=\"846\" x2=\"960\" y2=\"966\">\n      <stop offset=\"0\" stop-color=\"#80BCDE\"/><stop offset=\"1\" stop-color=\"#5E9DC5\"/>\n    </linearGradient>\n    <linearGradient id=\"coral\" gradientUnits=\"userSpaceOnUse\" x1=\"310\" y1=\"765\" x2=\"568\" y2=\"1056\">\n      <stop offset=\"0\" stop-color=\"#F99B80\"/><stop offset=\"1\" stop-color=\"#EF806B\"/>\n    </linearGradient>\n    <linearGradient id=\"mint\" gradientUnits=\"userSpaceOnUse\" x1=\"710\" y1=\"768\" x2=\"921\" y2=\"1055\">\n      <stop offset=\"0\" stop-color=\"#77D6C2\"/><stop offset=\"1\" stop-color=\"#54C5AC\"/>\n    </linearGradient>\n    <clipPath id=\"top_tip_mask\" clipPathUnits=\"userSpaceOnUse\"><path d=\"M710 652 L810 652 L810 870 L618 870 Z\"/></clipPath>\n    <clipPath id=\"bottom_tip_mask\" clipPathUnits=\"userSpaceOnUse\"><path d=\"M607 997 L539 1180 L440 1180 L440 997 Z\"/></clipPath>\n  </defs>\n  <g id=\"robot\" data-pivot-x=\"627\" data-pivot-y=\"627\">\n    <path id=\"torso\" fill=\"u 4 996 C335 1000 366 969 371 925 C375 878 345 835 302 829 Z\"/>\n      <path id=\"card_left_hand_front\" fill=\"url(#handBlue)\" d=\"M307 847 C276 841 253 873 254 910 C254 943 275 966 307 966 C340 966 368 947 371 923 C374 894 348 852 307 847 Z\"/>\n    </g>\n    <g id=\"card_right\" data-pivot-x=\"814\" data-pivot-y=\"911\">\n      <path id=\"card_right_shell\" fill=\"url(#mint)\" d=\"M752 765 L894 767 C927 768 947 790 943 822 L922 1013 C918 1044 899 1059 866 1056 L731 1041 C701 1038 684 1018 687 987 L701 811 C704 782 724 764 752 765 Z\"/>\n      <path id=\"card_right_screen\" fill=\"#FFFCF1\" d=\"M757 814 L869 817 C887 818 898 831 896 848 L880 984 C879 1000 869 1007 853 1005 L740 993 C726 992 719 981 721 966 L734 838 C736 823 743 814 757 814 Z\"/>\n      <path id=\"check_right\" stroke=\"#17253B\" stroke-width=\"36\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M768 916 L795 939 L854 873\"/>\n      <path id=\"card_right_hand_base\" fill=\"url(#deepBlue)\" d=\"M951 829 C990 834 1023 870 1024 912 C1027 957 1001 992 959 996 C918 1000 887 969 882 925 C878 878 908 835 951 829 Z\"/>\n      <path id=\"card_right_hand_front\" fill=\"url(#handBlue)\" d=\"M946 847 C977 841 1000 873 999 910 C999 943 978 966 946 966 C913 966 885 947 882 923 C879 894 905 852 946 847 Z\"/>\n    </g>\n    <g id=\"exchange_top_front\">\n      <g id=\"top_tip\" clip-path=\"url(#top_tip_mask)\">\n        <path id=\"top_arrow_tip\" fill=\"#32729B\" stroke=\"#FFFCF1\" stroke-width=\"20\" stroke-linejoin=\"round\" d=\"M453 768 C509 704 609 682 683 716 L685 707 Q692 689 706 707 L749 765 Q763 785 742 795 L678 816 Q649 823 652 799 L656 780 C602 761 551 771 516 805 Z\"/>\n      </g>\n    </g>\n    <g id=\"exchange_bottom_front\">\n      <g id=\"bottom_tip\" clip-path=\"url(#bottom_tip_mask)\">\n        <path id=\"bottom_arrow_tip\" fill=\"#32729B\" stroke=\"#FFFCF1\" stroke-width=\"20\" stroke-linejoin=\"round\" d=\"M705 1036 Q717 1030 727 1038 L745 1050 Q761 1063 744 1078 C690 1125 619 1130 566 1107 L562 1117 Q552 1135 538 1118 L497 1059 Q483 1037 508 1029 L573 1010 Q600 1004 594 1030 L588 1048 C627 1063 669 1060 705 1036 Z\"/>\n      </g>\n    </g>\n  </g>\n</svg>\n";
const svg=(path)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
const ticket=svg('<path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"/><path d="M15 7v12" stroke-dasharray="2 3"/>');
const nav=[['Circle','<path d="M21 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 19 0z"/>'],['Groups','<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m2-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"/>'],['Apps','<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'],['Board','<path d="M4 21V13h5v8m0 0V4h6v17m0 0v-11h5v11"/>'],['You','<circle cx="12" cy="8" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/>']];
for(const theme of ['light','dark']){const a=document.createElement('article');a.innerHTML=`<p class="label">${theme.toUpperCase()}</p><div class="phone"><i class="shape"></i><i class="shape two"></i><div class="status"><span>9:41</span><span>••• ▰</span></div><div class="hud"><button class="robot-progress" title="Level 4 · 120 of 200 XP" aria-label="Level 4, 120 of 200 experience. Preview earning XP." onclick="earn()">${progressRobot}<span class="level-badge">4</span></button><div class="identity"><div class="level">Level 4</div><div class="xp">80 exp to level 5</div></div><div class="tickets">${ticket}<span>240</span></div></div><div class="body"><div class="tabs"><button class="active">Feedback</button><button>Activity</button><button>Waiting <small>2</small></button></div><button class="ask"><span class="plus">＋</span><div><strong>Give your app fresh eyes</strong><small>Ask the circle for feedback</small></div><span style="margin-left:auto">↗</span></button><div class="section"><strong>From the circle</strong><span>Newest first</span></div><div class="post"><div class="posthead"><div class="appicon">L</div><div><div class="appname">ListKin</div><div class="meta">Sample developer · Live on Play</div></div><span class="reward">20 tix</span></div><p>Does creating your first shopping list feel simple?</p><div class="postfooter"><span>2 of 5 reviews complete</span><button class="review">Review app ↗</button></div></div><div class="post"><div class="posthead"><div class="appicon">V</div><div><div class="appname">Value Guard</div><div class="meta">Sample developer · Closed testing</div></div><span class="reward">30 tix</span></div><p>Try the app and share what worked well and what could improve.</p><div class="postfooter"><span>1 of 3 reviews complete</span><button class="review">Review app ↗</button></div></div></div><div class="nav">${nav.map(([label,path],i)=>`<div class="${i===0?'selected':''}">${svg(path)}${label}</div>`).join('')}</div><div class="gesture"></div></div>`;Object.entries(palettes[theme]).forEach(([k,v])=>a.style.setProperty('--'+k,v));document.getElementById('gallery').append(a)}
let step=0;const states=[{level:4,xp:120},{level:4,xp:170},{level:4,xp:200},{level:5,xp:30}];function earn(){step=(step+1)%states.length;const state=states[step];document.querySelectorAll('.robot-progress').forEach(e=>{e.querySelector('.earned').style.strokeDasharray=`${state.xp/2} 100`;e.querySelector('.level-badge').textContent=state.level;e.parentElement.querySelector('.level').textContent=`Level ${state.level}`;e.parentElement.querySelector('.xp').textContent=`${200-state.xp} exp to level ${state.level+1}`;e.title=`Level ${state.level} · ${state.xp} of 200 XP`;e.setAttribute('aria-label',e.title+'. Click to preview earning experience.');e.classList.remove('levelup');if(step===3){void e.offsetWidth;e.classList.add('levelup')}});document.getElementById('demo-status').textContent=`Preview: Level ${state.level} · ${state.xp} / 200 XP`}

</script></body></html>
