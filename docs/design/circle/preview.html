<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TestTrack · Circle header concept</title><style>
@font-face{font-family:Barlow;src:url('../../../../app/src/main/res/font/barlow_regular.ttf')}@font-face{font-family:Barlow;src:url('../../../../app/src/main/res/font/barlow_semibold.ttf');font-weight:600}
*{box-sizing:border-box}body{margin:0;background:#111e28;color:#ecf5fc;font-family:Barlow,system-ui}button{font:inherit;cursor:pointer}header{max-width:1060px;margin:auto;padding:28px 24px 20px;display:flex;justify-content:space-between;gap:20px;align-items:center}header p{color:#b4c8d7;margin:6px 0}h1{font-size:27px;margin:5px 0}.eyebrow{font-size:11px;letter-spacing:2px;color:#9bc8e4}header button{border:1px solid #52728a;border-radius:24px;background:#213c50;color:#ecf5fc;padding:12px 20px}.gallery{display:flex;gap:40px;justify-content:center;padding:12px 24px 32px;flex-wrap:wrap}.label{font-size:12px;letter-spacing:2px;color:#a8c0d1;margin:0 0 12px 4px}.phone{width:390px;height:802px;border:5px solid #3a5061;border-radius:36px;position:relative;overflow:hidden;color:var(--text);background:radial-gradient(ellipse at 35% 8%,var(--washTop),var(--washMiddle) 35%,var(--washLower) 76%,var(--washBottom));isolation:isolate}.shape{position:absolute;z-index:-1;background:var(--shapeFill);border:1px solid var(--shapeRim);width:80px;height:80px;border-radius:20px;transform:rotate(24deg);right:-20px;top:220px}.shape.two{top:450px;left:-35px;transform:rotate(-20deg);border-radius:50%}.status{height:28px;padding:9px 20px 0;display:flex;justify-content:space-between;font-size:10px;font-weight:600}.hud{height:76px;display:flex;align-items:center;padding:8px 16px;gap:10px}.robot{width:56px;height:56px;object-fit:contain;flex-shrink:0}.identity{flex:1;min-width:0}.level{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:7px}.level small{font-size:10px;font-weight:400;color:var(--text2)}.track{height:5px;background:var(--glassBorder);border-radius:8px;overflow:hidden}.fill{width:60%;height:100%;border-radius:8px;background:var(--accentInk);transition:width 800ms cubic-bezier(.2,.8,.2,1)}.xp{font-size:10px;color:var(--text2);margin-top:5px}.tickets{display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:22px;background:var(--glass);color:var(--accentInk);font-size:15px;font-weight:600;margin-left:3px}.tickets svg{width:17px;height:17px}.body{padding:8px 16px 110px}.tabs{display:flex;gap:6px;margin-bottom:20px}.tabs button{background:transparent;border:0;color:var(--text2);padding:10px 14px;border-radius:22px;font-size:13px}.tabs button.active{background:var(--tile);color:var(--tileInk);font-weight:600}.tabs small{margin-left:4px;font-size:10px}.ask{width:100%;border:1px dashed var(--glassBorderStrong);background:var(--shapeFill);border-radius:16px;padding:15px;display:flex;text-align:left;align-items:center;gap:12px;color:var(--text);margin-bottom:22px}.ask .plus{font-size:25px;color:var(--accentInk)}.ask strong{display:block;font-size:15px}.ask small{display:block;color:var(--text2);font-size:12px;margin-top:3px}.section{display:flex;justify-content:space-between;margin:0 0 12px;align-items:center}.section strong{font-size:16px}.section span{font-size:11px;color:var(--text2)}.post{background:var(--glass);border:1px solid var(--glassBorder);border-radius:18px;padding:16px;margin-bottom:12px}.posthead{display:flex;gap:10px;align-items:center}.appicon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--tile);color:var(--tileInk);font-size:21px;font-weight:600}.appname{font-size:15px;font-weight:600}.meta{font-size:11px;color:var(--text2);margin-top:3px}.reward{margin-left:auto;font-size:12px;color:var(--accentInk);font-weight:600}.post p{font-size:14px;line-height:1.45;margin:14px 0;color:var(--text)}.postfooter{display:flex;align-items:center;justify-content:space-between;gap:10px}.postfooter span{font-size:11px;color:var(--text2)}.review{border:0;background:var(--tile);color:var(--tileInk);font-weight:600;border-radius:20px;padding:9px 14px;font-size:12px}.nav{position:absolute;bottom:18px;left:12px;right:12px;border:1px solid var(--glassBorder);background:var(--dock);border-radius:24px;display:flex;justify-content:space-around;padding:10px 6px}.nav div{width:58px;text-align:center;font-size:10px;color:var(--text2)}.nav svg{display:block;width:20px;height:20px;margin:0 auto 5px}.nav .selected{color:var(--accentInk);font-weight:600}.gesture{position:absolute;bottom:5px;width:100px;height:4px;border-radius:4px;background:var(--text);left:calc(50% - 50px)}footer{text-align:center;color:#a8c0d1;font-size:12px;padding:0 24px 24px}.robot.celebrate{animation:pop 650ms ease}@keyframes pop{50%{transform:translateY(-4px) rotate(-5deg) scale(1.06)}}@media(prefers-reduced-motion:reduce){.fill{transition:none}.robot.celebrate{animation:none}}@media(max-width:440px){.phone{width:calc(100vw - 30px)}.gallery{padding:12px 10px}header{display:block}header button{margin-top:12px}}

.hud{justify-content:space-between}.robot-progress{position:relative;width:58px;height:60px;flex-shrink:0;border:0;padding:0;background:transparent;color:var(--text);cursor:pointer;overflow:visible}.robot-progress img{position:absolute;top:0;left:0;width:54px;height:54px;object-fit:contain}.robot-base{filter:grayscale(1);opacity:.3}.robot-color{clip-path:inset(var(--unfilled,40%) 0 0 0);transition:clip-path 850ms cubic-bezier(.2,.8,.2,1)}.level-badge{position:absolute;bottom:0;right:0;min-width:24px;height:24px;padding:0 4px;display:grid;place-items:center;background:var(--tileInk);color:var(--onSelected);border:2px solid var(--washTop);border-radius:7px;font-size:12px;font-weight:600;box-shadow:0 2px 5px #0002}.robot-progress.levelup{animation:pop 650ms ease}.hud .tickets{margin-left:auto}.demo-status{margin-top:8px;color:#b4c8d7;font-size:13px}.robot-progress:focus-visible{outline:2px solid var(--accentInk);outline-offset:4px;border-radius:10px}@media(prefers-reduced-motion:reduce){.robot-color{transition:none}.robot-progress.levelup{animation:none}}

.robot-progress{width:48px;height:48px}.robot-progress img{width:34px;height:34px;top:6px;left:7px;filter:none;opacity:1}.robot-progress .progress-frame{position:absolute;inset:0;width:48px;height:48px;overflow:visible;transform:none}.progress-frame rect{fill:none;stroke-width:2.5}.progress-frame .rail{stroke:var(--glassBorderStrong);opacity:.45}.progress-frame .earned{stroke:var(--accentInk);stroke-linecap:round;stroke-dasharray:60 100;transition:stroke-dasharray 850ms cubic-bezier(.2,.8,.2,1)}.level-badge{height:18px;min-width:18px;font-size:10px;right:-2px;bottom:-3px;border-radius:6px}.identity .level{margin:0;font-size:14px}.identity .xp{margin-top:2px;font-size:11px}.hud{gap:11px}.hud .tickets{margin-left:0}@media(prefers-reduced-motion:reduce){.progress-frame .earned{transition:none}}

.robot-progress{width:48px;height:54px}.progress-robot{display:block;width:48px;height:54px;overflow:visible}.progress-robot .earned{transition:stroke-dasharray 850ms cubic-bezier(.2,.8,.2,1)}.level-badge{right:0;bottom:-1px}.robot-progress.levelup .progress-robot{filter:drop-shadow(0 0 3px var(--accentInk))}@media(prefers-reduced-motion:reduce){.progress-robot .earned{transition:none}}

.robot-progress{width:52px;height:56px}.progress-robot{width:52px;height:56px}.xp-energy{transition:width 850ms cubic-bezier(.2,.8,.2,1)}@media(prefers-reduced-motion:reduce){.xp-energy{transition:none}}

.robot-progress{width:56px;height:64px}.progress-robot{width:56px;height:64px}.xp-energy{transition:y 850ms cubic-bezier(.2,.8,.2,1),height 850ms cubic-bezier(.2,.8,.2,1)}@media(prefers-reduced-motion:reduce){.xp-energy{transition:none}}
.xp-outline{transition:stroke-dasharray 850ms ease}@media(prefers-reduced-motion:reduce){.xp-outline{transition:none}}</style></head><body><header><div><div class="eyebrow">TESTTRACK / CIRCLE</div><h1>One level badge. Held by your robot.</h1><p>Both hands hold the level · XP travels around the badge edge</p><div class="demo-status" id="demo-status">Preview: Level 4 · 120 / 200 XP</div></div><button onclick="earn()">Earn XP ↗</button></header><main class="gallery" id="gallery"></main><footer>Interactive design preview. No account data is changed.</footer><script src="../feedback/palette.js"></script><script>
const progressRobot="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"185 110 880 980\" fill=\"none\" role=\"img\" aria-labelledby=\"title desc\" class=\"progress-robot\" aria-hidden=\"true\">\n  <title id=\"title\">TestTrack \u2014 Test Exchange</title>\n  <desc id=\"desc\">A friendly blue robot holding two checked app cards, joined by exchange arrows.</desc>\n  \n  <defs>\n    <linearGradient id=\"blue\" gradientUnits=\"userSpaceOnUse\" x1=\"350\" y1=\"277\" x2=\"910\" y2=\"744\">\n      <stop offset=\"0\" stop-color=\"#32729B\" /><stop offset=\"1\" stop-color=\"#1D5C82\" />\n    </linearGradient>\n    <linearGradient id=\"deepBlue\" gradientUnits=\"userSpaceOnUse\" x1=\"230\" y1=\"436\" x2=\"1000\" y2=\"985\">\n      <stop offset=\"0\" stop-color=\"#245F84\" /><stop offset=\"1\" stop-color=\"#174866\" />\n    </linearGradient>\n    <linearGradient id=\"handBlue\" gradientUnits=\"userSpaceOnUse\" x1=\"270\" y1=\"846\" x2=\"960\" y2=\"966\">\n      <stop offset=\"0\" stop-color=\"#80BCDE\" /><stop offset=\"1\" stop-color=\"#5E9DC5\" />\n    </linearGradient>\n    <linearGradient id=\"coral\" gradientUnits=\"userSpaceOnUse\" x1=\"310\" y1=\"765\" x2=\"568\" y2=\"1056\">\n      <stop offset=\"0\" stop-color=\"#F99B80\" /><stop offset=\"1\" stop-color=\"#EF806B\" />\n    </linearGradient>\n    <linearGradient id=\"mint\" gradientUnits=\"userSpaceOnUse\" x1=\"710\" y1=\"768\" x2=\"921\" y2=\"1055\">\n      <stop offset=\"0\" stop-color=\"#77D6C2\" /><stop offset=\"1\" stop-color=\"#54C5AC\" />\n    </linearGradient>\n    <clipPath id=\"top_tip_mask\" clipPathUnits=\"userSpaceOnUse\"><path d=\"M710 652 L810 652 L810 870 L618 870 Z\" /></clipPath>\n    <clipPath id=\"bottom_tip_mask\" clipPathUnits=\"userSpaceOnUse\"><path d=\"M607 997 L539 1180 L440 1180 L440 997 Z\" /></clipPath>\n  </defs>\n  <g id=\"robot\" data-pivot-x=\"627\" data-pivot-y=\"627\">\n    <path id=\"torso\" fill=\"url(#deepBlue)\" d=\"M384 784 C426 730 471 713 520 710 L728 710 C778 715 824 736 866 784 L888 946 C824 1005 735 1031 627 1031 C518 1031 428 1005 363 946 Z\" />\n    <g id=\"head_rig\" data-pivot-x=\"627\" data-pivot-y=\"530\">\n    <g id=\"antenna\" data-pivot-x=\"627\" data-pivot-y=\"278\">\n      <path fill=\"#1D5C82\" d=\"M603 227 H650 V295 H603 Z\" />\n      <path fill=\"url(#coral)\" d=\"M687 187 A60 60 0 1 1 567 187 A60 60 0 1 1 687 187 Z\" />\n      <path fill=\"#FFFFFF\" d=\"M618 164 A14 14 0 1 1 590 164 A14 14 0 1 1 618 164 Z\" />\n    </g>\n    <g id=\"ears\">\n      <path fill=\"url(#deepBlue)\" d=\"M309 436 C250 430 215 483 215 546 C215 609 249 659 309 654 L330 624 V465 Z\" />\n      <path fill=\"url(#deepBlue)\" d=\"M944 436 C1003 430 1039 483 1039 546 C1039 609 1004 659 944 654 L923 624 V465 Z\" />\n      <path fill=\"#6CA9CF\" d=\"M267 546 A25 59 0 1 1 217 546 A25 59 0 1 1 267 546 Z\" />\n      <path fill=\"#6CA9CF\" d=\"M1037 546 A25 59 0 1 1 987 546 A25 59 0 1 1 1037 546 Z\" />\n    </g>\n    <path id=\"head\" fill=\"url(#blue)\" d=\"M627 277 C428 277 332 328 302 452 C286 514 283 608 307 656 C332 718 409 743 627 743 C845 743 922 718 947 656 C971 608 968 514 952 452 C922 328 826 277 627 277 Z\" />\n    <path id=\"face\" fill=\"#FFFCF1\" d=\"M627 372 C481 372 399 387 366 455 C346 492 341 550 350 590 C363 656 397 677 627 677 C857 677 891 656 904 590 C913 550 908 492 888 455 C855 387 773 372 627 372 Z\" />\n    <g id=\"eyes\" data-pivot-x=\"627\" data-pivot-y=\"529\">\n      <g id=\"eye_blink\" data-pivot-x=\"627\" data-pivot-y=\"529\">\n      <path fill=\"#17253B\" d=\"M542 529 A61 61 0 1 1 420 529 A61 61 0 1 1 542 529 Z\" />\n      <path fill=\"#17253B\" d=\"M833 529 A61 61 0 1 1 711 529 A61 61 0 1 1 833 529 Z\" />\n      <path fill=\"#FFFFFF\" d=\"M515 504 A19 19 0 1 1 477 504 A19 19 0 1 1 515 504 Z\" />\n      <path fill=\"#FFFFFF\" d=\"M805 504 A19 19 0 1 1 767 504 A19 19 0 1 1 805 504 Z\" />\n      </g>\n    </g>\n    <path id=\"smile\" stroke=\"#17253B\" stroke-width=\"31\" stroke-linecap=\"round\" d=\"M576 594 C602 620 651 620 677 594\" />\n    </g>\n    <g id=\"level-plaque\">\n<rect x=\"302\" y=\"752\" width=\"650\" height=\"306\" rx=\"90\" fill=\"#174866\" />\n<rect x=\"327\" y=\"777\" width=\"600\" height=\"256\" rx=\"66\" fill=\"#FFFCF1\" />\n<rect x=\"316\" y=\"766\" width=\"622\" height=\"278\" rx=\"78\" fill=\"none\" stroke=\"#80BCDE\" stroke-width=\"19\" opacity=\".5\" />\n<rect class=\"xp-outline\" x=\"316\" y=\"766\" width=\"622\" height=\"278\" rx=\"78\" pathLength=\"100\" fill=\"none\" stroke=\"#54C5AC\" stroke-width=\"19\" stroke-linecap=\"round\" stroke-dasharray=\"60 100\" />\n\n<text class=\"robot-level\" x=\"627\" y=\"914\" dominant-baseline=\"middle\" text-anchor=\"middle\" fill=\"#17253B\" font-family=\"Barlow,sans-serif\" font-size=\"186\" font-weight=\"600\">4</text>\n</g><path id=\"card_left_hand_base\" fill=\"url(#deepBlue)\" d=\"M302 829 C263 834 230 870 229 912 C226 957 252 992 294 996 C335 1000 366 969 371 925 C375 878 345 835 302 829 Z\" />\n      <path id=\"card_left_hand_front\" fill=\"url(#handBlue)\" d=\"M307 847 C276 841 253 873 254 910 C254 943 275 966 307 966 C340 966 368 947 371 923 C374 894 348 852 307 847 Z\" />\n    <path id=\"card_right_hand_base\" fill=\"url(#deepBlue)\" d=\"M951 829 C990 834 1023 870 1024 912 C1027 957 1001 992 959 996 C918 1000 887 969 882 925 C878 878 908 835 951 829 Z\" />\n      <path id=\"card_right_hand_front\" fill=\"url(#handBlue)\" d=\"M946 847 C977 841 1000 873 999 910 C999 943 978 966 946 966 C913 966 885 947 882 923 C879 894 905 852 946 847 Z\" />\n    </g>\n</svg>";
const svg=(path)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
const ticket=svg('<path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"/><path d="M15 7v12" stroke-dasharray="2 3"/>');
const nav=[['Circle','<path d="M21 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 19 0z"/>'],['Groups','<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m2-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"/>'],['Apps','<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'],['Board','<path d="M4 21V13h5v8m0 0V4h6v17m0 0v-11h5v11"/>'],['You','<circle cx="12" cy="8" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/>']];
for(const theme of ['light','dark']){const a=document.createElement('article');a.innerHTML=`<p class="label">${theme.toUpperCase()}</p><div class="phone"><i class="shape"></i><i class="shape two"></i><div class="status"><span>9:41</span><span>••• ▰</span></div><div class="hud"><button class="robot-progress" title="Level 4 · 120 of 200 XP" aria-label="Level 4, 120 of 200 experience. Preview earning XP." onclick="earn()">${progressRobot}</button><div class="identity"><div class="level">Level 4</div><div class="xp">80 exp to level 5</div></div><div class="tickets">${ticket}<span>240</span></div></div><div class="body"><div class="tabs"><button class="active">Feedback</button><button>Activity</button><button>Waiting <small>2</small></button></div><button class="ask"><span class="plus">＋</span><div><strong>Give your app fresh eyes</strong><small>Ask the circle for feedback</small></div><span style="margin-left:auto">↗</span></button><div class="section"><strong>From the circle</strong><span>Newest first</span></div><div class="post"><div class="posthead"><div class="appicon">L</div><div><div class="appname">ListKin</div><div class="meta">Sample developer · Live on Play</div></div><span class="reward">20 tix</span></div><p>Does creating your first shopping list feel simple?</p><div class="postfooter"><span>2 of 5 reviews complete</span><button class="review">Review app ↗</button></div></div><div class="post"><div class="posthead"><div class="appicon">V</div><div><div class="appname">Value Guard</div><div class="meta">Sample developer · Closed testing</div></div><span class="reward">30 tix</span></div><p>Try the app and share what worked well and what could improve.</p><div class="postfooter"><span>1 of 3 reviews complete</span><button class="review">Review app ↗</button></div></div></div><div class="nav">${nav.map(([label,path],i)=>`<div class="${i===0?'selected':''}">${svg(path)}${label}</div>`).join('')}</div><div class="gesture"></div></div>`;Object.entries(palettes[theme]).forEach(([k,v])=>a.style.setProperty('--'+k,v));document.getElementById('gallery').append(a)}
let step=0;const states=[{level:4,xp:120},{level:4,xp:170},{level:4,xp:200},{level:5,xp:30}];function earn(){step=(step+1)%states.length;const state=states[step];document.querySelectorAll('.robot-progress').forEach(e=>{e.querySelector('.xp-outline').style.strokeDasharray=`${state.xp/2} 100`;e.querySelector('.robot-level').textContent=state.level;e.parentElement.querySelector('.level').textContent=`Level ${state.level}`;e.parentElement.querySelector('.xp').textContent=`${200-state.xp} exp to level ${state.level+1}`;e.title=`Level ${state.level} · ${state.xp} of 200 XP`;e.setAttribute('aria-label',e.title+'. Click to preview earning experience.');e.classList.remove('levelup');if(step===3){void e.offsetWidth;e.classList.add('levelup')}});document.getElementById('demo-status').textContent=`Preview: Level ${state.level} · ${state.xp} / 200 XP`}

</script></body></html>
