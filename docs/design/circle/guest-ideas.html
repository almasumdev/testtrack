" />\n    </g>\n    <g id=\"level-plaque\">\n<rect x=\"302\" y=\"752\" width=\"650\" height=\"306\" rx=\"90\" fill=\"var(--badgeFill)\" />\n<rect x=\"327\" y=\"777\" width=\"600\" height=\"256\" rx=\"66\" fill=\"var(--glass)\" />\n<rect class=\"xp-rail\" x=\"316\" y=\"766\" width=\"622\" height=\"278\" rx=\"78\" fill=\"none\" stroke=\"var(--glassBorderStrong)\" stroke-width=\"19\" opacity=\".5\" />\n<path class=\"xp-outline\" d=\"M316 905 V844 A78 78 0 0 1 394 766 H860 A78 78 0 0 1 938 844 V966 A78 78 0 0 1 860 1044 H394 A78 78 0 0 1 316 966 V905\" pathLength=\"100\" fill=\"none\" stroke=\"var(--ok)\" stroke-width=\"19\" stroke-linecap=\"round\" stroke-dasharray=\"60 100\"/>\n\n<text class=\"guest-check\" x=\"627\" y=\"910\" dominant-baseline=\"middle\" text-anchor=\"middle\" fill=\"var(--accentInk)\" font-family=\"Barlow,sans-serif\" font-size=\"150\" font-weight=\"600\">TT</text><text class=\"robot-level\" x=\"627\" y=\"914\" dominant-baseline=\"middle\" text-anchor=\"middle\" fill=\"var(--text)\" font-family=\"Barlow,sans-serif\" font-size=\"186\" font-weight=\"600\">4</text>\n</g><path id=\"card_left_hand_base\" fill=\"url(#deepBlue)\" d=\"M302 829 C263 834 230 870 229 912 C226 957 252 992 294 996 C335 1000 366 969 371 925 C375 878 345 835 302 829 Z\" />\n      <path id=\"card_left_hand_front\" fill=\"url(#handBlue)\" d=\"M307 847 C276 841 253 873 254 910 C254 943 275 966 307 966 C340 966 368 947 371 923 C374 894 348 852 307 847 Z\" />\n    <path id=\"card_right_hand_base\" fill=\"url(#deepBlue)\" d=\"M951 829 C990 834 1023 870 1024 912 C1027 957 1001 992 959 996 C918 1000 887 969 882 925 C878 878 908 835 951 829 Z\" />\n      <path id=\"card_right_hand_front\" fill=\"url(#handBlue)\" d=\"M946 847 C977 841 1000 873 999 910 C999 943 978 966 946 966 C913 966 885 947 882 923 C879 894 905 852 946 847 Z\" />\n    </g>\n</svg>";

function symbol(paths){return `<g class="guest-symbol" fill="none" stroke="var(--accentInk)" stroke-width="23" stroke-linecap="round" stroke-linejoin="round">${paths}</g>`}
function icon(idea,suffix){let svg=source.replace(/<text class="guest-check"[\s\S]*?<\/text>/,symbol(idea.paths));let ids=[...svg.matchAll(/id="([^"]+)"/g)].map(m=>m[1]);ids.forEach(k=>svg=svg.replaceAll('id="'+k+'"','id="'+k+'-'+suffix+'"').replaceAll('url(#'+k+')','url(#'+k+'-'+suffix+')'));return svg.replace(/id="head_rig-[^"]+"/,'class="head-motion"').replace(/id="eyes-[^"]+"/,'class="eye-motion"').replace(/id="antenna-[^"]+"/,'class="antenna-motion"')}
ideas.forEach((idea,i)=>{let el=document.createElement('article');el.className='state';el.id=idea.id;el.innerHTML=`<div class="stage guest"><div class="large">${icon(idea,idea.id+'big')}</div><div class="size-label">ACTUAL SIZE ↓</div><div class="hud"><div class="mini">${icon(idea,idea.id+'small')}</div><div class="copy"><div class="title">TestTrack</div><div class="subtitle">Guest</div></div></div></div><div class="caption"><div class="meaning">${idea.meaning}</div><h2>${i+1}. ${idea.name}</h2><p>${idea.note}</p><button onclick="toggle('${idea.id}')">Preview sign-in transition</button></div>`;document.getElementById('grid').append(el);el.querySelectorAll('.xp-outline').forEach(e=>e.style.strokeDasharray='60 100')});
function toggle(id){const el=document.getElementById(id),stage=el.querySelector('.stage');const signed=stage.classList.contains('guest');stage.classList.toggle('guest',!signed);stage.classList.toggle('member',signed);el.querySelector('.title').textContent=signed?'Level 4':'TestTrack';el.querySelector('.subtitle').textContent=signed?'80 exp to level 5':'Guest';el.querySelector('.caption button').textContent=signed?'Back to guest':'Preview sign-in transition'}function toggleAll(){ideas.forEach(i=>toggle(i.id))}function theme(t){Object.entries(palettes[t]).forEach(([k,v])=>document.getElementById('grid').style.setProperty('--'+k,v));document.getElementById('light').classList.toggle('active',t==='light');document.getElementById('dark').classList.toggle('active',t==='dark')}theme('light');
