<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TestTrack dialogs: now and new</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "BarlowApp"; font-weight: 400; src: url("../../../app/src/main/res/font/barlow_regular.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 500; src: url("../../../app/src/main/res/font/barlow_medium.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 600; src: url("../../../app/src/main/res/font/barlow_semibold.ttf"); }
  @font-face { font-family: "BarlowApp"; font-weight: 700; src: url("../../../app/src/main/res/font/barlow_bold.ttf"); }
  @font-face { font-family: "PlexApp"; font-weight: 600; src: url("../../../app/src/main/res/font/plexmono_semibold.ttf"); }

  /* OceanLight / OceanDark, ui/theme/Tokens.kt. No new tokens. */
  .light {
    --bg:#F7FCFF; --text:#142F43; --text2:#203A4E; --text3:#223D50; --text4:#59758A;
    --glass:#F2F9FD; --glass2:#DFEDF6; --glassBorder:#B7D1E2; --glassBorderStrong:#789AAF; --hair:#B7D1E2;
    --accent:#3A5B73; --onAccent:#FFFFFF; --accentInk:#22394B; --tile:#DCE6EE; --tileInk:#3A5B73;
    --ok:#246B59; --okBg:rgba(36,107,89,.12); --warn:#8A611C; --warnBg:rgba(154,110,36,.12);
    --bad:#9E3B2E; --badBg:rgba(158,59,46,.12); --onBad:#FFFFFF;
    --fieldBorder:#789AAF; --cardLine:#E1ECF3; --sheet:#FFFFFF; --ring:rgba(20,47,67,.14);
    --tabSelected:#2E4E66; --primary:#3A5B73; --onPrimary:#FFFFFF; --scrim:rgba(20,34,48,.46); --sk:#E3EDF4; --gold:#9A7B1F; --leafAccentSoft:rgba(74,114,144,.16);
  }
  .dark {
    --bg:#0F1011; --text:#ECEEF0; --text2:#BCC1C6; --text3:#9DA3A9; --text4:#757C82;
    --glass:#1C1E20; --glass2:#292C2F; --glassBorder:#383C41; --glassBorderStrong:#666D74; --hair:#2B2E32;
    --accent:#4A7290; --onAccent:#FFFFFF; --accentInk:#93B3CA; --tile:#2A2D31; --tileInk:#A2BED2;
    --ok:#83D8C4; --okBg:rgba(131,216,196,.12); --warn:#D8B774; --warnBg:rgba(216,183,116,.14);
    --bad:#E4938A; --badBg:rgba(228,147,138,.15); --onBad:#3F0D06;
    --fieldBorder:#666D74; --cardLine:#2D3034; --sheet:#1C1E20; --ring:rgba(255,255,255,.16);
    --tabSelected:#B6CCDC; --primary:#93B3CA; --onPrimary:#0F1011; --scrim:rgba(0,0,0,.6); --sk:#212427; --gold:#E3A93C; --leafAccentSoft:#2A2D31;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #D9E0E5; font-family: "BarlowApp", "Barlow", system-ui, sans-serif; color: #1B2B36; }
  .top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 12px 28px; background: #D9E0E5; border-bottom: 1px solid #C3CDD4; flex-wrap: wrap; }
  .top h1 { margin: 0 14px 0 0; font-size: 20px; font-weight: 700; }
  .top a { font: 600 15px/20px "BarlowApp", "Barlow", sans-serif; padding: 8px 18px; border-radius: 20px; border: 1px solid #B3C0C9; background: #F4F7F9; color: #2D4A5F; text-decoration: none; }
  .doc { padding: 6px 28px 80px; }
  .part { font-size: 30px; font-weight: 700; margin: 40px 0 14px 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 30px 40px; align-items: flex-start; }
  .pair { display: flex; flex-direction: column; gap: 8px; }
  .lbl { font-size: 15px; font-weight: 700; margin-left: 4px; display: flex; gap: 8px; align-items: center; }
  .lbl .k { display: inline-grid; place-items: center; min-width: 34px; height: 24px; padding: 0 7px; border-radius: 8px; background: #2D4A5F; color: #fff; font-size: 13px; flex: none; }
  .lbl .f { font-size: 12px; font-weight: 600; color: #6A7781; }
  .lbl .cp { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #F3E3BF; color: #6B4C10; }
  .two { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .tag { font-size: 12px; font-weight: 700; color: #6A7781; margin-left: 6px; text-transform: uppercase; letter-spacing: .06em; }
  .tag.n { color: #2D4A5F; }

  /* a dialog over a dimmed page */
  .stage { width: 360px; flex: 1; min-height: 360px; background: var(--bg); color: var(--text); border-radius: 22px; border: 1px solid #B9C5CE; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 34px 0 30px; }
  .dark.stage, .dark.phone { border-color: #3A4046; }
  .stage .bgp { position: absolute; inset: 0; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .stage .bgp i { display: block; background: var(--sk); border-radius: 10px; }
  .stage .scr { position: absolute; inset: 0; background: var(--scrim); }
  .dw { position: relative; z-index: 2; margin: 0 22px; }

  /* NOW: Ask as it is (CommonDialogs.kt) */
  .od { background: var(--glass); border-radius: 18px; padding: 18px 16px 14px; position: relative; z-index: 1; }
  .od h3 { margin: 0; font-size: 16px; line-height: 21px; font-weight: 700; }
  .od .b { margin: 6px 0 0; font-size: 13.5px; line-height: 19.5px; color: var(--text2); }
  .od .c { margin-top: 12px; }
  .od .c.nb { margin-top: 8px; }
  .od .bt { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-top: 14px; }
  .od .db { min-height: 52px; border-radius: 26px; padding: 0 18px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; }
  .od .db.o { border: 1px solid var(--hair); color: var(--accentInk); }
  .od .db.f { background: var(--accent); color: var(--onAccent); }
  .od .db.d { background: var(--bad); color: var(--onBad); }
  .od .db.off { opacity: .5; }
  .od .ia { display: inline-flex; min-height: 32px; align-items: center; padding: 0 8px; font-size: 14px; font-weight: 700; color: var(--accentInk); margin-left: -8px; }
  .ost { display: flex; gap: 8px; font-size: 13.5px; line-height: 19.5px; color: var(--text2); }
  .ost .n { min-width: 12px; font-weight: 600; color: var(--text4); }
  .ost + .ost { margin-top: 4px; }
  .onote { font-size: 12px; line-height: 16px; color: var(--text4); margin-top: 8px; }
  .m3f { height: 56px; border: 1px solid var(--fieldBorder); border-radius: 4px; padding: 0 12px 0 16px; display: flex; align-items: center; font-size: 16px; color: var(--text4); position: relative; }
  .m3f .lab { position: absolute; top: -9px; left: 12px; padding: 0 4px; background: var(--glass); font-size: 12px; color: var(--text3); }
  .m3f .ch { margin-left: auto; color: var(--text3); }

  /* NEW: the one dialog, compact */
  .nd { background: var(--sheet); border-radius: 12px; padding: 16px 16px 12px; position: relative; z-index: 1; }
  .nd .tt { font-size: 16px; line-height: 20px; font-weight: 700; }
  .nd .tt .ti { display: inline-block; vertical-align: -3px; margin-right: 7px; color: var(--accentInk); }
  .nd .tt .ti.warn { color: var(--warn); }
  .nd .b { margin-top: 6px; font-size: 13.5px; line-height: 19px; color: var(--text2); }
  .nd .c { margin-top: 12px; }
  .nd .c.top { margin-top: 0; }
  .nd .nt { margin-top: 8px; font-size: 12.5px; line-height: 17px; color: var(--text4); }
  .fld.dd { padding-right: 8px; }
  .fld.dd .ddv { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fld.dd .ddv.ph { color: var(--text4); font-weight: 400; }
  .fld.dd .ddc { width: 32px; height: 32px; display: grid; place-items: center; color: var(--text3); flex: none; }
  .ddm { position: absolute; left: 0; right: 0; top: 52px; z-index: 5; max-height: 264px; overflow: hidden; background: var(--sheet); border: 1px solid var(--glassBorder); border-radius: 10px; padding: 4px; box-shadow: 0 8px 24px rgba(16,47,70,.18); }
  .dark .ddm { box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .ddr { min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 12px; border-radius: 8px; font-size: 14px; line-height: 18px; font-weight: 500; color: var(--text); }
  .ddr span:first-child { flex: 1; }
  .ddr.on { background: var(--leafAccentSoft); color: var(--tabSelected); font-weight: 700; }
  .ddr .ck { color: var(--tabSelected); display: grid; place-items: center; flex: none; }
  .ddbar { position: absolute; right: 3px; top: 70px; width: 3px; height: 70px; border-radius: 2px; background: var(--glassBorderStrong); opacity: .7; }
  .stage.tall { min-height: 560px; justify-content: flex-start; padding-top: 70px; }
  .fc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; font-size: 13px; line-height: 17px; font-weight: 600; white-space: nowrap; }
  .fchip.quiet { background: var(--glass2); color: var(--text3); } .fchip.ok { background: var(--okBg); color: var(--ok); }
  .fchip.bad { background: var(--badBg); color: var(--bad); } .fchip.warn { background: var(--warnBg); color: var(--warn); }
  .fchip.tile { background: var(--tile); color: var(--tileInk); }
  .fchip.sm { font-size: 11.5px; line-height: 16px; padding: 3px 9px 3px 8px; gap: 4px; }
  .fchip.sm svg { width: 12px; height: 12px; }
  .ph { display: flex; align-items: center; gap: 12px; }
  .ph .nm { font-size: 16px; line-height: 20px; font-weight: 700; }
  .ph .em { margin-top: 2px; font-size: 13px; line-height: 17px; color: var(--text3); }
  .out .av, .out .apanel { opacity: .5; }
  .apanel { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 10px; border-radius: 10px; background: var(--bg); }
  .dark .apanel { background: var(--glass2); }
  .prow { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; min-height: 64px; border: 1px solid var(--cardLine); border-radius: 10px; }
  .prow .l { font-size: 14.5px; line-height: 19px; font-weight: 700; color: var(--accentInk); }
  .prow .s2 { margin-top: 1px; font-size: 12.5px; line-height: 16px; color: var(--text3); }
  .prow.busy { opacity: .9; }
  .photo { background: radial-gradient(circle at 50% 38%, #F2C9A5 0 22%, transparent 23%), radial-gradient(ellipse at 50% 100%, #3E6A8A 0 42%, transparent 43%), linear-gradient(160deg, #A9C7DA, #E7EEF2); }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; display: inline-block; }
  .pl .spin { width: 15px; height: 15px; margin-right: 8px; }
  /* button rows: k-text, k-pill (recommended), k-full, k-eq */
  .br { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 12px; margin-right: -6px; }
  .br.st { flex-direction: column; align-items: flex-end; gap: 2px; }
  .br .alt { margin-right: auto; margin-left: -10px; }
  .br.st .alt { margin: 0; }
  .tb { min-height: 40px; padding: 0 10px; display: inline-flex; align-items: center; font-size: 14.5px; font-weight: 700; color: var(--accentInk); border-radius: 10px; white-space: nowrap; }
  .tb.q { color: var(--text3); }
  .tb.bad { color: var(--bad); }
  .tb.off { color: var(--text4); opacity: .7; }
  .pl { min-height: 40px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 14.5px; font-weight: 700; border-radius: 10px; background: var(--primary); color: var(--onPrimary); white-space: nowrap; margin-left: 4px; }
  .pl.bad { background: var(--bad); color: var(--onBad); }
  .pl.off { background: color-mix(in srgb, var(--text) 12%, transparent); color: color-mix(in srgb, var(--text) 38%, transparent); }
  .br.k-pill { margin-right: 0; }
  .br.k-pill.st .pl { margin-left: 0; }
  .bf { margin-top: 16px; display: flex; flex-direction: column; align-items: stretch; gap: 2px; }
  .bf .pl { min-height: 44px; margin: 0; border-radius: 12px; }
  .bf .tb { justify-content: center; min-height: 36px; }
  .be { margin-top: 16px; display: flex; gap: 8px; }
  .be.st { flex-direction: column; }
  .be > span { flex: 1; min-height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 12px; font-size: 14.5px; font-weight: 600; }
  .be .s { background: var(--glass2); color: var(--text); }
  .be .p { background: var(--primary); color: var(--onPrimary); }
  .be .d { background: var(--bad); color: var(--onBad); }
  .be .off { background: color-mix(in srgb, var(--text) 12%, transparent); color: color-mix(in srgb, var(--text) 38%, transparent); }
  .bealt { display: flex; justify-content: center; margin-top: 4px; }
  .nst { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 19px; color: var(--text2); }
  .nst .n { width: 20px; height: 20px; border-radius: 50%; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; font-size: 11.5px; font-weight: 700; flex: none; }
  .nst + .nst { margin-top: 6px; }
  .opt { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; margin: 26px 0 10px 4px; }
  .opt .rec { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #2D4A5F; color: #fff; }
  .stage.sm { min-height: 0; padding: 26px 0 22px; }
  .stage.sm .scr { background: var(--scrim); }
  /* shared parts drawn inside */
  .fld { position: relative; min-height: 48px; border: 1px solid var(--glassBorderStrong); border-radius: 10px; padding: 0 14px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: var(--text); }
  .fld.foc { border: 2px solid var(--primary); padding: 0 13px; }
  .fld.ml { align-items: flex-start; padding-top: 13px; min-height: 84px; color: var(--text4); font-weight: 400; }
  .fld .lab { position: absolute; top: -9px; left: 10px; padding: 0 4px; background: var(--sheet); font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text3); }
  .od .fld .lab { background: var(--glass); }
  .fld.foc .lab { color: var(--accentInk); }
  .fld .cur { display: inline-block; width: 2px; height: 18px; background: var(--primary); vertical-align: -3px; margin-left: 1px; }
  .fe { display: flex; justify-content: space-between; margin: 5px 4px 0; font-size: 12px; line-height: 16px; color: var(--text3); font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { min-height: 32px; border-radius: 16px; padding: 0 13px; display: inline-flex; align-items: center; font-size: 13.5px; font-weight: 700; color: var(--accentInk); border: 1.5px solid var(--glassBorderStrong); background: var(--bg); }
  .pill.on { background: var(--tile); border-color: transparent; }
  .av { border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; }
  .light .nt2 { background: hsl(var(--h) 45% 89%); color: hsl(var(--h) 50% 32%); }
  .dark .nt2 { background: hsl(var(--h) 30% 18%); color: hsl(var(--h) 55% 76%); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 8px; border-radius: 99px; font-size: 11.5px; line-height: 16px; font-weight: 600; white-space: nowrap; }
  .chip.tile { background: var(--tile); color: var(--tileInk); } .chip.quiet { background: var(--glass2); color: var(--text3); }
  .approw { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; background: var(--bg); }
  .stars { display: flex; justify-content: center; gap: 4px; }
  .stars span { width: 48px; height: 48px; display: grid; place-items: center; color: var(--gold); }
  .badge { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--onAccent); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--sheet); }
  .od .badge { box-shadow: 0 0 0 2px var(--glass); }

  /* full-screen pages */
  .phone { width: 360px; height: 760px; background: var(--bg); color: var(--text); border-radius: 26px; overflow: hidden; border: 1px solid #B9C5CE; position: relative; display: flex; flex-direction: column; }
  .sbar { height: 26px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 18px 0 22px; font-size: 13px; font-weight: 600; }
  .sbar .bat { width: 20px; height: 10px; border-radius: 3px; border: 1.5px solid currentColor; position: relative; }
  .sbar .bat::after { content: ""; position: absolute; inset: 1px 3px 1px 1px; background: currentColor; border-radius: 1px; }
  .gest { height: 20px; flex: none; display: grid; place-items: center; }
  .gest i { width: 108px; height: 4px; border-radius: 2px; background: var(--text4); opacity: .55; }
  .pbar { height: 64px; flex: none; display: flex; align-items: center; }
  .pbar .back { width: 48px; height: 48px; display: grid; place-items: center; margin-left: 4px; color: var(--text); flex: none; }
  .pbar .t2 { margin-left: 4px; flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pbar .t2 .a { font-size: 22px; line-height: 27px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbar .t2 .s2 { font-size: 12.5px; line-height: 16px; color: var(--text3); font-weight: 500; }
  .scroll { flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 12px; position: relative;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent); }
  .foot { flex: none; padding: 8px 16px 4px; }
  .pbtn { height: 52px; border-radius: 26px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; flex: 1; }
  .sbtn { height: 52px; border-radius: 26px; background: var(--glass2); color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 14.5px; font-weight: 700; flex: 1; }
  .addr { display: flex; align-items: center; min-height: 40px; }
  .addr .e { font-size: 15px; font-weight: 600; color: var(--accentInk); }
  .addr .l { font-size: 12.5px; color: var(--text3); margin-top: 2px; }
  .sth { display: flex; align-items: center; gap: 12px; min-height: 32px; margin-top: 24px; }
  .sth .n { width: 24px; height: 24px; border-radius: 50%; background: var(--tile); color: var(--tileInk); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
  .sth .w { font-size: 15px; line-height: 20px; font-weight: 600; }
  .spic { display: block; width: 100%; margin-top: 10px; border-radius: 12px; border: 1px solid var(--glassBorder); background: #fff; }
  .zh { margin-top: 8px; font-size: 12.5px; line-height: 16px; font-weight: 600; color: var(--text3); }
  .crop { width: 100%; aspect-ratio: 1; border-radius: 18px; background: radial-gradient(circle at 40% 35%, #F2C9A5 0 17%, transparent 18%), radial-gradient(ellipse at 50% 92%, #3E6A8A 0 34%, transparent 35%), linear-gradient(160deg, #A9C7DA, #E7EEF2); position: relative; overflow: hidden; }
  .crop::after { content: ""; position: absolute; inset: 7%; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 999px rgba(20,34,48,.46); }
  .stays { width: 172px; height: 120px; border-radius: 18px; border: 1px dashed #9AAAB6; display: grid; place-items: center; text-align: center; font-size: 14px; font-weight: 700; color: #4F5C66; background: #E7ECEF; }
  .stays small { display: block; font-size: 12px; font-weight: 600; color: #6A7781; margin-top: 4px; }
  svg.ic { display: block; flex: none; }
</style>

function robotWrap(card) {

function oldAsk(o) {
  let h = '';
  if (o.t) h += `<h3>${o.t}</h3>`;
  if (o.b) h += `<div class="b">${o.b}</div>`;
  if (o.c) h += `<div class="c${o.b || !o.t ? '' : ' nb'}"${!o.t && !o.b ? ' style="margin-top:0"' : ''}>${o.c}</div>`;
  const bt = (o.btns || []).map(([k, l]) => `<span class="db ${k}">${l}</span>`).join('');
  h += `<div class="bt">${bt}</div>`;
  return robotWrap(`<div class="od">${h}</div>`);
}
/* NEW: the one dialog. k = button option: text, pill (recommended), full, eq */
const tw = (s) => s.replace(/<[^>]*>/g, '').length * 7.5 + 20 + (s.includes('spin') ? 23 : 0);
function buttons(o, k) {
  const dis = o.dis, con = o.con, alt = o.alt;
  if (k === 'full') {
    let h = '<div class="bf">';
    if (con) h += `<span class="pl${o.off ? ' off' : o.danger ? ' bad' : ''}">${con}</span>`;
    if (alt) h += `<span class="tb">${alt}</span>`;
    if (dis) h += `<span class="tb${con ? ' q' : ''}">${dis}</span>`;
    return h + '</div>';
  }
  if (k === 'eq') {
    const st = (con || '').length > 15 || (dis || '').length > 15;
    const c = con ? `<span class="${o.off ? 'off' : o.danger ? 'd' : 'p'}">${con}</span>` : '';
    const d = dis ? `<span class="s">${dis}</span>` : '';
    return `<div class="be${st ? ' st' : ''}">${st ? c + d : d + c}</div>${alt ? `<div class="bealt"><span class="tb${o.altQuiet ? ' q' : ''}">${alt}</span></div>` : ''}`;
  }
  const pill = k === 'pill';
  const c = con ? (pill ? `<span class="pl${o.off ? ' off' : o.danger ? ' bad' : ''}">${con}</span>` : `<span class="tb${o.off ? ' off' : o.danger ? ' bad' : ''}">${con}</span>`) : '';
  const d = dis ? `<span class="tb${o.busy ? ' off' : ''}">${dis}</span>` : '';
  const a = alt ? `<span class="tb alt${o.altQuiet ? ' q' : ''}">${alt}</span>` : '';
  const width = (con ? tw(con) + (pill ? 12 : 0) : 0) + (dis ? tw(dis) : 0) + (alt ? tw(alt) : 0) + 8;
  if (width <= 296) return `<div class="br k-${k}">${a}${d}${c}</div>`;
  const pair = (con ? tw(con) + (pill ? 12 : 0) : 0) + (dis ? tw(dis) : 0) + 4;
  const altRow = alt ? `<div class="br k-${k}" style="justify-content:flex-start;margin:8px 0 -8px"><span class="tb alt${o.altQuiet ? ' q' : ''}" style="margin-left:-10px">${alt}</span></div>` : '';
  if (pair <= 296) return `${altRow}<div class="br k-${k}">${d}${c}</div>`;
  return `<div class="br k-${k} st">${c}${d}${a}</div>`;
}
function newAsk(o, k = 'pill') {
  let h = '';
  if (o.lead) h += o.lead;
  else h += `<div class="tt">${o.ti ? `<span class="ti${o.tiw ? ' warn' : ''}">${ic(o.ti, 18, 2.2)}</span>` : ''}${o.t}</div>`;
  if (o.b) h += `<div class="b">${o.b}</div>`;
  if (o.c) h += `<div class="c${o.lead && !o.b ? '' : ''}">${o.c}</div>`;
  if (o.note) h += `<div class="nt">${o.note}</div>`;
  h += buttons(o, k);
  return robotWrap(`<div class="nd">${h}</div>`);
}

}
