[versions]
# Keep AGP compatible with the installed Android Studio version.
agp = "9.4.1"
# Only the Compose compiler plugin now. AGP 9 compiles Kotlin itself, so there is no
# kotlin-android plugin to version.
kotlin = "2.4.10"
googleServices = "4.5.0"
crashlytics = "3.0.2"
ktlint = "14.2.0"
appUpdate = "2.1.0"
playReview = "2.0.2"
coroutinesPlayServices = "1.9.0"
coreKtx = "1.15.0"
coreSplashscreen = "1.2.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2026.06.01"
navigationCompose = "2.8.4"
# Lucide, in place of material-icons-extended. See the dependency itself for why.
lucide = "1.1.0"
# Credential Manager delegates to the platform provider on Android 14 and up, so this is the
# one dependency whose age is measured against the OS rather than against convenience. 1.3.0
# predates the last three Android releases; sign-ins that never returned were called down to
# it. Keep it and credentials-play-services-auth on the same version, always.
credentials = "1.6.0"
googleid = "1.2.0"
playServicesAuth = "21.6.0"
firebaseBom = "34.17.0"
okhttp = "4.12.0"
serialization = "1.9.0"
coil = "2.7.0"
work = "2.10.0"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
# Pinned rather than inherited. Compose's test artifact still drags in espresso 3.5.0, which
# reaches for InputManager.getInstance; that is gone on current Android and every UI test dies
# in setup with NoSuchMethodException. Nothing here calls espresso directly.
espresso = "3.7.0"
androidxTestRunner = "1.7.0"
# Video frames only (opt-in, -PvideoFrames): the real Compose screens drawn on the JVM, no device.
# Robolectric 4.17 (2026-09-10) and Roborazzi 1.75.0 (2026-09-21).
robolectric = "4.17"
roborazzi = "1.75.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
lucide = { group = "com.composables", name = "icons-lucide", version.ref = "lucide" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Identity: Credential Manager returns the Google ID token.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Authorization: a Drive access token, which is a separate concern from identity.
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-config = { group = "com.google.firebase", name = "firebase-config" }
play-app-update = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "appUpdate" }
play-review = { group = "com.google.android.play", name = "review-ktx", version.ref = "playReview" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

# Instrumented only. The one thing here that cannot be reasoned about from a desk is whether
# UsageStatsManager still answers for another app once package visibility is narrowed.
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

# Compose under test. Versioned by the BOM like every other Compose artifact, so these two
# never drift from the ui the app is actually built against.
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

# The same screens on the JVM, for the tutorial video's frames. See app/src/test/.../video.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
