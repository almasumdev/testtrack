name: Release APK

# ---------------------------------------------------------------------------
# Builds a signed release APK and publishes it as a downloadable GitHub
# Release, then deletes every older release so the page only ever holds the newest.
#
# TestTrack is side-loaded, so a GitHub Release is the distribution channel
# rather than a stopgap. It no longer holds QUERY_ALL_PACKAGES — a launcher
# <queries> filter answers the same questions — so Play is open to it, but the
# APK here stays the way testers get it. The same build also produces an AAB,
# uploaded to Play's Internal testing track — promotion from there to the
# Closed testing track the app actually runs on is a manual step in Play
# Console, not something this workflow does.
#
# Runs on every push that touches app/gradle files, but only actually builds
# and publishes when versionCode changed — see the check-version job.
# workflow_dispatch always builds, version bump or not, so a failed publish
# can be re-run by hand.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64      base64 of app/testtrack_release.jks
#                                  (base64 -w0 app/testtrack_release.jks)
#   ANDROID_KEYSTORE_PASSWORD    keystore store password
#   ANDROID_KEY_ALIAS            signing key alias (testtrack_release)
#   ANDROID_KEY_PASSWORD         signing key password
#   GOOGLE_SERVICES_JSON_BASE64  base64 of app/google-services.json
#   TESTTRACK_WEB_CLIENT_ID      OAuth *web* client id
#   TESTTRACK_GATE_URL           Apps Script membership endpoint
#   TESTTRACK_GROUP_URL          public Google Group page
#   PLAY_SERVICE_ACCOUNT_JSON    plain-text contents of a Google Play service account
#                                  key (Setup > API access in Play Console), granted
#                                  release permission on com.eazyverse.testtrack.
#                                  Not base64 — pasted in as-is.
#
# Both google-services.json and local.properties are gitignored, so everything
# the build needs arrives through the environment — `secret()` in
# app/build.gradle.kts reads System.getenv first for exactly this reason.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # One. The releases page is where testers get the app, not a shelf of old builds, and every
  # copy but the newest is one somebody can install by mistake and then report bugs from.
  #
  # The cost is that there is no earlier APK to fall back on if a build turns out bad. Rolling
  # back means building again from the previous commit, which is a push, not a download.
  KEEP: 1

  # The build whose signing key changed. Installs signed with the old key cannot
  # be updated over the top, so that one release carries an extra warning. Set to
  # the versionCode it applies to; every other build skips it, and the notice
  # expires on its own at the next bump.
  KEY_ROTATED_AT_CODE: 4

jobs:
  check-version:
    name: Check for a version bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare versionCode to the previous commit
        id: check
        run: |
          # A manual run always builds — it's how a failed publish gets retried
          # without waiting for the next real bump.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_code=$(awk -F'=' '/^[[:space:]]*versionCode[[:space:]]*=/{gsub(/[^0-9]/,"",$2); print $2; exit}' app/build.gradle.kts)
          old_code=$(git show "${{ github.event.before }}:app/build.gradle.kts" 2>/dev/null | awk -F'=' '/^[[:space:]]*versionCode[[:space:]]*=/{gsub(/[^0-9]/,"",$2); print $2; exit}')

          # An unresolvable "before" (new branch, force push, shallow history) leaves
          # old_code empty, which never equals new_code — build rather than skip.
          if [ "$old_code" = "$new_code" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, publish, prune
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: |
          # Anchored so versionNameSuffix and any debug block are skipped.
          name=$(awk -F'"' '/^[[:space:]]*versionName[[:space:]]*=/{print $2; exit}' app/build.gradle.kts)
          code=$(awk -F'=' '/^[[:space:]]*versionCode[[:space:]]*=/{gsub(/[^0-9]/,"",$2); print $2; exit}' app/build.gradle.kts)
          [ -n "$name" ] || { echo "could not read versionName"; exit 1; }
          echo "name=$name"                     >> "$GITHUB_OUTPUT"
          echo "code=$code"                     >> "$GITHUB_OUTPUT"
          # The run number keeps the tag unique across rebuilds of one version,
          # so a re-run never collides with an existing release.
          echo "tag=v$name-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore Firebase config
        env:
          CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          [ -n "$CONFIG" ] || { echo "GOOGLE_SERVICES_JSON_BASE64 is not set"; exit 1; }
          printf '%s' "$CONFIG" | base64 -d > app/google-services.json
          # Fail loudly here rather than three minutes later inside Gradle.
          grep -q '"package_name"' app/google-services.json

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          printf '%s' "$KEYSTORE" | base64 -d > app/testtrack_release.jks

      - name: Build signed release
        env:
          # file() inside app/build.gradle.kts resolves from the module directory,
          # so this is relative to app/, not to the repo root.
          TESTTRACK_KEYSTORE: testtrack_release.jks
          TESTTRACK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TESTTRACK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TESTTRACK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TESTTRACK_WEB_CLIENT_ID: ${{ secrets.TESTTRACK_WEB_CLIENT_ID }}
          TESTTRACK_GATE_URL: ${{ secrets.TESTTRACK_GATE_URL }}
          TESTTRACK_GROUP_URL: ${{ secrets.TESTTRACK_GROUP_URL }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify it is actually signed
        run: |
          # An unsigned APK builds perfectly happily when the keystore path is
          # wrong — the signingConfig is simply absent. The filename is the tell.
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { ls -R app/build/outputs/apk; echo "no signed APK — check TESTTRACK_KEYSTORE"; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | head -5

      - name: Name the artifact
        id: apk
        run: |
          out="TestTrack-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          notes="Download the APK below and open it to install.

          Updating over an existing install keeps you signed in, so there is nothing to
          uninstall and nothing to set up again.

          Built from \`${GITHUB_SHA:0:7}\`."

          # Prepend the rotation warning only on the build it applies to.
          if [ "$CODE" = "$KEY_ROTATED_AT_CODE" ]; then
            notes="> **Uninstall the previous version first.** The signing key changed in
          > this build, so Android will refuse to install it over the old one. Your
          > account is untouched, so sign in again and everything comes back.

          $notes"
          fi

          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.apk.outputs.path }}" \
            --title "TestTrack ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" \
            --notes "$notes"

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest first, drop the ones we are keeping, delete the rest along with
          # their tags — an orphaned tag is a release that looks deleted from the
          # releases page and is still cloneable.
          #
          # publishedAt, NOT createdAt: a release's createdAt is the date of the
          # commit its tag points at, so releases cut from the same commit all tie
          # and sort arbitrarily. Sorted that way this step deleted the newest
          # builds and kept the oldest — the exact opposite of the job.
          gh release list --limit 100 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .['"$KEEP"':] | .[].tagName' > stale.txt
          if [ ! -s stale.txt ]; then
            echo "nothing to prune — $KEEP or fewer releases"
            exit 0
          fi
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "deleting $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done < stale.txt

      - name: Publish bundle to Internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.eazyverse.testtrack
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ steps.version.outputs.name }}
